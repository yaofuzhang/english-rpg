<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v9</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:clamp(15px,4vw,18px)}
.screen{display:none;flex-direction:column;align-items:center;padding:clamp(12px,3vw,20px);min-height:100dvh;width:100%}
.screen.active{display:flex}
.w{width:92vw;max-width:640px}
.card{background:var(--card);border-radius:clamp(12px,3vw,16px);padding:clamp(12px,3vw,18px);border:2px solid #2d2d4a}

/* HOME */
#home-screen{gap:clamp(8px,2vh,14px);padding-top:clamp(12px,3vh,20px)}
.game-title{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.subtitle{color:var(--muted);font-size:clamp(.7rem,2.5vw,.82rem);text-align:center;margin-top:-6px}
.char-card{display:flex;align-items:center;gap:clamp(8px,2vw,12px)}.char-card .av{width:clamp(38px,11vw,48px);height:clamp(38px,11vw,48px);border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,5vw,1.5rem);flex-shrink:0}
.char-info{flex:1;min-width:0}.char-name{font-weight:700;font-size:clamp(.82rem,3vw,.95rem)}.char-lvl{color:var(--muted);font-size:clamp(.62rem,2.2vw,.72rem)}
.xp-bar{height:clamp(5px,1.5vw,7px);background:#2d2d4a;border-radius:3px;margin-top:4px;overflow:hidden}.xp-fill{height:100%;background:var(--xp);border-radius:3px;transition:width .5s}
.stats{display:flex;gap:clamp(4px,1.5vw,8px)}.stat{flex:1;text-align:center;padding:clamp(7px,2vw,10px);border-radius:clamp(8px,2.5vw,10px)}.stat .v{font-size:clamp(.9rem,3.5vw,1.15rem);font-weight:900}.stat .l{color:var(--muted);font-size:clamp(.5rem,1.8vw,.6rem)}
.guide-card{border:2px solid var(--accent);background:rgba(99,102,241,.08)}.guide-card h3{font-size:clamp(.78rem,3vw,.92rem);margin-bottom:4px}
.guide-item{display:flex;align-items:center;gap:6px;padding:clamp(3px,1vw,5px) 0;font-size:clamp(.7rem,2.5vw,.82rem);cursor:pointer}.guide-item .ch{width:clamp(16px,5vw,20px);height:clamp(16px,5vw,20px);border-radius:50%;border:2px solid #2d2d4a;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0}.guide-item .ch.done{background:var(--success);border-color:var(--success)}

.btn{border:none;border-radius:clamp(10px,3vw,14px);padding:clamp(10px,2.5vw,14px) clamp(16px,4vw,26px);font-size:clamp(.88rem,3.2vw,1.02rem);font-weight:700;cursor:pointer;transition:transform .15s;width:100%;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.btn-s{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}.btn-g{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a}
.btn-sm{padding:clamp(6px,1.5vw,8px) clamp(10px,3vw,14px);font-size:clamp(.68rem,2.5vw,.78rem);background:var(--card);border:2px solid #2d2d4a;color:var(--text);cursor:pointer;font-weight:600;border-radius:clamp(6px,2vw,10px)}.btn-sm:active{transform:scale(.97)}
.btn-row{display:flex;gap:clamp(4px,1.5vw,8px)}

/* LESSON */
.lesson-step{text-align:center;width:100%}.lesson-step .big-e{font-size:clamp(2rem,10vw,4rem);display:block;margin-bottom:6px}.lesson-step h3{font-size:clamp(1rem,4vw,1.3rem);margin-bottom:4px}.lesson-step p{color:var(--muted);font-size:clamp(.78rem,3vw,.92rem);line-height:1.6;margin-bottom:8px}
.lesson-step .sent{font-size:clamp(1rem,4.5vw,1.4rem);font-weight:700;padding:clamp(6px,2vw,10px);background:var(--card);border-radius:8px;margin:6px 0;display:inline-block;cursor:default}
.lesson-step .sent .s{color:#60a5fa}.lesson-step .sent .v{color:#f87171}.lesson-step .sent .o{color:#4ade80}.lesson-step .sent .c{color:#fbbf24}
.lesson-step .sent .tap{cursor:pointer;padding:2px 4px;border-radius:3px;transition:all .2s}.lesson-step .sent .tap.flash{animation:flash .4s}
@keyframes flash{0%,100%{background:transparent}50%{background:rgba(34,197,94,.5)}}

/* BATTLE */
#battle-screen{gap:clamp(5px,1.5vh,10px)}
.battle-top{display:flex;align-items:center;gap:6px;width:100%}
.hearts{display:flex;gap:2px;font-size:clamp(.95rem,3.5vw,1.15rem)}.heart.lost{opacity:.2}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:2px 8px;border-radius:14px;font-size:clamp(.58rem,2.2vw,.7rem);opacity:0}.combo-badge.on{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.q-box{background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(14px,3vw,20px);text-align:center;border:2px solid #2d2d4a;min-height:clamp(55px,12vh,75px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.q-text{font-size:clamp(.9rem,3.8vw,1.25rem);font-weight:700;line-height:1.6}
.q-passage{font-size:clamp(.72rem,2.8vw,.88rem);line-height:1.8;text-align:left;padding:clamp(8px,2.5vw,14px);border-radius:10px;border:2px solid #2d2d4a;max-height:clamp(140px,33vh,260px);overflow-y:auto;white-space:pre-wrap;background:var(--card)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,8px);width:100%}
.opt{background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(8px,2.5vw,10px);padding:clamp(10px,2.5vw,13px);font-size:clamp(.75rem,3vw,.92rem);color:var(--text);cursor:pointer;text-align:center;font-weight:600;word-break:break-word}.opt:active{transform:scale(.96)}
.opt.ok{background:var(--success);border-color:var(--success);color:#fff;animation:pop .3s}.opt.no{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}.opt:disabled{pointer-events:none;opacity:.6}.opt:disabled.ok,.opt:disabled.no{opacity:1}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{font-size:clamp(.8rem,3.2vw,1rem);font-weight:900;text-align:center;min-height:20px}.fb.good{color:var(--success)}.fb.bad{color:var(--danger)}
.highlight{background:rgba(240,192,64,.25);padding:1px 3px;border-radius:2px}

/* SCREEN FLASH for effects */
.screen-flash{position:fixed;inset:0;pointer-events:none;z-index:180;opacity:0;transition:opacity .15s}
.screen-flash.green{background:rgba(34,197,94,.1);opacity:1}.screen-flash.red{background:rgba(239,68,68,.1);opacity:1}
.screen-flash.gold{background:rgba(240,192,64,.15);opacity:1}

/* SPEAK */
.spk{background:rgba(99,102,241,.2);border:1.5px solid var(--accent);color:var(--accent);border-radius:16px;padding:clamp(4px,1.2vw,6px) clamp(8px,2.5vw,12px);font-size:clamp(.62rem,2.5vw,.75rem);cursor:pointer;display:inline-flex;align-items:center;gap:2px}.spk:active{background:rgba(99,102,241,.4)}

/* RESULT */
#result-screen{gap:clamp(8px,2vh,12px);justify-content:center;padding-top:clamp(8px,3vh,18px)}
.res-icon{font-size:clamp(2.5rem,10vw,4rem)}.res-title{font-size:clamp(1rem,4.5vw,1.4rem);font-weight:900;text-align:center}
.res-stats{display:flex;gap:clamp(4px,1.5vw,8px);width:100%}.res-stat{flex:1;border-radius:clamp(8px,2.5vw,10px);padding:clamp(7px,2vw,10px);text-align:center}
.res-stat .rv{font-size:clamp(.95rem,3.5vw,1.2rem);font-weight:900}.res-stat .rl{color:var(--muted);font-size:clamp(.48rem,1.8vw,.6rem)}

/* PARTICLES */
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.pt{position:absolute;font-size:clamp(.9rem,4vw,1.4rem);animation:pUp .7s ease-out forwards}
@keyframes pUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(.4) rotate(20deg)}}
.rp{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(1.6rem,6vw,2.2rem);font-weight:900;z-index:150;pointer-events:none;animation:rB .9s ease-out forwards}
@keyframes rB{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* MODALS */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border-radius:clamp(14px,4vw,18px);padding:clamp(18px,5vw,26px);text-align:center;max-width:clamp(300px,85vw,400px);width:92%;border:2px solid #2d2d4a}
.modal h2{font-size:clamp(1rem,4vw,1.3rem);margin-bottom:6px}.modal p{color:var(--muted);margin-bottom:10px;font-size:clamp(.72rem,2.8vw,.85rem)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#f0c040;padding:7px 14px;border-radius:10px;font-size:14px;z-index:300;border:1px solid #f0c040;max-width:90vw;text-align:center}

/* SCROLL */
.ts{width:100%;overflow-x:auto;white-space:nowrap;padding:4px 0;-webkit-overflow-scrolling:touch}.ts::-webkit-scrollbar{display:none}
.tc{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(8px,2.5vw,10px);padding:clamp(5px,1.5vw,8px) clamp(8px,2.5vw,12px);margin-right:clamp(4px,1.5vw,6px);text-align:center;cursor:pointer;font-size:clamp(.62rem,2.2vw,.75rem);font-weight:600;color:var(--text)}.tc:active{transform:scale(.95)}.tc.exam{border-color:var(--gold);background:rgba(240,192,64,.1)}.tc .emoji{font-size:clamp(.85rem,3.5vw,1.1rem);display:block}

/* BOSS */
.boss-name{font-size:clamp(1.1rem,4.5vw,1.4rem);font-weight:900;color:var(--danger)}.boss-hp-bar{width:80%;max-width:280px;height:clamp(14px,4vw,18px);background:#2d2d4a;border-radius:10px;overflow:hidden;margin:4px auto}.boss-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),#ff6b6b);border-radius:10px;transition:width .5s}
</style>
</head>
<body>
<div id="flash-overlay" class="screen-flash"></div>

<!-- HOME -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div><div class="subtitle">同等学力申硕 · RPG 训练营 <b style="color:var(--accent)">v9</b></div>
  <div class="card char-card w"><div class="av" id="ha">📖</div><div class="char-info"><div class="char-name" id="hn">英语难民</div><div class="char-lvl" id="hl">Lv.1</div><div class="xp-bar"><div class="xp-fill" id="hx" style="width:0%"></div></div><div style="font-size:clamp(.55rem,2vw,.65rem);color:var(--muted)" id="hxt">0/100 XP</div></div></div>
  <div class="stats w"><div class="stat card"><div class="v" style="color:var(--combo)" id="ss">0</div><div class="l">🔥签到</div></div><div class="stat card"><div class="v" style="color:var(--gold)" id="sc">0</div><div class="l">🪙金币</div></div><div class="stat card"><div class="v" style="color:#22d3ee" id="sb">0</div><div class="l">💎连击</div></div><div class="stat card"><div class="v" style="color:#a855f7" id="sr">0</div><div class="l">🧠复习</div></div></div>
  <div class="card guide-card w" id="gc"><h3>📅 今日修炼指南</h3><div id="gi"></div><div style="font-size:clamp(.56rem,2vw,.66rem);color:var(--muted);margin-top:4px;text-align:right" id="gr">全完成 +50💰</div></div>
  <button class="btn btn-p w" onclick="startBattle()" id="bb">⚡ 快速战斗 (5题·2分钟)</button>
  <button class="btn btn-s w" onclick="startLesson()">📖 互动语法课</button>
  <div class="btn-row w"><button class="btn-sm" onclick="startReading()" style="flex:1;color:var(--gold)">📰 阅读实战</button><button class="btn-sm" onclick="startWrite()" style="flex:1;color:var(--xp)">✍️ 写作填空</button></div>
  <div class="btn-row w"><button class="btn-sm" onclick="openShop()" style="flex:1;color:var(--gold)">🛒 商店</button><button class="btn-sm" onclick="openAch()" style="flex:1;color:#22d3ee">🏅 成就</button></div>
  <div style="color:var(--muted);font-size:clamp(.52rem,2vw,.62rem);margin-top:2px" class="w">🎯 自选专题</div>
  <div class="ts w" id="ts"></div>
  <button onclick="resetGame()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:4px 10px;border-radius:6px;font-size:clamp(.52rem,2vw,.62rem);cursor:pointer">🔄 重置</button>
</div>

<!-- TUTORIAL -->
<div id="tut-screen" class="screen"><div class="w" style="text-align:center"><div style="font-size:clamp(2rem,10vw,4rem);display:block;margin-bottom:8px" id="te"></div><h3 style="font-size:clamp(1rem,4vw,1.3rem);margin-bottom:4px" id="tt"></h3><p style="color:var(--muted);font-size:clamp(.78rem,3vw,.92rem);line-height:1.6" id="tp"></p></div><div class="btn-row w" style="margin-top:10px"><button class="btn-sm" id="tprev" onclick="tPrev()" style="flex:1">←</button><button class="btn btn-p" id="tnext" onclick="tNext()" style="flex:1">→</button></div></div>

<!-- LESSON -->
<div id="lsn-screen" class="screen"><div class="lesson-step w" id="lc"></div><div class="btn-row w" style="margin-top:10px"><button class="btn-sm" id="lprev" onclick="lPrev()" style="flex:1">←</button><button class="btn btn-p" id="lnext" onclick="lNext()" style="flex:1">→</button></div></div>

<!-- READING -->
<div id="read-screen" class="screen" style="align-items:stretch;gap:clamp(5px,1.5vh,8px)"><div style="display:flex;align-items:center;gap:6px" class="w"><button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 8px;border-radius:4px;font-size:clamp(.6rem,2.2vw,.68rem);cursor:pointer">← 回城</button><span style="color:var(--muted);font-size:clamp(.65rem,2.5vw,.78rem)">📰 阅读实战</span><span style="margin-left:auto;color:var(--combo);font-weight:700;font-size:clamp(.72rem,2.8vw,.88rem)" id="rt">⏱ 8:00</span></div>
<div id="rp" class="q-passage w"></div><div class="q-text w" id="rq"></div><div class="fb w" id="rfb"></div><div class="opts w" id="ro"></div></div>

<!-- WRITE -->
<div id="write-screen" class="screen" style="align-items:stretch;gap:clamp(5px,1.5vh,8px)"><div style="display:flex;align-items:center;gap:6px" class="w"><button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 8px;border-radius:4px;font-size:clamp(.6rem,2.2vw,.68rem);cursor:pointer">← 回城</button><span style="color:var(--muted);font-size:clamp(.65rem,2.5vw,.78rem)">✍️ 写作填空</span><span style="margin-left:auto;font-size:clamp(.58rem,2.2vw,.68rem);color:var(--muted)" id="wc">1/3</span></div><div class="card w" style="font-size:clamp(.82rem,3.2vw,.98rem);line-height:2" id="wp"></div><div class="btn-row w"><input type="text" id="wi" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:10px;color:var(--text);font-size:clamp(.78rem,3vw,.9rem);outline:none"><button class="btn-sm btn-p" onclick="checkW()" style="max-width:56px">提交</button></div><div style="text-align:center;font-size:clamp(.74rem,2.8vw,.86rem);min-height:20px" id="wf"></div><button class="btn-sm" onclick="spkW()" style="background:var(--card);border:1px solid var(--accent);color:var(--accent);margin:0 auto;width:auto">🔊 听模板</button></div>

<!-- BATTLE -->
<div id="battle-screen" class="screen"><div class="battle-top w"><button onclick="confirmQuit()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 7px;border-radius:4px;font-size:clamp(.56rem,2vw,.65rem);cursor:pointer">←</button><div class="hearts" id="hearts"></div><button onclick="spkB()" class="spk" id="b-spk">🔊</button><div class="combo-badge" id="cb"></div></div><div style="color:var(--muted);font-size:clamp(.6rem,2.2vw,.7rem);width:100%" id="qc"></div><div class="q-box w"><div class="q-text" id="qt"></div></div><div class="fb w" id="fb"></div><div class="opts w" id="op"></div><div style="font-size:clamp(.5rem,1.8vw,.6rem);color:var(--muted);text-align:center" id="rh"></div></div>

<!-- BOSS -->
<div id="boss-screen" class="screen"><div style="text-align:center" class="w"><div style="font-size:clamp(1.8rem,10vw,3rem)" id="bi"></div><div class="boss-name" id="bn"></div><div style="color:var(--muted);font-size:clamp(.6rem,2.5vw,.72rem);margin:2px 0">Boss战！</div><div class="boss-hp-bar"><div class="boss-hp-fill" id="bhf" style="width:100%"></div></div><div style="font-size:clamp(1.1rem,5vw,1.6rem);font-weight:900;color:var(--combo)" id="btimer"></div></div><div class="q-box w"><div class="q-text" id="bq"></div></div><div class="fb w" id="bfb"></div><div class="opts w" id="bo"></div></div>

<!-- RESULT -->
<div id="result-screen" class="screen"><div class="res-icon" id="ri"></div><div class="res-title" id="rti"></div><div class="res-stats w"><div class="res-stat card"><div class="rv" id="rc">0</div><div class="rl">✅正确</div></div><div class="res-stat card"><div class="rv" id="rm">0</div><div class="rl">🔥连击</div></div><div class="res-stat card"><div class="rv" id="rhp">3</div><div class="rl">❤️血量</div></div><div class="res-stat card"><div class="rv" style="color:var(--gold)" id="rcc">0</div><div class="rl">🪙金币</div></div></div><div style="color:var(--xp);font-weight:900;font-size:clamp(.85rem,3vw,1rem);text-align:center" id="rxp"></div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%" id="rloot"></div><div id="rlv"></div><button class="btn btn-s w" onclick="startLesson()">📖 哪里不会学哪里</button><button class="btn btn-p w" onclick="startBattle()">🔁 再来一局</button><button onclick="goHome()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 14px;border-radius:6px;font-size:clamp(.62rem,2.2vw,.7rem);cursor:pointer">🏠 回城</button></div>

<!-- MODALS -->
<div id="particles"></div>
<div id="lvl-mod" class="mo" style="display:none"><div class="modal"><div style="font-size:2.5rem">🎉</div><h2 id="lvl-t">升级！</h2><p id="lvl-d"></p><button class="btn btn-g w" onclick="document.getElementById('lvl-mod').style.display='none'">太棒了！</button></div></div>

const READINGS=[{title:'AI in Healthcare',text:`Artificial intelligence (AI) is rapidly changing the way we live and work. From virtual assistants on our smartphones to self-driving cars, AI technologies are becoming increasingly integrated into our daily lives.

function rLsn(){const s=lc.steps[lss];let h='';if(s.type==='show'){h='<div class="big-e">'+lc.icon+'</div><h3>'+s.t+'</h3><p>'+s.p+'</p>'+s.html+(s.extra||'')}else if(s.type==='tap'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p>'+s.html;ltDone=false}else if(s.type==='quiz'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p><div class="q-box w" style="margin-top:6px"><div class="q-text">'+s.q.q+'</div></div><div class="opts w" id="lqo" style="margin-top:4px"></div><div class="fb" id="lqf"></div>'}else if(s.type==='practice'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p><div class="q-box w" style="margin-top:6px"><div class="q-text" id="lpq"></div></div><div class="opts w" id="lpo" style="margin-top:4px"></div><div class="fb" id="lpf"></div>';lp=0}
  document.getElementById('lc').innerHTML=h;document.getElementById('lprev').style.display=lss===0?'none':'inline-flex';document.getElementById('lnext').style.display=s.type==='quiz'||s.type==='practice'?'none':'inline-flex';document.getElementById('lnext').textContent=ls>=lc.steps.length-1?'完成课程→':'下一步→';
  if(s.type==='quiz')rLsnQ(s.q);if(s.type==='practice')rLsnP();
}
function lTap(el){if(ltDone)return;const s=lc.steps[lss];const ok=el.dataset.ans==='1';el.classList.add('flash');ltDone=true;if(ok){sfxOK();flash('green');rp('✅','找到了！');toast(s.hint||'正确！')}else{sfxNO();flash('red');toast('不对哦。'+s.hint);setTimeout(()=>{ltDone=false;el.classList.remove('flash')},800)}}
function rLsnQ(q){const o=document.getElementById('lqo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{const ok=i===q.a;b.classList.add(ok?'ok':'no');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);const fb=document.getElementById('lqf');if(ok){fb.textContent='✅ 正确！';fb.className='fb good';sfxOK();flash('green')}else{fb.innerHTML='❌ <b>'+q.o[q.a]+'</b><br><small>'+q.h+'</small>';fb.className='fb bad';sfxNO();flash('red')}document.getElementById('lnext').style.display='inline-flex';setTimeout(lNext,ok?700:1600)};o.appendChild(b)})}
function rLsnP(){if(lp>=3){lNext();return}const q=lc.steps[lss].qs[lp];document.getElementById('lpq').textContent=q.q;const o=document.getElementById('lpo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{const ok=i===q.a;b.classList.add(ok?'ok':'no');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);const fb=document.getElementById('lpf');if(ok){fb.textContent='✅';fb.className='fb good';sfxOK();flash('green');lp++;setTimeout(rLsnP,500)}else{fb.innerHTML='❌ <b>'+q.o[q.a]+'</b>';fb.className='fb bad';sfxNO();flash('red');setTimeout(rLsnP,1200)}};o.appendChild(b)})}
function lNext(){if(lc&&lss<lc.steps.length-1){ls++;rLsn()}else{if(lc){S.lsnD=[...(S.lsnD||[]),lc.id];S.xp+=30;ss(S)}goHome();toast('🎉 课程完成！+30XP')}}
function lPrev(){if(lss>0){ls--;rLsn()}}

// ==================== READING ====================
let rd=null,ri=0,rtI=null,rs=0,rcr=0;
function startReading(){const r=READINGS[Math.floor(Math.random()*READINGS.length)];rd=r;ri=0;rcr=0;rs=480;ssr('read-screen');document.getElementById('rp').textContent=r.text;document.getElementById('rt').textContent='⏱ 8:00';sRQ();rtI=setInterval(()=>{rs--;const m=Math.floor(rs/60),s=rs%60;document.getElementById('rt').textContent='⏱ '+m+':'+(s<10?'0':'')+s;if(rs<=0){clearInterval(rtI);eR()}},1000)}
function sRQ(){if(ri>=rd.qs.length){clearInterval(rtI);eR();return}const q=rd.qs[ri];document.getElementById('rq').textContent=q.q;document.getElementById('rfb').textContent='';const o=document.getElementById('ro');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{const ok=i===q.a;b.classList.add(ok?'ok':'no');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);const fb=document.getElementById('rfb');if(ok){rcr++;fb.innerHTML='✅ <span class="highlight">'+q.h+'</span>';fb.className='fb good';sfxOK();flash('green');pt(window.innerWidth/2,window.innerHeight/2,'✅',4)}else{fb.innerHTML='❌ <b>'+q.o[q.a]+'</b> — '+q.h;fb.className='fb bad';sfxNO();flash('red')}setTimeout(()=>{ri++;sRQ()},ok?1000:2000)};o.appendChild(b)})}
function eR(){clearInterval(rtI);const e=rcr*20;S.xp+=e;S.tq+=rd.qs.length;S.tc+=rcr;ss(S);goHome();toast('📰 阅读'+rcr+'/'+rd.qs.length+' +'+e+'XP')}

// ==================== WRITING ====================
let wi=0,wc=0;
function startWrite(){wi=0;wc=0;showW();ssr('write-screen')}
function showW(){if(wi>=WX.length){const e=wc*15;S.xp+=e;S.wd=(S.wd||0)+wc;ss(S);goHome();toast('✍️ 完成！+'+e+'XP');return}const x=WX[wi];document.getElementById('wp').innerHTML=x.p;document.getElementById('wi').value='';document.getElementById('wf').textContent='';document.getElementById('wc').textContent=(wi+1)+'/'+WX.length;document.getElementById('wi').focus()}
function checkW(){const x=WX[wi];const inp=document.getElementById('wi').value.trim().toLowerCase();const fb=document.getElementById('wf');if(inp===x.a.toLowerCase()||lDist(inp,x.a.toLowerCase())<=2){wc++;fb.innerHTML='✅ '+x.a+'('+x.h+')';fb.style.color='var(--success)';sfxOK();flash('green');setTimeout(()=>{wi++;showW()},800)}else{fb.innerHTML='❌ 提示:'+x.h;fb.style.color='var(--danger)';sfxNO();flash('red');document.getElementById('wi').select()}}
function lDist(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n]}

// ==================== BATTLE ====================
function startBattle(to){
  bs={xb:1,cb:1,sh:0,ss:0,cs:0};['p3','p4','p2','p5','p6'].forEach(id=>{if(S.inv[id]&&S.inv[id]>0){if(id==='p3')bs.xb=2;else if(id==='p4')bs.cb=2;else if(id==='p2')bs.sh=1;else if(id==='p5')bs.ss=1;else if(id==='p6')bs.cs=2;S.inv[id]--;ss(S)}});
  let p=[];
  if(to==='v'){const n=Math.min(5,10);const ws=sh(ALL_VOCAB).slice(0,n);p=ws.map(w=>vocabQ(w))}
  else if(to&&B[to]){p=[...B[to]];const rqs=gRQ().filter(r=>r.data.bank===to).map(r=>{const q=B[r.data.bank]?.[r.data.idx];return q?{...q,_r:true,_rk:r.key}:null}).filter(Boolean);p=p.concat(rqs.slice(0,2))}
  else{const lv=gl(S.xp);gRQ().slice(0,2).forEach(r=>{const q=B[r.data.bank]?.[r.data.idx];if(q)p.push({...q,_r:true,_rk:r.key})});(lv.banks||[{b:'sen',w:5}]).forEach(({b,w})=>{if(b==='v'){const ws=sh(ALL_VOCAB).slice(0,Math.ceil(w*2));ws.forEach(w=>p.push(vocabQ(w)))}else{const qs=B[b]||[];p=p.concat(sh(qs).slice(0,Math.min(qs.length,Math.ceil(w*1.5))))}})}
  if(!p.length)p=[vocabQ(ALL_VOCAB[0])];
  const n=Math.min(5,p.length);bt={questions:sh(p).slice(0,n),idx:0,hp:3,combo:bs.cs,mc:0,cor:0,rxp:0,coins:0,drops:[]};ft=to||null;if(bs.sh>0)bt.shd=true;ssr('battle-screen');rBH();rBCB();rBQC();sBQ()
}
function rBH(){let h='';for(let i=0;i<3;i++)h+='<span class="heart'+(i>=bt.hp?' lost':'')+'">'+(i>=bt.hp?'🖤':'❤️')+'</span>';if(bs.sh>0)h+=' 🛡️';document.getElementById('hearts').innerHTML=h}
function rBCB(){const b=document.getElementById('cb');if(bt.combo>=2){b.textContent='🔥 x'+bt.combo;b.classList.add('on')}else{b.classList.remove('on')}}
function rBQC(){const q=bt.questions[bt.idx];const tag=q?._r?' <span style="color:var(--accent);font-size:.62rem">🧠复习</span>':'';document.getElementById('qc').innerHTML=(bt.idx+1)+'/5'+tag;document.getElementById('rh').textContent=''}
function sBQ(){if(bt.idx>=bt.questions.length||bt.hp<=0){eB();return}const q=bt.questions[bt.idx];document.getElementById('qt').innerHTML=q.q;document.getElementById('fb').textContent='';document.getElementById('fb').className='fb';const o=document.getElementById('op');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>aBQ(i);o.appendChild(b)});rBQC();if(!q._r&&Math.random()>0.85)document.getElementById('rh').textContent='🍀 可能暴击！'}
function aBQ(idx){
  const q=bt.questions[bt.idx];const ok=idx===q.a;const os=document.querySelectorAll('#op .opt');os.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});if(!ok)os[idx].classList.add('no');
  if(!ft){const bk=Object.keys(B).find(k=>B[k].some(x=>x.q===q.q))||'v';const bi=(B[bk]||[]).findIndex(x=>x.q===q.q);if(bi>=0)uR(bk,bi,ok);if(ok&&q._r)S.rdn=(S.rdn||0)+1}
  if(ok){bt.cor++;bt.combo++;if(bt.combo>bt.mc)bt.mc=bt.combo;const r=Math.random();let bx=0,bc=0,drop='';if(r>0.88){bx=rnd(20,30);bc=rnd(15,25);drop='⚡超级暴击！';vibe()}else if(r>0.72){bx=rnd(10,15);bc=rnd(5,15);drop='🌟幸运暴击！'}else if(r>0.5){bc=rnd(3,8);drop='💰金币掉落！'}else{sfxOK()}if(bt.combo>=3){bx+=Math.floor(bt.combo/3)*5;sfxCB()}const e=(10+bx)*bs.xb;const cc=(bc||3)*bs.cb;bt.rxp+=e;bt.coins+=cc;if(drop)bt.drops.push(drop);document.getElementById('fb').innerHTML='✅ '+(drop||'')+' +'+e+'XP +'+cc+'💰'+(bt.combo>=3?' 🔥'+bt.combo+'连击':'');document.getElementById('fb').className='fb good';flash('green');pt(window.innerWidth/2,window.innerHeight/2,'✨',5);if(bt.combo>=2)rp('🔥',bt.combo+'连击！');if(bt.combo===3)toast('不错！3连击！');if(bt.combo===5)toast('🔥 五连绝世！');if(drop)pt(window.innerWidth/2,window.innerHeight/2,bx>15?'⚡':'💰',8)
  }else{if(bs.sh>0){bs.sh=0;document.getElementById('fb').innerHTML='🛡️ 护盾！';document.getElementById('fb').className='fb good';flash('green')}else{bt.hp--;if(bs.ss&&bt.combo>0){bs.ss=0;document.getElementById('fb').innerHTML='❌ <b>'+q.o[q.a]+'</b><br>🔒 连击保护！'}else{document.getElementById('fb').innerHTML='❌ <b>'+q.o[q.a]+'</b><br><small>'+q.h+'</small>';bt.combo=0}sfxNO();flash('red');pt(window.innerWidth/2,window.innerHeight/2,'💔',3)}document.getElementById('fb').className='fb bad'}
  if(ok&&(ft||'').startsWith('v'))S.vc++;rBH();rBCB();rBQC();setTimeout(()=>{bt.idx++;sBQ()},ok?650:1800)
}
function eB(){
  S.tq+=bt.questions.length;S.tc+=bt.cor;S.xp+=bt.rxp;S.coins+=bt.coins;S.tcc+=bt.coins;if(bt.mc>S.bc)S.bc=bt.mc;if(bt.cor===bt.questions.length&&bt.questions.length>=5)S.pf++;const ol=S.lv;const nl=gl(S.xp);S.lv=nl.lv;const td=new Date().toDateString();if(S.ddt===td)S.dd=Math.min(3,S.dd+1);else{S.dd=1;S.ddt=td}if(S.dd>=3&&!S._cd){S.coins+=50;S.tcc+=50;S.xp+=30;S._cd=true;toast('📅 每日完成！+50💰+30XP')}if(S.lpd){const y=new Date(Date.now()-86400000).toDateString();if(S.lpd===y)S.st++;else if(S.lpd!==td)S.st=1}else S.st=1;S.lpd=td;ss(S);checkA();
  ssr('result-screen');const p=bt.cor===bt.questions.length;document.getElementById('ri').textContent=p?'👑':bt.cor>=3?'✨':'💪';document.getElementById('rti').textContent=p?'完美！':bt.cor>=3?'不错！':'加油！';document.getElementById('rc').textContent=bt.cor+'/5';document.getElementById('rm').textContent=bt.mc;document.getElementById('rhp').textContent=bt.hp;document.getElementById('rcc').textContent='+'+bt.coins;document.getElementById('rxp').textContent='+'+bt.rxp+' XP'+(bs.xb>1?'(双倍!)':'');document.getElementById('rloot').innerHTML=bt.drops.length?bt.drops.filter((v,i,a)=>a.indexOf(v)===i).map(d=>'<span style="background:var(--card);border-radius:6px;padding:3px 6px;font-size:.65rem;border:1px solid #2d2d4a">'+d+'</span>').join(''):'';if(nl.lv>ol){sfxLV();document.getElementById('rlv').innerHTML='<div style="color:var(--gold);font-weight:900;font-size:1rem;margin-top:4px">🎉 '+nl.icon+' '+nl.title+'</div>';pt(window.innerWidth/2,window.innerHeight/2,'🎉',15);flash('gold');setTimeout(()=>{document.getElementById('lvl-t').textContent='晋升 '+nl.title+'！';document.getElementById('lvl-d').textContent=nl.desc+' | '+S.xp+' XP';document.getElementById('lvl-mod').style.display='flex'},400);if(nl.lv===5||nl.lv===10)setTimeout(()=>startBoss(nl.lv),800)}else document.getElementById('rlv').innerHTML=''}
function confirmQuit(){if(confirm('逃走？进度丢失。'))goHome()}

// ==================== BOSS ====================
let boss=null,bti=null;
function startBoss(lv){const cfg=lv===5?{n:'词汇巨兽',e:'🐉',hp:5,t:45,rw:400,bks:['sen','cl']}:{n:'语法魔龙',e:'👹',hp:8,t:60,rw:900,bks:['sen','cl','tc','ex']};let p=[];cfg.bks.forEach(b=>{p=p.concat(sh(B[b]||[]).slice(0,10))});p=p.concat(sh(ALL_VOCAB).slice(0,5).map(w=>vocabQ(w)));boss={cfg,p:sh(p),idx:0,bHP:cfg.hp,pHP:3,t:cfg.t,cor:0};document.getElementById('bi').textContent=cfg.e;document.getElementById('bn').textContent=cfg.n;document.getElementById('bhf').style.width='100%';document.getElementById('btimer').textContent='⏱ '+cfg.t+'s';ssr('boss-screen');bossTick();sBSQ()}
function bossTick(){if(bti)clearInterval(bti);bti=setInterval(()=>{boss.t--;document.getElementById('btimer').textContent='⏱ '+boss.t+'s';if(boss.t<=0||boss.pHP<=0||boss.bHP<=0){clearInterval(bti);eBS()}},1000)}
function sBSQ(){if(boss.pHP<=0||boss.bHP<=0||boss.t<=0){eBS();return}const q=boss.p[boss.idx%boss.p.length];document.getElementById('bq').innerHTML=q.q;const o=document.getElementById('bo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>aBSQ(i);o.appendChild(b)})}
function aBSQ(idx){const q=boss.p[boss.idx%boss.p.length];const ok=idx===q.a;const os=document.querySelectorAll('#bo .opt');os.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});if(!ok){os[idx].classList.add('no');boss.pHP--;sfxNO();flash('red');pt(window.innerWidth/2,window.innerHeight/2,'💔',4)}else{boss.bHP--;boss.cor++;sfxOK();flash('green');pt(window.innerWidth/2,window.innerHeight/2,'⚔️',6);vibe()}document.getElementById('bhf').style.width=(boss.bHP/boss.cfg.hp*100)+'%';document.getElementById('bfb').textContent=ok?'⚔️ Boss -1HP':'💔 受伤！';setTimeout(()=>{boss.idx++;sBSQ()},550)}
function eBS(){if(bti)clearInterval(bti);const w=boss.bHP<=0;if(w){S.bk=(S.bk||0)+1;S.xp+=boss.cfg.rw;ss(S);checkA();sfxLV();pt(window.innerWidth/2,window.innerHeight/2,'🎉',20)}document.getElementById('bm-i').textContent=w?'👑':'💀';document.getElementById('bm-t').textContent=w?'击败 '+boss.cfg.n+'！':'失败';document.getElementById('bm-d').textContent=w?'+'+boss.cfg.rw+'XP':boss.cfg.n+'剩'+boss.bHP+'血。再来！';document.getElementById('boss-mod').style.display='flex'}

// ==================== SHOP & ACHIEVEMENTS ====================
function openShop(){document.getElementById('shb').textContent=S.coins;document.getElementById('sg').innerHTML=SHOP.map(i=>{const o=S.inv[i.id]||0;return'<div class="card" style="text-align:center"><span style="font-size:1.8rem;display:block">'+i.e+'</span><b style="font-size:.8rem">'+i.n+'</b><div style="color:var(--muted);font-size:.6rem">'+i.d+'</div><div style="color:var(--gold);font-size:.72rem">🪙'+i.p+' · '+o+'</div><button onclick="buyI(\''+i.id+'\')" '+(S.coins<i.p?'disabled':'')+' style="background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.65rem;margin-top:3px">购买</button></div>'}).join('');document.getElementById('shop-mod').style.display='flex'}
function buyI(id){const i=SHOP.find(x=>x.id===id);if(!i||S.coins<i.p)return;S.coins-=i.p;S.inv[id]=(S.inv[id]||0)+1;ss(S);sfxOK();rp('🛒','+1 '+i.n);openShop()}
function checkA(){ACH.forEach(a=>{if(!S.ua.includes(a.id)&&a.c(S)){S.ua.push(a.id);ss(S);sfxLV();pt(window.innerWidth/2,window.innerHeight/2,'🏅',10);setTimeout(()=>rp('🏅',a.n),200)}})}
function openAch(){document.getElementById('ag').innerHTML=ACH.map(a=>{const u=S.ua.includes(a.id);return'<div class="card" style="text-align:center;opacity:'+(u?'1':'.4')+';border-color:'+(u?'var(--gold)':'')+'"><span style="font-size:1.3rem;display:block">'+(u?a.e:'🔒')+'</span><b style="font-size:.7rem">'+a.n+'</b><br><small style="color:var(--muted);font-size:.6rem">'+a.d+'</small></div>'}).join('');document.getElementById('ach-mod').style.display='flex'}
function resetGame(){if(confirm('重置所有存档？')){S=JSON.parse(JSON.stringify(D));ss(S);goHome()}}

try{rH()}catch(e){S.td=true;ss(S);try{rH()}catch(e2){document.getElementById('home-screen').innerHTML='<div style="text-align:center;padding:30px"><h3>⚠️ 加载异常</h3><p style="color:var(--muted);margin:8px 0">请清除浏览器缓存</p><button class="btn btn-p" onclick="localStorage.clear();location.reload()">清除并刷新</button></div>'}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
