<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v3 · Degree English RPG</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444;--purple:#a855f7;--cyan:#22d3ee}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;align-items:center;padding:16px;min-height:100dvh}
.screen.active{display:flex}
.screen-col{display:none;flex-direction:column;padding:16px;min-height:100dvh}
.screen-col.active{display:flex}

/* HOME */
#home-screen{justify-content:flex-start;gap:14px;padding-top:30px}
.game-title{font-size:2rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.game-subtitle{color:var(--muted);font-size:.8rem;text-align:center;margin-top:-8px}
.character-card{background:var(--card);border-radius:18px;padding:16px;width:100%;max-width:360px;display:flex;align-items:center;gap:12px;border:2px solid #2d2d4a}
.avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-weight:700;font-size:.95rem}
.char-title{color:var(--muted);font-size:.7rem;margin-top:1px}
.xp-bar-wrap{height:6px;background:#2d2d4a;border-radius:3px;margin-top:5px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--xp);border-radius:3px;transition:width .5s}
.xp-text{font-size:.65rem;color:var(--muted);margin-top:1px}
.coin-row{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--gold);font-weight:700;margin-top:2px}
.stats-row{display:flex;gap:8px;width:100%;max-width:360px}
.stat-box{flex:1;background:var(--card);border-radius:12px;padding:10px;text-align:center;border:2px solid #2d2d4a}
.stat-val{font-size:1.2rem;font-weight:900}
.stat-val.fire{color:var(--combo)}.stat-val.gold{color:var(--gold)}.stat-val.ice{color:var(--cyan)}.stat-val.purple{color:var(--purple)}
.stat-label{color:var(--muted);font-size:.6rem;margin-top:1px}
.btn{border:none;border-radius:14px;padding:13px 28px;font-size:1rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;width:100%;max-width:360px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-learn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 20px rgba(34,197,94,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a;box-shadow:0 4px 20px rgba(240,192,64,.3)}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff}
.btn-small{padding:8px 16px;font-size:.8rem;max-width:160px}
.daily-bar{background:var(--card);border-radius:14px;padding:12px 16px;width:100%;max-width:360px;border:2px solid #2d2d4a;display:flex;align-items:center;gap:10px}
.daily-progress{flex:1;height:6px;background:#2d2d4a;border-radius:3px;overflow:hidden}
.daily-fill{height:100%;background:var(--combo);border-radius:3px;transition:width .5s}
.topic-scroll{width:100%;max-width:360px;overflow-x:auto;white-space:nowrap;padding:4px 0;-webkit-overflow-scrolling:touch}
.topic-scroll::-webkit-scrollbar{display:none}
.topic-chip{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:12px;padding:10px 16px;margin-right:8px;text-align:center;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--text);transition:all .15s;vertical-align:top}
.topic-chip:active{transform:scale(.95)}
.topic-chip .emoji{font-size:1.2rem;display:block;margin-bottom:2px}
.topic-chip.exam{border-color:var(--gold);background:rgba(240,192,64,.1)}

/* BATTLE */
#battle-screen{gap:12px}
.battle-header{display:flex;align-items:center;gap:8px;width:100%;max-width:400px}
.hearts{display:flex;gap:3px;font-size:1.2rem}
.heart{transition:transform .3s,opacity .3s}.heart.lost{opacity:.2;transform:scale(.8)}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:3px 8px;border-radius:16px;font-size:.7rem;opacity:0;transition:opacity .3s}
.combo-badge.active{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.reward-pop{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:2rem;font-weight:900;z-index:150;pointer-events:none;animation:rewardBoom 1s ease-out forwards}
@keyframes rewardBoom{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.question-counter{color:var(--muted);font-size:.7rem;width:100%;max-width:400px}
.dot{width:7px;height:7px;border-radius:50%;background:#2d2d4a;transition:background .3s;display:inline-block;margin:0 2px}
.dot.done{background:var(--success)}.dot.wrong{background:var(--danger)}.dot.current{background:var(--accent);animation:pulse 1s infinite}
.question-box{background:var(--card);border-radius:16px;padding:22px 16px;width:100%;max-width:400px;text-align:center;border:2px solid #2d2d4a;min-height:85px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.question-text{font-size:1.15rem;font-weight:700;line-height:1.6}
.speak-btn{background:rgba(99,102,241,.2);border:1px solid var(--accent);color:var(--accent);border-radius:20px;padding:6px 14px;font-size:.8rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.speak-btn:active{background:rgba(99,102,241,.4)}.speak-btn.speaking{background:var(--accent);color:#fff}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:400px}
.option-btn{background:var(--card);border:2px solid #2d2d4a;border-radius:12px;padding:14px;font-size:.9rem;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-weight:600;position:relative}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{background:var(--success);border-color:var(--success);color:#fff;animation:popIn .3s}
.option-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}
.option-btn:disabled{pointer-events:none;opacity:.6}
.option-btn:disabled.correct,.option-btn:disabled.wrong{opacity:1}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.feedback-text{font-size:1rem;font-weight:900;text-align:center;min-height:26px}
.feedback-text.good{color:var(--success)}.feedback-text.bad{color:var(--danger)}

/* RESULT */
#result-screen{gap:14px;justify-content:center;padding-top:20px}
.result-icon{font-size:3.5rem}
.result-title{font-size:1.4rem;font-weight:900;text-align:center}
.result-stats{display:flex;gap:8px;width:100%;max-width:340px}
.result-stat{flex:1;background:var(--card);border-radius:12px;padding:12px;text-align:center;border:2px solid #2d2d4a}
.result-stat .val{font-size:1.2rem;font-weight:900}
.result-stat .lbl{color:var(--muted);font-size:.6rem;margin-top:1px}
.xp-gain{color:var(--xp);font-weight:900;font-size:1rem;text-align:center}
.loot-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.loot-item{background:var(--card);border-radius:10px;padding:8px 12px;border:1px solid #2d2d4a;font-size:.8rem}

/* LEARN */
#learn-screen{padding:16px;align-items:stretch}
.learn-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.learn-content{background:var(--card);border-radius:14px;padding:18px;border:2px solid #2d2d4a;line-height:1.8;font-size:.9rem;overflow-y:auto;flex:1;max-height:calc(100dvh - 160px)}
.learn-content h3{color:var(--gold);margin:14px 0 6px;font-size:1rem}
.learn-content h3:first-child{margin-top:0}
.learn-content .ex{background:#0a0a0a;border-radius:8px;padding:10px;margin:6px 0;font-family:monospace;font-size:.8rem;border-left:3px solid var(--accent)}
.learn-content .tip{background:rgba(240,192,64,.1);border-radius:8px;padding:8px;margin:6px 0;font-size:.8rem;border-left:3px solid var(--gold)}
.learn-content .wrong-spot{background:rgba(248,113,113,.1);border-radius:8px;padding:8px;margin:6px 0;font-size:.8rem;border-left:3px solid var(--danger)}
.learn-actions{padding:12px 0;text-align:center}

/* SHOP */
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}
.shop-item{background:var(--card);border-radius:14px;padding:14px;border:2px solid #2d2d4a;text-align:center}
.shop-item .icon{font-size:2rem;display:block;margin-bottom:4px}
.shop-item .name{font-weight:700;font-size:.85rem}
.shop-item .desc{color:var(--muted);font-size:.65rem;margin:4px 0}
.shop-item .price{color:var(--gold);font-weight:700;font-size:.8rem}
.shop-item button{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:.75rem;cursor:pointer;font-weight:600}
.shop-item button:disabled{opacity:.4;pointer-events:none}
.shop-item button:active{transform:scale(.95)}

/* BOSS */
.boss-intro{text-align:center}
.boss-name{font-size:1.4rem;font-weight:900;color:var(--danger)}
.boss-hp-bar{width:80%;max-width:300px;height:20px;background:#2d2d4a;border-radius:10px;overflow:hidden;margin:8px auto}
.boss-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),#ff6b6b);border-radius:10px;transition:width .5s}
.timer{font-size:1.5rem;font-weight:900;color:var(--combo)}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:360px}
.ach-item{background:var(--card);border-radius:10px;padding:10px;border:2px solid #2d2d4a;text-align:center;font-size:.75rem}
.ach-item.unlocked{border-color:var(--gold)}
.ach-item.locked{opacity:.4}
.ach-item .a-icon{font-size:1.5rem;display:block}

/* PARTICLES */
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:1.4rem;animation:particleUp .8s ease-out forwards}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5) rotate(20deg)}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:20px;padding:28px 22px;text-align:center;max-width:340px;width:92%;border:2px solid #2d2d4a}
.modal h2{font-size:1.4rem;margin-bottom:6px}
.modal p{color:var(--muted);margin-bottom:14px;font-size:.85rem}

/* TUTORIAL */
.tut-step{text-align:center}
.tut-step .big-emoji{font-size:4rem;display:block;margin-bottom:12px}
.tut-step h3{font-size:1.2rem;margin-bottom:6px}
.tut-step p{color:var(--muted);font-size:.85rem;margin-bottom:12px;line-height:1.6}
.tut-step .demo-sentence{font-size:1.3rem;font-weight:700;padding:12px;background:var(--card);border-radius:10px;margin:8px 0;display:inline-block}
.tut-step .demo-sentence .s{color:#60a5fa}.tut-step .demo-sentence .v{color:#f87171}.tut-step .demo-sentence .o{color:#4ade80}.tut-step .demo-sentence .c{color:#fbbf24}

@media(max-width:360px){.game-title{font-size:1.6rem}.question-text{font-size:1rem}.option-btn{font-size:.8rem;padding:12px 8px}.options-grid{gap:6px}}
</style>
</head>
<body>

<!-- ==================== HOME ==================== -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div>
  <div class="game-subtitle" id="home-sub">同等学力申硕 · RPG 训练营</div>

  <div class="character-card">
    <div class="avatar" id="avatar-icon">📖</div>
    <div class="char-info">
      <div class="char-name" id="char-name">英语难民</div>
      <div class="char-title" id="char-title">Lv.1 · 从零开始</div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-val fire" id="stat-streak">0</div><div class="stat-label">🔥签到</div></div>
    <div class="stat-box"><div class="stat-val gold" id="stat-coins">0</div><div class="stat-label">🪙金币</div></div>
    <div class="stat-box"><div class="stat-val ice" id="stat-best">0</div><div class="stat-label">💎连击</div></div>
    <div class="stat-box"><div class="stat-val purple" id="stat-ach">0</div><div class="stat-label">🏅成就</div></div>
  </div>

  <div class="daily-bar" id="daily-bar">
    <span>📅</span><span style="font-size:.8rem" id="daily-text">今日任务 0/3</span>
    <div class="daily-progress"><div class="daily-fill" id="daily-fill" style="width:0%"></div></div>
    <span style="color:var(--gold);font-size:.75rem" id="daily-reward">+50💰</span>
  </div>

  <button class="btn btn-primary" onclick="startBattle()">⚡ 开始修炼</button>
  <button class="btn btn-learn" onclick="startLearn()">📖 学习模式</button>

  <div style="color:var(--muted);font-size:.7rem;margin-top:2px">🎯 自选专题</div>
  <div class="topic-scroll" id="topic-scroll"></div>

  <div style="display:flex;gap:8px;width:100%;max-width:360px">
    <button class="btn-small" onclick="openShop()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--gold);flex:1;max-width:none">🛒 商店</button>
    <button class="btn-small" onclick="openAchievements()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--cyan);flex:1;max-width:none">🏅 成就</button>
  </div>
  <button onclick="resetGame()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:6px 16px;border-radius:8px;font-size:.7rem;cursor:pointer">🔄 重置存档</button>
</div>

<!-- ==================== TUTORIAL ==================== -->
<div id="tutorial-screen" class="screen">
  <div class="tut-step" id="tut-content"></div>
  <div style="display:flex;gap:8px;margin-top:16px;width:100%;max-width:340px">
    <button class="btn-small" id="tut-prev" onclick="tutPrev()" style="background:transparent;border:1px solid #2d2d4a;color:var(--muted);flex:1;max-width:none">← 上一步</button>
    <button class="btn btn-primary" id="tut-next" onclick="tutNext()" style="flex:1;max-width:none">下一步 →</button>
  </div>
</div>

<!-- ==================== LEARN ==================== -->
<div id="learn-screen" class="screen">
  <div class="learn-header">
    <button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:6px 14px;border-radius:8px;font-size:.8rem;cursor:pointer">← 回城</button>
    <span style="color:var(--muted);font-size:.8rem" id="learn-label">Lv.1 课程</span>
    <button onclick="speak(document.getElementById('learn-content').textContent)" class="speak-btn" style="margin-left:auto">🔊 朗读</button>
  </div>
  <div class="learn-content" id="learn-content"></div>
  <div class="learn-actions"><button class="btn btn-primary" onclick="startBattle()">⚔️ 学完了，开打！</button></div>
</div>

<!-- ==================== BATTLE ==================== -->
<div id="battle-screen" class="screen">
  <div class="battle-header">
    <button onclick="confirmQuit()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:4px 10px;border-radius:6px;font-size:.7rem;cursor:pointer">←</button>
    <div class="hearts" id="hearts"></div>
    <button onclick="speakBattleQ()" class="speak-btn" id="battle-speak-btn">🔊</button>
    <div class="combo-badge" id="combo-badge">🔥 x1</div>
  </div>
  <div class="question-counter" id="question-counter"></div>
  <div class="question-box"><div class="question-text" id="question-text"></div></div>
  <div class="feedback-text" id="feedback"></div>
  <div class="options-grid" id="options"></div>
  <div style="font-size:.7rem;color:var(--muted);text-align:center" id="reward-hint"></div>
</div>

<!-- ==================== BOSS ==================== -->
<div id="boss-screen" class="screen">
  <div class="boss-intro">
    <div style="font-size:3rem" id="boss-icon">👹</div>
    <div class="boss-name" id="boss-name">语法魔龙</div>
    <div style="color:var(--muted);font-size:.8rem;margin:4px 0">Boss 战！答错即死，连对扣血</div>
    <div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill" style="width:100%"></div></div>
    <div class="timer" id="boss-timer">⏱ 30s</div>
  </div>
  <div class="question-box"><div class="question-text" id="boss-question"></div></div>
  <div class="feedback-text" id="boss-feedback"></div>
  <div class="options-grid" id="boss-options"></div>
</div>

<!-- ==================== RESULT ==================== -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-stats">
    <div class="result-stat"><div class="val" id="res-correct">0</div><div class="lbl">✅正确</div></div>
    <div class="result-stat"><div class="val" id="res-combo">0</div><div class="lbl">🔥连击</div></div>
    <div class="result-stat"><div class="val" id="res-hp">3</div><div class="lbl">❤️血量</div></div>
    <div class="result-stat"><div class="val" id="res-coins" style="color:var(--gold)">0</div><div class="lbl">🪙金币</div></div>
  </div>
  <div class="xp-gain" id="xp-gain"></div>
  <div class="loot-row" id="loot-row"></div>
  <div id="level-up-msg"></div>
  <button class="btn btn-learn" onclick="startLearn()">📖 哪里不会学哪里</button>
  <button class="btn btn-primary" onclick="startBattle()">🔁 再来一局</button>
  <button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:8px 20px;border-radius:8px;font-size:.8rem;cursor:pointer">🏠 回城</button>
</div>

<!-- ==================== MODALS ==================== -->
<div id="particles"></div>
<div id="shop-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:380px;max-height:90dvh;overflow-y:auto">
    <div style="font-size:2rem">🛒</div>
    <h2>道具商店</h2>
    <p style="color:var(--gold)">🪙 <span id="shop-balance">0</span></p>
    <div class="shop-grid" id="shop-items"></div>
    <button class="btn-small" onclick="document.getElementById('shop-modal').style.display='none'" style="margin-top:12px;background:transparent;color:var(--muted);border:1px solid #2d2d4a">关闭</button>
  </div>
</div>
<div id="ach-modal" class="modal-overlay" style="display:none">
  <div class="modal" style="max-width:380px;max-height:90dvh;overflow-y:auto">
    <div style="font-size:2rem">🏅</div><h2>成就殿堂</h2>
    <div class="ach-grid" id="ach-list"></div>
    <button class="btn-small" onclick="document.getElementById('ach-modal').style.display='none'" style="margin-top:12px;background:transparent;color:var(--muted);border:1px solid #2d2d4a">关闭</button>
  </div>
</div>
<div id="level-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div style="font-size:3rem">🎉</div><h2 id="level-title">升级！</h2>
    <p id="level-desc"></p>
    <button class="btn btn-gold" onclick="document.getElementById('level-modal').style.display='none'">太棒了！</button>
  </div>
</div>
<div id="boss-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div style="font-size:3rem" id="boss-result-icon">👑</div>
    <h2 id="boss-result-title"></h2>

function speak(text,rate=0.9){
  if(!window.speechSynthesis)return;

  u.lang='en-US';u.rate=rate;u.pitch=1;u.volume=1;
  u.onend=()=>speaking=false;
  speechSynthesis.speak(u);
  setTimeout(()=>speaking=false,5000);
}
function speakWord(word){speak(word,0.7)}

// ==================== HELPERS ====================
function gl(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i].xp)return LEVELS[i];return LEVELS[0]}
function xn(lv){return (LEVELS.find(l=>l.lv===lv+1)||{}).xp||9999}
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}

let ac=null;
function bp(f,d,t,v){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'square';o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

  // Topic scroll
  const topics=[
    {id:'sentence-basic',e:'📐',t:'五大句型'},{id:'clause-markers',e:'🔗',t:'从句标记'},
    {id:'sentence-mixed',e:'🔪',t:'拆句实战'},{id:'vocab-1',e:'📝',t:'词汇01'},
    {id:'vocab-2',e:'📝',t:'词汇02'},{id:'vocab-3',e:'📝',t:'词汇03'},
    {id:'vocab-4',e:'📝',t:'词汇04'},{id:'reading',e:'📖',t:'阅读态度'},
    {id:'cloze',e:'🧩',t:'完形搭配'},{id:'translation',e:'🌐',t:'翻译难点'},
    {id:'listening',e:'🎧',t:'听力训练'},{id:'exam-real',e:'📄',t:'历年真题',exam:1},
  ];
  document.getElementById('topic-scroll').innerHTML=topics.map(t=>`<div class="topic-chip${t.exam?' exam':''}" onclick="startBattle('${t.id}')"><span class="emoji">${t.e}</span>${t.t}</div>`).join('');
}

// ==================== LEARN ====================
function startLearn(){
  const lv=gl(state.xp);
  document.getElementById('learn-label').textContent=`Lv.${lv.lv} · ${lv.title}`;
  const banks=(lv.banks||[]).map(b=>b.b);
  let html='';
  const primary=banks[0]||'sentence-basic';
  if(LESSONS[primary]) html+=LESSONS[primary];
  banks.forEach(b=>{if((b.startsWith('vocab-')||b==='reading'||b==='listening')&&LESSONS[b]&&!html.includes(LESSONS[b].slice(0,40))){html+='<hr style="border-color:#2d2d4a;margin:14px 0">'+LESSONS[b]}});
  if(!html)html=LESSONS['default'];
  document.getElementById('learn-content').innerHTML=html;
  document.getElementById('learn-content').scrollTop=0;
  ssr('learn-screen');
}

// ==================== SHOP ====================
function openShop(){
  document.getElementById('shop-balance').textContent=state.coins;
  const grid=document.getElementById('shop-items');
  grid.innerHTML=SHOP.map(item=>{
    const owned=state.inventory[item.id]||0;
    const used=state.shopUsed[item.id]||0;
    const left=item.stock-used;
    return `<div class="shop-item">
      <span class="icon">${item.e}</span>
      <div class="name">${item.n}</div><div class="desc">${item.d}</div>
      <div class="price">🪙${item.price} · 库存:${left>10?'∞':left}</div>
      <button onclick="buyItem('${item.id}')" ${(state.coins<item.price||left<=0)?'disabled':''}>购买</button>
    </div>`;
  }).join('');
  document.getElementById('shop-modal').style.display='flex';
}
function buyItem(id){
  const item=SHOP.find(i=>i.id===id);
  if(!item||state.coins<item.price)return;
  state.coins-=item.price;
  state.inventory[id]=(state.inventory[id]||0)+1;
  ss(state);sfxCoin();
  rewardPop('🛒','+1 '+item.n);
  openShop(); // refresh
}

// ==================== ACHIEVEMENTS ====================
function checkAch(){
  const v=state;
  ACHIEVEMENTS.forEach(a=>{
    if(!state.unlockedAch.includes(a.id)&&a.c(v)){
      state.unlockedAch.push(a.id);
      ss(state);sfxLV();sp(window.innerWidth/2,window.innerHeight/2,'🏅',12);
      setTimeout(()=>{rewardPop('🏅','解锁成就：'+a.n)},200);
    }
  });
}
function openAchievements(){
  const grid=document.getElementById('ach-list');
  grid.innerHTML=ACHIEVEMENTS.map(a=>{
    const ul=state.unlockedAch.includes(a.id);
    return `<div class="ach-item ${ul?'unlocked':'locked'}">
      <span class="a-icon">${ul?a.e:'🔒'}</span>
      <b>${a.n}</b><br><small>${a.d}</small>
    </div>`;
  }).join('');
  document.getElementById('ach-modal').style.display='flex';
}

// ==================== BATTLE ====================
function startBattle(topicOverride){
  // Consume boosts
  activeBoosts={xpBoost:1,coinBoost:1,shield:0,streakSave:0,comboStart:0};
  if(state.inventory['xp-boost']>0){activeBoosts.xpBoost=2;state.inventory['xp-boost']--;ss(state)}
  if(state.inventory['coin-boost']>0){activeBoosts.coinBoost=2;state.inventory['coin-boost']--;ss(state)}
  if(state.inventory['shield']>0){activeBoosts.shield=1;state.inventory['shield']--;ss(state)}
  if(state.inventory['streak-save']>0){activeBoosts.streakSave=1;state.inventory['streak-save']--;ss(state)}
  if(state.inventory['combo-starter']>0){activeBoosts.comboStart=2;state.inventory['combo-starter']--;ss(state)}

  let pool=[];
  if(topicOverride){pool=BANKS[topicOverride]||[]}
  else{
    const lv=gl(state.xp);
    (lv.banks||[{b:'sentence-basic',w:5}]).forEach(({b,w})=>{const qs=BANKS[b]||[];const take=Math.min(qs.length,Math.ceil(w*2));pool=pool.concat(sh(qs).slice(0,take))});
  }
  if(!pool.length)pool=BANKS['sentence-basic']||[];

  const n=Math.min(10,pool.length);
  const selected=sh(pool).slice(0,n);
  battle={questions:selected,idx:0,hp:3,combo:activeBoosts.comboStart,mc:0,cor:0,rxp:0,coins:0,drops:[]};
  forcedTopic=topicOverride||null;
  // Shield effect
  if(activeBoosts.shield>0){battle.shielded=true}
  ssr('battle-screen');
  rH();uCB();uQC();sQ();
}

function rH(){
  let html='';
  for(let i=0;i<3;i++)html+=`<span class="heart${i>=battle.hp?' lost':''}">${i>=battle.hp?'🖤':'❤️'}</span>`;
  if(activeBoosts.shield>0)html+='<span style="font-size:.8rem">🛡️</span>';
  document.getElementById('hearts').innerHTML=html;
}
function uCB(){
  const b=document.getElementById('combo-badge');
  if(battle.combo>=2){b.textContent=`🔥 x${battle.combo}`;b.classList.add('active')}else b.classList.remove('active');
}
function uQC(){
  let d='';for(let i=0;i<battle.questions.length;i++)d+=`<span class="dot ${i<battle.idx?'done':(i===battle.idx?'current':'')}"></span>`;
  document.getElementById('question-counter').innerHTML=`${battle.idx+1}/${battle.questions.length} ${d}`;
  document.getElementById('reward-hint').textContent='';
}
function sQ(){
  if(battle.idx>=battle.questions.length||battle.hp<=0){eB();return}
  const q=battle.questions[battle.idx];
  document.getElementById('question-text').innerHTML=q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback-text';
  const o=document.getElementById('options');o.innerHTML='';
  q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='option-btn';b.textContent=t;b.onclick=()=>aQ(i);o.appendChild(b)});
  uQC();

  // Variable reward hint
  const roll=Math.random();
  if(roll>0.85)document.getElementById('reward-hint').textContent='🍀 本题可能触发幸运暴击！';
  else if(roll>0.7)document.getElementById('reward-hint').textContent='💎 稀有掉落概率UP';
}
function aQ(idx){
  const q=battle.questions[battle.idx];
  const ok=idx===q.a;
  const btns=document.querySelectorAll('#options .option-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});
  if(!ok)btns[idx].classList.add('wrong');
  const fb=document.getElementById('feedback');

  if(ok){
    battle.cor++;battle.combo++;
    if(battle.combo>battle.mc)battle.mc=battle.combo;

    // VARIABLE REWARD ENGINE
    const roll=Math.random();
    let baseXP=10;let bonusXP=0;let bonusCoins=0;let drop='';
    if(roll>0.9){bonusXP=rnd(20,30);bonusCoins=rnd(15,25);drop='⚡ 超级暴击！';sfxDrop()} // 10% super crit
    else if(roll>0.75){bonusXP=rnd(10,15);bonusCoins=rnd(5,15);drop='🌟 幸运暴击！';sfxCoin()} // 15% crit
    else if(roll>0.55){bonusCoins=rnd(3,8);drop='💰 掉金币了！';sfxCoin()} // 20% coin drop
    else{sfxOK()}
    if(battle.combo>=3){bonusXP+=Math.floor(battle.combo/3)*5;sfxCB()}

    const earnedXP=(baseXP+bonusXP)*activeBoosts.xpBoost;
    const earnedCoins=(bonusCoins||3)*activeBoosts.coinBoost;
    battle.rxp+=earnedXP;battle.coins+=earnedCoins;
    if(drop)battle.drops.push(drop);

    if(drop){sp(window.innerWidth/2,window.innerHeight/2,bonusXP>15?'⚡':'💰')}
    fb.innerHTML=`✅ 正确！${drop?drop+' ':''}<br>+${earnedXP}XP +${earnedCoins}💰${battle.combo>=3?` 🔥${battle.combo}连击`:''}`;
    fb.className='feedback-text good';
    if(drop)rewardPop(bonusXP>15?'⚡':'💰',bonusXP>15?`+${earnedXP}XP!`:`+${earnedCoins}金币`);
    if(battle.shielded){battle.shielded=false;activeBoosts.shield=0}
  } else {
    if(activeBoosts.shield>0){activeBoosts.shield=0;battle.shielded=false;fb.innerHTML='🛡️ <b>护盾抵挡！</b>不掉血';fb.className='feedback-text good'}
    else{
      battle.hp--;
      if(activeBoosts.streakSave){activeBoosts.streakSave=0;fb.innerHTML=`❌ 答案是 <b>${q.o[q.a]}</b><br>🔒 连击保护！连击未断<br><small style="color:var(--muted)">${q.h}</small>`}else{fb.innerHTML=`❌ 答案是 <b>${q.o[q.a]}</b><br><small style="color:var(--muted)">${q.h}</small>`;battle.combo=0}
      sfxNO();sp(window.innerWidth/2,window.innerHeight/2,'💔',3);
    }
    fb.className=battle.hp>0||activeBoosts.shield?'feedback-text bad':'feedback-text bad';
  }
  // Track vocab correct
  if(ok&&(forcedTopic||'').startsWith('vocab'))state.vocabCorrect++;

  rH();uCB();uQC();
  setTimeout(()=>{battle.idx++;sQ()},ok?700:1800);
}

function eB(){
  state.totalQ+=battle.questions.length;state.totalC+=battle.cor;
  state.xp+=battle.rxp;state.coins+=battle.coins;state.totalCoins+=battle.coins;
  if(battle.mc>state.bestCombo)state.bestCombo=battle.mc;
  if(battle.cor===battle.questions.length&&battle.questions.length>=8)state.perfect++;
  const ol=state.lv;const nl=gl(state.xp);state.lv=nl.lv;

  // Daily
  const today=new Date().toDateString();
  if(state.dailyDate===today)state.dailyDone=Math.min(3,state.dailyDone+1);
  else{state.dailyDone=1;state.dailyDate=today}
  if(state.dailyDone>=3&&!state._claimedDaily){state.coins+=50;state.totalCoins+=50;state._claimedDaily=true}

  // Streak
  if(state.lastPlayDate){
    const y=new Date(Date.now()-86400000).toDateString();
    if(state.lastPlayDate===y)state.streak++;else if(state.lastPlayDate!==today)state.streak=1;
  }else state.streak=1;
  state.lastPlayDate=today;ss(state);
  checkAch();

  ssr('result-screen');
  const p=battle.cor===battle.questions.length;
  const g=battle.cor>=battle.questions.length*0.7;
  document.getElementById('result-icon').textContent=p?'👑':g?'✨':'💪';
  document.getElementById('result-title').textContent=p?'完美通关！':g?'表现不错！':'继续加油！';
  document.getElementById('res-correct').textContent=battle.cor+'/'+battle.questions.length;
  document.getElementById('res-combo').textContent=battle.mc;
  document.getElementById('res-hp').textContent=battle.hp;
  document.getElementById('res-coins').textContent=`+${battle.coins}`;
  document.getElementById('xp-gain').textContent=`+${battle.rxp} XP${activeBoosts.xpBoost>1?' (双倍!)':''}`;
  const loot=document.getElementById('loot-row');
  loot.innerHTML=battle.drops.length?battle.drops.filter((v,i,a)=>a.indexOf(v)===i).map(d=>`<span class="loot-item">${d}</span>`).join(''):'';
  if(state.dailyDone>=3)loot.innerHTML+='<span class="loot-item" style="border-color:var(--gold)">📅 每日奖励 +50💰</span>';

  const m=document.getElementById('level-up-msg');
  if(nl.lv>ol){
    sfxLV();m.innerHTML=`<div style="color:var(--gold);font-weight:900;font-size:1.1rem;margin-top:8px">🎉 升级！${nl.icon} ${nl.title}</div>`;
    sp(window.innerWidth/2,window.innerHeight/2,'🎉',15);
    // Check boss trigger (every 5 levels)
    if(nl.lv%5===0&&nl.lv>ol){setTimeout(()=>startBoss(nl.lv),600);return}
    setTimeout(()=>{document.getElementById('level-title').textContent=`晋升 ${nl.title}！`;document.getElementById('level-desc').textContent=`新称号：${nl.desc}\n总分 ${state.xp} XP`;document.getElementById('level-modal').style.display='flex'},400);
  }else{m.innerHTML=''}
  // Reset daily claimed flag
  if(state.dailyDate!==today)state._claimedDaily=false;
}

function confirmQuit(){if(confirm('确定要逃走吗？本轮进度将丢失。'))goHome()}
function resetGame(){if(confirm('确定重置所有存档？等级、金币、成就全部清零。')){state=JSON.parse(JSON.stringify(D));ss(state);goHome()}}

// ==================== BOSS FIGHT ====================
let boss=null;
function startBoss(lv){
  const bosses={
    5:{n:'词汇巨兽',e:'🐉',icon:'🐉',hp:5,banks:['vocab-1','vocab-2'],time:45,reward:300,prompt:'在45秒内击败词汇巨兽！答对扣血，答错受伤，超时失败。'},
    10:{n:'语法魔龙',e:'👹',icon:'👹',hp:8,banks:['sentence-basic','clause-markers'],time:60,reward:800,prompt:'最终Boss！60秒，8点血。语法+从句混合题。'},
  };
  const cfg=bosses[lv]||bosses[5];
  let pool=[];cfg.banks.forEach(b=>{const qs=BANKS[b]||[];pool=pool.concat(sh(qs).slice(0,10))});
  boss={cfg,pool:sh(pool),idx:0,bossHP:cfg.hp,playerHP:3,timer:cfg.time,correct:0};
  document.getElementById('boss-icon').textContent=cfg.icon;
  document.getElementById('boss-name').textContent=cfg.n;
  document.getElementById('boss-hp-fill').style.width='100%';
  document.getElementById('boss-timer').textContent='⏱ '+boss.timer+'s';
  document.getElementById('boss-feedback').textContent='';
  ssr('boss-screen');
  bossTick();sBQ();
}
let bossTimer=null;
function bossTick(){
  if(bossTimer)clearInterval(bossTimer);
  bossTimer=setInterval(()=>{
    boss.timer--;
    document.getElementById('boss-timer').textContent='⏱ '+boss.timer+'s';
    if(boss.timer<=0||boss.playerHP<=0||boss.bossHP<=0){clearInterval(bossTimer);eBoss()}
  },1000);
}
function sBQ(){
  if(boss.playerHP<=0||boss.bossHP<=0||boss.timer<=0){eBoss();return}
  const q=boss.pool[boss.idx%boss.pool.length];
  document.getElementById('boss-question').innerHTML=q.q;
  document.getElementById('boss-feedback').textContent='';
  const o=document.getElementById('boss-options');o.innerHTML='';
  q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='option-btn';b.textContent=t;b.onclick=()=>aBQ(i);o.appendChild(b)});
}
function aBQ(idx){
  const q=boss.pool[boss.idx%boss.pool.length];
  const ok=idx===q.a;
  const btns=document.querySelectorAll('#boss-options .option-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});
  if(!ok){btns[idx].classList.add('wrong');boss.playerHP--;sfxNO();sp(window.innerWidth/2,window.innerHeight/2,'💔',3)}
  else{boss.bossHP--;boss.correct++;sfxOK();sp(window.innerWidth/2,window.innerHeight/2,'⚔️',5)}
  document.getElementById('boss-hp-fill').style.width=(boss.bossHP/boss.cfg.hp*100)+'%';
  document.getElementById('boss-feedback').textContent=ok?'⚔️ 命中！Boss -1HP':'💔 你受伤了！';
  setTimeout(()=>{boss.idx++;sBQ()},600);
}
function eBoss(){
  if(bossTimer)clearInterval(bossTimer);
  const win=boss.bossHP<=0;
  if(win){state.bossKills=(state.bossKills||0)+1;state.xp+=boss.cfg.reward;ss(state);checkAch();sfxLV();sp(window.innerWidth/2,window.innerHeight/2,'🎉',20)}
  document.getElementById('boss-result-icon').textContent=win?'👑':'💀';
  document.getElementById('boss-result-title').textContent=win?`击败 ${boss.cfg.n}！`:'挑战失败...';
  document.getElementById('boss-result-desc').textContent=win?`奖励：+${boss.cfg.reward}XP\n再来一局继续变强！`:`Boss还剩${boss.bossHP}血。升级后再来挑战吧！`;
  document.getElementById('boss-modal').style.display='flex';
}

renderHome();
