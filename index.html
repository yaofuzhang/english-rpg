<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v4 · Degree English RPG</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444;--purple:#a855f7;--cyan:#22d3ee}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:17px}
.screen{display:none;flex-direction:column;align-items:center;padding:20px 16px;min-height:100dvh}
.screen.active{display:flex}

/* HOME */
#home-screen{justify-content:flex-start;gap:16px;padding-top:28px}
.game-title{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.game-subtitle{color:var(--muted);font-size:.95rem;text-align:center;margin-top:-8px}
.character-card{background:var(--card);border-radius:20px;padding:18px 20px;width:100%;max-width:380px;display:flex;align-items:center;gap:14px;border:2px solid #2d2d4a}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-weight:700;font-size:1.05rem}
.char-title{color:var(--muted);font-size:.8rem}
.xp-bar-wrap{height:8px;background:#2d2d4a;border-radius:4px;margin-top:6px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--xp);border-radius:4px;transition:width .5s}
.xp-text{font-size:.75rem;color:var(--muted)}
.stats-row{display:flex;gap:8px;width:100%;max-width:380px}
.stat-box{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center;border:2px solid #2d2d4a}
.stat-val{font-size:1.3rem;font-weight:900}
.stat-val.fire{color:var(--combo)}.stat-val.gold{color:var(--gold)}.stat-val.ice{color:var(--cyan)}.stat-val.purple{color:var(--purple)}
.stat-label{color:var(--muted);font-size:.7rem}
.btn{border:none;border-radius:16px;padding:16px 32px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:transform .15s;width:100%;max-width:380px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-learn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a}
.btn-small{padding:10px 20px;font-size:.9rem;max-width:180px;border-radius:12px}
.daily-bar{background:var(--card);border-radius:14px;padding:12px 16px;width:100%;max-width:380px;border:2px solid #2d2d4a;display:flex;align-items:center;gap:10px;font-size:.85rem}
.daily-progress{flex:1;height:7px;background:#2d2d4a;border-radius:4px;overflow:hidden}
.daily-fill{height:100%;background:var(--combo);border-radius:4px;transition:width .5s}
.review-badge{display:inline-block;background:rgba(99,102,241,.2);color:var(--accent);font-size:.75rem;padding:3px 10px;border-radius:12px;margin-left:6px}
.topic-scroll{width:100%;max-width:380px;overflow-x:auto;white-space:nowrap;padding:6px 0;-webkit-overflow-scrolling:touch}
.topic-scroll::-webkit-scrollbar{display:none}
.topic-chip{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:14px;padding:10px 16px;margin-right:8px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text);transition:all .15s;vertical-align:top}
.topic-chip:active{transform:scale(.95)}
.topic-chip .emoji{font-size:1.3rem;display:block;margin-bottom:2px}
.topic-chip.exam{border-color:var(--gold);background:rgba(240,192,64,.1)}

/* BATTLE */
#battle-screen{gap:14px}
.battle-header{display:flex;align-items:center;gap:10px;width:100%;max-width:420px}
.hearts{display:flex;gap:4px;font-size:1.3rem}
.heart{transition:transform .3s,opacity .3s}.heart.lost{opacity:.2;transform:scale(.8)}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:4px 10px;border-radius:18px;font-size:.8rem;opacity:0;transition:opacity .3s}
.combo-badge.active{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.reward-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:2.5rem;font-weight:900;z-index:150;pointer-events:none;animation:rewardBoom 1s ease-out forwards}
@keyframes rewardBoom{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.question-counter{color:var(--muted);font-size:.8rem;width:100%;max-width:420px}
.dot{width:9px;height:9px;border-radius:50%;background:#2d2d4a;transition:background .3s;display:inline-block;margin:0 3px}
.dot.done{background:var(--success)}.dot.wrong{background:var(--danger)}.dot.current{background:var(--accent);animation:pulse 1s infinite}
.question-box{background:var(--card);border-radius:18px;padding:24px 18px;width:100%;max-width:420px;text-align:center;border:2px solid #2d2d4a;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.question-text{font-size:1.3rem;font-weight:700;line-height:1.7}
.passage-box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:420px;border:2px solid #2d2d4a;font-size:.95rem;line-height:2.4;text-align:left}
.passage-box .blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--accent);margin:0 5px;text-align:center;color:var(--gold);font-weight:700}
.speak-btn{background:rgba(99,102,241,.2);border:2px solid var(--accent);color:var(--accent);border-radius:22px;padding:7px 16px;font-size:.85rem;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;min-height:40px}
.speak-btn:active{background:rgba(99,102,241,.4);transform:scale(.95)}.speak-btn.speaking{background:var(--accent);color:#fff;animation:spulse .5s infinite}@keyframes spulse{0%,100%{opacity:1}50%{opacity:.4}}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.option-btn{background:var(--card);border:2px solid #2d2d4a;border-radius:14px;padding:16px 14px;font-size:1rem;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-weight:600;min-height:50px}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{background:var(--success);border-color:var(--success);color:#fff;animation:popIn .3s}
.option-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}
.option-btn:disabled{pointer-events:none;opacity:.6}
.option-btn:disabled.correct,.option-btn:disabled.wrong{opacity:1}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.feedback-text{font-size:1.1rem;font-weight:900;text-align:center;min-height:28px;padding:4px 0}
.feedback-text.good{color:var(--success)}.feedback-text.bad{color:var(--danger)}

/* WRITE MODE */
#write-screen{padding:20px 16px;align-items:stretch}
.write-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.write-prompt{background:var(--card);border-radius:16px;padding:22px;border:2px solid #2d2d4a;font-size:1.05rem;line-height:2.2;margin-bottom:14px}
.write-prompt .blank-input{border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--gold);font-size:1.05rem;padding:5px 10px;outline:none;min-width:100px;text-align:center;font-weight:700}
.write-prompt .blank-input:focus{border-bottom-color:var(--gold)}
.write-input-row{display:flex;gap:10px;margin-bottom:14px}
.write-input-row input{flex:1;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:14px;color:var(--text);font-size:1rem;outline:none}
.write-input-row input:focus{border-color:var(--gold)}
.write-feedback{text-align:center;font-size:.95rem;min-height:28px}
.write-input-row .btn-small{max-width:70px;font-size:.95rem}

/* RESULT */
#result-screen{gap:16px;justify-content:center}
.result-icon{font-size:4rem}
.result-title{font-size:1.6rem;font-weight:900;text-align:center}
.result-stats{display:flex;gap:10px;width:100%;max-width:360px}
.result-stat{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:2px solid #2d2d4a}
.result-stat .val{font-size:1.4rem;font-weight:900}
.result-stat .lbl{color:var(--muted);font-size:.7rem}
.xp-gain{color:var(--xp);font-weight:900;font-size:1.2rem;text-align:center}
.loot-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.loot-item{background:var(--card);border-radius:10px;padding:8px 12px;border:1px solid #2d2d4a;font-size:.85rem}

/* SKILL TREE */
.skill-row{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.skill-node{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:2px solid #2d2d4a;border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:600}
.skill-node.done{border-color:var(--success);background:rgba(34,197,94,.1)}
.skill-node.now{border-color:var(--accent);background:rgba(99,102,241,.15);animation:pulse 2s infinite}
.skill-node.locked{opacity:.35}
.skill-arrow{color:var(--muted);font-size:1rem}

/* LEARN */
.learn-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.learn-content{background:var(--card);border-radius:16px;padding:20px;border:2px solid #2d2d4a;line-height:1.9;font-size:.95rem;overflow-y:auto;flex:1;max-height:calc(100dvh - 170px)}
.learn-content h3{color:var(--gold);margin:14px 0 6px;font-size:1.1rem}.learn-content h3:first-child{margin-top:0}
.learn-content .ex{background:#0a0a0a;border-radius:10px;padding:10px;margin:6px 0;font-size:.9rem;border-left:3px solid var(--accent)}
.learn-content .tip{background:rgba(240,192,64,.1);border-radius:10px;padding:10px;margin:6px 0;font-size:.85rem;border-left:3px solid var(--gold)}
.learn-content .wrong-spot{background:rgba(248,113,113,.1);border-radius:10px;padding:10px;margin:6px 0;font-size:.85rem;border-left:3px solid var(--danger)}
.learn-actions{padding:14px 0;text-align:center}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:20px;padding:30px 24px;text-align:center;max-width:360px;width:92%;border:2px solid #2d2d4a}
.modal h2{font-size:1.4rem;margin-bottom:8px}.modal p{color:var(--muted);margin-bottom:14px;font-size:.9rem}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.shop-item{background:var(--card);border-radius:16px;padding:16px;border:2px solid #2d2d4a;text-align:center}
.shop-item .icon{font-size:2.2rem;display:block}.shop-item .name{font-weight:700;font-size:.9rem}.shop-item .desc{color:var(--muted);font-size:.7rem;margin:4px 0}.shop-item .price{color:var(--gold);font-weight:700;font-size:.85rem}.shop-item button{margin-top:8px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:.85rem;cursor:pointer;font-weight:600}.shop-item button:disabled{opacity:.4;pointer-events:none}.shop-item button:active{transform:scale(.95)}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px}
.ach-item{background:var(--card);border-radius:12px;padding:12px;border:2px solid #2d2d4a;text-align:center;font-size:.85rem}.ach-item.unlocked{border-color:var(--gold)}.ach-item.locked{opacity:.4}.ach-item .a-icon{font-size:1.6rem;display:block}
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:1.6rem;animation:particleUp .8s ease-out forwards}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5) rotate(20deg)}}

.tut-step{text-align:center}
.tut-step .big-emoji{font-size:4.5rem;display:block;margin-bottom:14px}
.tut-step h3{font-size:1.3rem;margin-bottom:6px}
.tut-step p{color:var(--muted);font-size:.95rem;line-height:1.7}
.tut-step .demo-sentence{font-size:1.4rem;font-weight:700;padding:12px;background:var(--card);border-radius:10px;margin:8px 0;display:inline-block}
.tut-step .demo-sentence .s{color:#60a5fa}.tut-step .demo-sentence .v{color:#f87171}.tut-step .demo-sentence .o{color:#4ade80}.tut-step .demo-sentence .c{color:#fbbf24}
@media(max-width:360px){.game-title{font-size:2rem}.question-text{font-size:1.15rem}.option-btn{font-size:.9rem;padding:14px 10px}.options-grid{gap:8px}}
</style>
</head>
<body>

<!-- ==================== HOME ==================== -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div><div class="game-subtitle">同等学力申硕 · RPG 训练营</div>
  <div class="character-card">
    <div class="avatar" id="avatar-icon">📖</div>
    <div class="char-info">
      <div class="char-name" id="char-name">英语难民</div><div class="char-title" id="char-title">Lv.1 · 从零开始</div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val fire" id="stat-streak">0</div><div class="stat-label">🔥签到</div></div>
    <div class="stat-box"><div class="stat-val gold" id="stat-coins">0</div><div class="stat-label">🪙金币</div></div>
    <div class="stat-box"><div class="stat-val ice" id="stat-best">0</div><div class="stat-label">💎连击</div></div>
    <div class="stat-box"><div class="stat-val purple" id="stat-review">0</div><div class="stat-label">🧠待复习</div></div>
  </div>
  <div class="daily-bar"><span>📅</span><span style="flex:1;font-size:.75rem" id="daily-text">今日 0/3</span><div class="daily-progress"><div class="daily-fill" id="daily-fill" style="width:0%"></div></div><span style="color:var(--gold);font-size:.7rem" id="daily-reward">+50💰</span></div>
  <button class="btn btn-primary" onclick="startBattle()" id="btn-battle">⚡ 开始修炼</button>
  <button class="btn btn-learn" onclick="startLearn()">📖 学习模式</button>
  <button class="btn-small" onclick="testTTS()" style="background:var(--card);border:1px solid var(--accent);color:var(--accent);max-width:360px;width:100%;font-size:.8rem;padding:8px">🔊 测试语音（点我，听不到声音告诉我）</button>
  <div style="display:flex;gap:8px;width:100%;max-width:360px">
    <button class="btn-small" onclick="startWrite()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--gold);flex:1;max-width:none">✍️ 写作填空</button>
    <button class="btn-small" onclick="openSkillTree()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--xp);flex:1;max-width:none">🌳 技能树</button>
  </div>
  <div style="display:flex;gap:8px;width:100%;max-width:360px">
    <button class="btn-small" onclick="openShop()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--gold);flex:1;max-width:none">🛒</button>
    <button class="btn-small" onclick="openAchievements()" style="background:var(--card);border:2px solid #2d2d4a;color:var(--cyan);flex:1;max-width:none">🏅</button>
  </div>
  <div style="color:var(--muted);font-size:.65rem;margin-top:2px">🎯 自选专题</div>
  <div class="topic-scroll" id="topic-scroll"></div>
  <button onclick="resetGame()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 14px;border-radius:8px;font-size:.7rem;cursor:pointer">🔄 重置</button>
</div>

<!-- ==================== TUTORIAL ==================== -->
<div id="tutorial-screen" class="screen">
  <div class="tut-step" id="tut-content"></div>
  <div style="display:flex;gap:8px;margin-top:14px;width:100%;max-width:340px">
    <button class="btn-small" id="tut-prev" onclick="tutPrev()" style="background:transparent;border:1px solid #2d2d4a;color:var(--muted);flex:1;max-width:none">← 上一步</button>
    <button class="btn btn-primary" id="tut-next" onclick="tutNext()" style="flex:1;max-width:none">下一步 →</button>
  </div>
</div>

<!-- ==================== LEARN ==================== -->
<div id="learn-screen" class="screen">
  <div class="learn-header">
    <button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 12px;border-radius:8px;font-size:.78rem;cursor:pointer">← 回城</button>
    <span style="color:var(--muted);font-size:.8rem" id="learn-label">Lv.1 课程</span>
    <button onclick="speakLearn()" class="speak-btn" style="margin-left:auto" id="learn-speak-btn">🔊 朗读</button>
  </div>
  <div class="learn-content" id="learn-content"></div>
  <div style="text-align:center;padding:10px"><button class="btn btn-primary" onclick="startBattle()">⚔️ 学完了，开打！</button></div>
</div>

<!-- ==================== BATTLE ==================== -->
<div id="battle-screen" class="screen">
  <div class="battle-header">
    <button onclick="confirmQuit()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:4px 10px;border-radius:6px;font-size:.7rem;cursor:pointer">←</button>
    <div class="hearts" id="hearts"></div>
    <button onclick="speakBattleQ()" class="speak-btn" id="battle-speak-btn">🔊</button>
    <div class="combo-badge" id="combo-badge">🔥 x1</div>
  </div>
  <div class="question-counter" id="question-counter"></div>
  <div class="question-box"><div class="question-text" id="question-text"></div></div>
  <div class="feedback-text" id="feedback"></div>
  <div class="options-grid" id="options"></div>
  <div style="font-size:.65rem;color:var(--muted);text-align:center" id="reward-hint"></div>
</div>

<!-- ==================== WRITE MODE ==================== -->
<div id="write-screen" class="screen">
  <div class="write-header">
    <button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 12px;border-radius:8px;font-size:.78rem;cursor:pointer">←</button>
    <span style="color:var(--muted);font-size:.8rem">✍️ 写作填空</span>
    <span style="margin-left:auto;font-size:.75rem;color:var(--muted)" id="write-counter">1/5</span>
  </div>
  <p style="color:var(--muted);font-size:.78rem;text-align:center;margin-bottom:8px">👇 在下划线处填入合适的英文单词，练习考试写作模板</p>
  <div class="write-prompt" id="write-prompt"></div>
  <div class="write-input-row">
    <input type="text" id="write-input" placeholder="输入你填的英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn-small btn-primary" onclick="checkWrite()" style="max-width:60px">提交</button>
  </div>
  <div class="write-feedback" id="write-feedback"></div>
  <button class="btn-small" onclick="speakWrite()" style="background:var(--card);border:1px solid var(--accent);color:var(--accent);margin:0 auto">🔊 听模板句</button>
</div>

<!-- ==================== RESULT ==================== -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-stats">
    <div class="result-stat"><div class="val" id="res-correct">0</div><div class="lbl">✅正确</div></div>
    <div class="result-stat"><div class="val" id="res-combo">0</div><div class="lbl">🔥连击</div></div>
    <div class="result-stat"><div class="val" id="res-hp">3</div><div class="lbl">❤️血量</div></div>
    <div class="result-stat"><div class="val" id="res-coins" style="color:var(--gold)">0</div><div class="lbl">🪙金币</div></div>
  </div>

<script>
// ==================== TTS ENGINE v5 (DUAL ENGINE) ====================
let ttsMode='web'; // 'web' | 'google' | 'none'

function detectTTS(){
  if(!('speechSynthesis' in window)){ttsMode='google';return}
  // Test if English voice actually available
  const voices=speechSynthesis.getVoices();
  const hasEng=voices.some(v=>v.lang.startsWith('en'));
  if(!hasEng && voices.length>0){ttsMode='google';return} // Only Chinese voices
  // If voices not loaded yet, wait and check
  if(voices.length===0){
    speechSynthesis.onvoiceschanged=()=>{
      const v2=speechSynthesis.getVoices();
      const ok=v2.some(v=>v.lang.startsWith('en'));
      ttsMode=ok?'web':'google';
    };
    ttsMode='google'; // assume google until proven otherwise
  }
}

function speak(text,rate){
  const clean=(typeof text==='string'?text.replace(/<[^>]*>/g,'').replace(/\[.*?\]/g,'').trim():String(text));
  if(!clean||clean.length<1)return;

  if(ttsMode==='web'){
    try{
      const u=new SpeechSynthesisUtterance(clean);
      u.lang='en-US';u.rate=rate||0.9;
      speechSynthesis.speak(u);
    }catch(e){ttsMode='google';speakGoogle(clean)}
  }else{
    speakGoogle(clean);
  }
}

let audioEl=null;
function speakGoogle(text){
  try{
    if(!audioEl){audioEl=new Audio();audioEl.volume=1}
    // Google Translate TTS — free, no API key, works globally
    const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q='+encodeURIComponent(text);
    audioEl.src=url;
    audioEl.play().catch(()=>{ttsMode='none'});
  }catch(e){ttsMode='none'}
}

function speakWord(w){speak(w,0.7)}
function speakBattleQ(){
  const el=document.getElementById('battle-speak-btn');
  if(el){el.classList.add('speaking');setTimeout(()=>el.classList.remove('speaking'),2000)}
  const q=document.getElementById('question-text')?.textContent||'';
  if(q)speak(q);
}

function testTTS(){
  var status='';
  if(!('speechSynthesis' in window)){status='❌ 浏览器不支持语音合成'}
  else{
    var voices=speechSynthesis.getVoices();
    if(voices.length===0){status='⚠️ 语音引擎未加载，尝试 Google TTS 兜底...'}
    else{
      var eng=voices.filter(function(v){return v.lang.startsWith('en')});
      status='✅ '+voices.length+'个语音可用。英文:'+eng.length+'个。模式:'+ttsMode;

  speak('Hello, this is a test.'); // Try both engines
  alert(status+'\n\n已尝试播放 "Hello, this is a test."\n如果没听到声音，请检查手机媒体音量。');
}

let writeIdx=0;let writeCorrect=0;

function startWrite(){writeIdx=0;writeCorrect=0;showWrite();ssr('write-screen')}
function showWrite(){
  if(writeIdx>=WRITE_EXERCISES.length){
    const earned=writeCorrect*15;
    state.xp+=earned;state.writeDone=(state.writeDone||0)+writeCorrect;ss(state);

    document.getElementById('loot-row').innerHTML='';document.getElementById('level-up-msg').innerHTML='';

}
function checkWrite(){
  const ex=WRITE_EXERCISES[writeIdx];
  const input=document.getElementById('write-input').value.trim().toLowerCase();
  const correctAns=ex.ans.toLowerCase();
  const fb=document.getElementById('write-feedback');
  // Accept exact match OR close match (within 2 edits)
  const dist=levenshtein(input,correctAns);
  if(input===correctAns||dist<=2){
    writeCorrect++;fb.textContent=`✅ 正确！参考答案：${ex.ans}（${ex.h}）`;fb.style.color='var(--success)';
    sfxOK();sp(window.innerWidth/2,window.innerHeight/2,'✍️',5);
    setTimeout(()=>{writeIdx++;showWrite()},1000);
  }else{
    fb.innerHTML=`❌ 再试一次。<br><small style="color:var(--muted)">提示：${ex.hint} | ${ex.h}</small>`;fb.style.color='var(--danger)';
    sfxNO();document.getElementById('write-input').select();
  }
}
function speakWrite(){const ex=WRITE_EXERCISES[writeIdx];if(ex)speak(ex.prompt.replace(/<[^>]*>/g,'').replace(/____________/g,'...'))}
function levenshtein(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n]}

// ==================== HELPERS ====================
function gl(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i].xp)return LEVELS[i];return LEVELS[0]}
function xn(lv){return (LEVELS.find(l=>l.lv===lv+1)||{}).xp||9999}
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min}

// ==================== SPACED REPETITION (SM-2 simplified) ====================
function getReviewQueue(){
  // Returns question IDs due for review
  const now=Date.now();
  const due=[];
  for(const [key,data] of Object.entries(state.reviewQueue||{})){
    if(data.nextReview<=now) due.push({key,data});
  }
  return due;
}
function updateReview(bankId,qIdx,correct){
  const key=`${bankId}:${qIdx}`;
  const now=Date.now();
  const entry=state.reviewQueue[key]||{bank:bankId,idx:qIdx,reviews:0,interval:1,nextReview:now,ef:2.5};
  if(correct){
    entry.reviews++;
    if(entry.reviews===1)entry.interval=1;
    else if(entry.reviews===2)entry.interval=3;
    else entry.interval=Math.round(entry.interval*entry.ef);
  }else{
    entry.reviews=0;entry.interval=1;entry.ef=Math.max(1.3,entry.ef-0.2);
  }
  entry.nextReview=now+entry.interval*86400000;
  state.reviewQueue[key]=entry;
}
function getReviewCount(){
  return getReviewQueue().length;
}

// ==================== BATTLE (with spaced repetition) ====================
function startBattle(topicOverride){
  activeBoosts={xpBoost:1,coinBoost:1,shield:0,streakSave:0,comboStart:0};
  ['xp-boost','coin-boost','shield','streak-save','combo-starter'].forEach(id=>{
    if(state.inventory[id]&&state.inventory[id]>0){
      if(id==='xp-boost')activeBoosts.xpBoost=2;
      else if(id==='coin-boost')activeBoosts.coinBoost=2;
      else if(id==='shield')activeBoosts.shield=1;
      else if(id==='streak-save')activeBoosts.streakSave=1;
      else if(id==='combo-starter')activeBoosts.comboStart=2;
      state.inventory[id]--;ss(state);
    }
  });

  let pool=[];
  if(topicOverride){
    pool=BANKS[topicOverride]||[];
    // Also inject review questions from this topic
    const reviews=getReviewQueue().filter(r=>r.data.bank===topicOverride);
    const reviewQs=reviews.map(r=>{const q=BANKS[r.data.bank]?.[r.data.idx];return q?{...q,_review:true,_rkey:r.key}:null}).filter(Boolean);
    pool=pool.concat(reviewQs.slice(0,3)); // max 3 review questions per round
  }else{
    const lv=gl(state.xp);
    // Inject review questions (25% of the pool)
    const reviews=getReviewQueue();
    const reviewQs=reviews.slice(0,3).map(r=>{const q=BANKS[r.data.bank]?.[r.data.idx];return q?{...q,_review:true,_rkey:r.key}:null}).filter(Boolean);
    reviewQs.forEach(q=>pool.push(q));

    (lv.banks||[{b:'sentence-basic',w:5}]).forEach(({b,w})=>{const qs=BANKS[b]||[];const take=Math.min(qs.length,Math.ceil(w*2));pool=pool.concat(sh(qs).slice(0,take))});
  }
  if(!pool.length)pool=BANKS['sentence-basic']||[];

  const n=Math.min(10,pool.length);
  const selected=sh(pool).slice(0,n);
  battle={questions:selected,idx:0,hp:3,combo:activeBoosts.comboStart,mc:0,cor:0,rxp:0,coins:0,drops:[]};
  forcedTopic=topicOverride||null;
  if(activeBoosts.shield>0)battle.shielded=true;
  ssr('battle-screen');rH();uCB();uQC();sQ();
}

function rH(){
  let html='';for(let i=0;i<3;i++)html+=`<span class="heart${i>=battle.hp?' lost':''}">${i>=battle.hp?'🖤':'❤️'}</span>`;
  if(activeBoosts.shield>0)html+='<span style="font-size:.8rem">🛡️</span>';
  document.getElementById('hearts').innerHTML=html;
}
function uCB(){
  const b=document.getElementById('combo-badge');
  if(battle.combo>=2){b.textContent=`🔥 x${battle.combo}`;b.classList.add('active')}else b.classList.remove('active');
}
function uQC(){
  let d='';for(let i=0;i<battle.questions.length;i++)d+=`<span class="dot ${i<battle.idx?'done':(i===battle.idx?'current':'')}"></span>`;
  const q=battle.questions[battle.idx];
  const bonus=q?._review?'<span class="review-badge">🧠复习</span>':'';
  document.getElementById('question-counter').innerHTML=`${battle.idx+1}/${battle.questions.length} ${d}${bonus}`;
  document.getElementById('reward-hint').textContent=q?._review?'🔄 这是之前的错题，复习记得更牢！':'';
}
function sQ(){
  if(battle.idx>=battle.questions.length||battle.hp<=0){eB();return}
  const q=battle.questions[battle.idx];
  document.getElementById('question-text').innerHTML=q.q;
  document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback-text';
  const o=document.getElementById('options');o.innerHTML='';
  q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='option-btn';b.textContent=t;b.onclick=()=>aQ(i);o.appendChild(b)});
  uQC();
  if(Math.random()>0.85)document.getElementById('reward-hint').textContent='🍀 本题可能触发暴击！';
}
function aQ(idx){
  const q=battle.questions[battle.idx];
  const ok=idx===q.a;
  const btns=document.querySelectorAll('#options .option-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});
  if(!ok)btns[idx].classList.add('wrong');
  const fb=document.getElementById('feedback');

  // Track for spaced repetition
  if(!forcedTopic){
    const bankId=Object.keys(BANKS).find(k=>BANKS[k].some(bq=>bq.q===q.q))||'unknown';
    const bankIdx=(BANKS[bankId]||[]).findIndex(bq=>bq.q===q.q);
    if(bankIdx>=0)updateReview(bankId,bankIdx,ok);
    if(ok&&q._review){state.reviewDone=(state.reviewDone||0)+1}
  }

  if(ok){
    battle.cor++;battle.combo++;
    if(battle.combo>battle.mc)battle.mc=battle.combo;
    const roll=Math.random();let baseXP=10;let bonusXP=0;let bonusCoins=0;let drop='';
    if(roll>0.9){bonusXP=rnd(20,30);bonusCoins=rnd(15,25);drop='⚡ 超级暴击！';sfxDrop()}
    else if(roll>0.75){bonusXP=rnd(10,15);bonusCoins=rnd(5,15);drop='🌟 幸运暴击！';sfxCoin()}
    else if(roll>0.55){bonusCoins=rnd(3,8);drop='💰 掉金币了！';sfxCoin()}
    else{sfxOK()}
    if(battle.combo>=3){bonusXP+=Math.floor(battle.combo/3)*5;sfxCB()}
    const earnedXP=(baseXP+bonusXP)*activeBoosts.xpBoost;
    const earnedCoins=(bonusCoins||3)*activeBoosts.coinBoost;
    battle.rxp+=earnedXP;battle.coins+=earnedCoins;
    if(drop)battle.drops.push(drop);
    fb.innerHTML=`✅ 正确！${drop?drop+' ':''}+${earnedXP}XP +${earnedCoins}💰${battle.combo>=3?` 🔥${battle.combo}连击`:''}`;
    fb.className='feedback-text good';
    if(drop){sp(window.innerWidth/2,window.innerHeight/2,bonusXP>15?'⚡':'💰');rewardPop(bonusXP>15?'⚡':'💰',bonusXP>15?`+${earnedXP}XP!`:`+${earnedCoins}金币`)}
    if(q._review)document.getElementById('reward-hint').textContent='🧠 复习题答对，记忆已强化！';
  }else{
    if(activeBoosts.shield>0){activeBoosts.shield=0;battle.shielded=false;fb.innerHTML='🛡️ <b>护盾抵挡！</b>';fb.className='feedback-text good'}
    else{
      battle.hp--;
      if(activeBoosts.streakSave){activeBoosts.streakSave=0;fb.innerHTML=`❌ 答案 <b>${q.o[q.a]}</b><br>🔒 连击保护！<br><small>${q.h}</small>`}else{fb.innerHTML=`❌ 答案 <b>${q.o[q.a]}</b><br><small>${q.h}</small>`;battle.combo=0}
      sfxNO();sp(window.innerWidth/2,window.innerHeight/2,'💔',3);
    }
    fb.className='feedback-text bad';
  }
  if(ok&&(forcedTopic||'').startsWith('vocab'))state.vocabCorrect++;
  rH();uCB();uQC();
  setTimeout(()=>{battle.idx++;sQ()},ok?700:1800);
}

function eB(){
  state.totalQ+=battle.questions.length;state.totalC+=battle.cor;
  state.xp+=battle.rxp;state.coins+=battle.coins;state.totalCoins+=battle.coins;
  if(battle.mc>state.bestCombo)state.bestCombo=battle.mc;
  if(battle.cor===battle.questions.length&&battle.questions.length>=8)state.perfect++;
  const ol=state.lv;const nl=gl(state.xp);state.lv=nl.lv;
  const today=new Date().toDateString();
  if(state.dailyDate===today)state.dailyDone=Math.min(3,state.dailyDone+1);
  else{state.dailyDone=1;state.dailyDate=today}
  if(state.dailyDone>=3&&!state._claimedDaily){state.coins+=50;state.totalCoins+=50;state._claimedDaily=true}
  if(state.lastPlayDate){const y=new Date(Date.now()-86400000).toDateString();if(state.lastPlayDate===y)state.streak++;else if(state.lastPlayDate!==today)state.streak=1}else state.streak=1;
  state.lastPlayDate=today;ss(state);checkAch();

  ssr('result-screen');
  const p=battle.cor===battle.questions.length;
  document.getElementById('result-icon').textContent=p?'👑':battle.cor>=battle.questions.length*0.7?'✨':'💪';
  document.getElementById('result-title').textContent=p?'完美通关！':battle.cor>=battle.questions.length*0.7?'表现不错！':'继续加油！';
  document.getElementById('res-correct').textContent=battle.cor+'/'+battle.questions.length;
  document.getElementById('res-combo').textContent=battle.mc;
  document.getElementById('res-hp').textContent=battle.hp;
  document.getElementById('res-coins').textContent=`+${battle.coins}`;
  document.getElementById('xp-gain').textContent=`+${battle.rxp} XP${activeBoosts.xpBoost>1?' (双倍!)':''}`;
  document.getElementById('loot-row').innerHTML=battle.drops.length?battle.drops.filter((v,i,a)=>a.indexOf(v)===i).map(d=>`<span class="loot-item">${d}</span>`).join(''):'';
  const rc=getReviewCount();
  document.getElementById('review-msg').textContent=rc>0?`🧠 ${rc}道题等待复习——明天再来巩固！`:'✅ 复习队列已清空，太强了！';
  if(nl.lv>ol){sfxLV();document.getElementById('level-up-msg').innerHTML=`<div style="color:var(--gold);font-weight:900;font-size:1.1rem;margin-top:8px">🎉 升级！${nl.icon} ${nl.title}</div>`;sp(window.innerWidth/2,window.innerHeight/2,'🎉',15);
    setTimeout(()=>{document.getElementById('level-title').textContent=`晋升 ${nl.title}！`;document.getElementById('level-desc').textContent=`新称号：${nl.desc}\n总分 ${state.xp} XP`;document.getElementById('level-modal').style.display='flex'},400)}
  else document.getElementById('level-up-msg').innerHTML='';
  if(state.dailyDate!==today)state._claimedDaily=false;
}

function confirmQuit(){if(confirm('确定要逃走吗？本轮进度将丢失。'))goHome()}
function resetGame(){if(confirm('确定重置所有存档？')){state=JSON.parse(JSON.stringify(D));ss(state);goHome()}}

// ==================== INIT ====================
renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
