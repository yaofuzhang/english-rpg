<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v8</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:clamp(15px,4vw,18px)}
.screen{display:none;flex-direction:column;align-items:center;padding:clamp(12px,3vw,20px);min-height:100dvh;width:100%}
.screen.active{display:flex}
.w{width:92vw;max-width:600px}

/* HOME */
#home-screen{gap:clamp(10px,2vh,16px);padding-top:clamp(14px,3vh,24px)}
.game-title{font-size:clamp(1.8rem,7vw,2.6rem);font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.subtitle{color:var(--muted);font-size:clamp(.72rem,2.5vw,.85rem);text-align:center;margin-top:-6px}
.card{background:var(--card);border-radius:clamp(12px,3vw,16px);padding:clamp(12px,3vw,18px);border:2px solid #2d2d4a}
.char-card{display:flex;align-items:center;gap:clamp(8px,2vw,14px)}.char-card .avatar{width:clamp(40px,12vw,50px);height:clamp(40px,12vw,50px);border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:clamp(1.2rem,5vw,1.6rem);flex-shrink:0}
.char-info{flex:1;min-width:0}.char-name{font-weight:700;font-size:clamp(.85rem,3vw,1rem)}.char-lvl{color:var(--muted);font-size:clamp(.65rem,2.2vw,.75rem)}
.xp-bar{height:clamp(5px,1.5vw,7px);background:#2d2d4a;border-radius:3px;margin-top:4px;overflow:hidden}.xp-fill{height:100%;background:var(--xp);border-radius:3px;transition:width .5s}
.stats{display:flex;gap:clamp(4px,1.5vw,8px)}.stat{flex:1;text-align:center;padding:clamp(7px,2vw,10px);border-radius:clamp(8px,2.5vw,12px)}.stat .v{font-size:clamp(.95rem,3.5vw,1.2rem);font-weight:900}.stat .l{color:var(--muted);font-size:clamp(.5rem,1.8vw,.62rem)}
.guide-card{border:2px solid var(--accent);background:rgba(99,102,241,.08)}.guide-card h3{font-size:clamp(.8rem,3vw,.95rem);margin-bottom:6px}
.guide-item{display:flex;align-items:center;gap:6px;padding:clamp(4px,1vw,6px) 0;font-size:clamp(.72rem,2.5vw,.85rem);cursor:pointer}.guide-item .check{width:clamp(18px,5vw,22px);height:clamp(18px,5vw,22px);border-radius:50%;border:2px solid #2d2d4a;display:flex;align-items:center;justify-content:center;font-size:.7rem;flex-shrink:0}.guide-item .check.done{background:var(--success);border-color:var(--success)}

.btn{border:none;border-radius:clamp(10px,3vw,14px);padding:clamp(11px,2.5vw,15px) clamp(18px,4vw,28px);font-size:clamp(.9rem,3.2vw,1.05rem);font-weight:700;cursor:pointer;transition:transform .15s;width:100%;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.btn-s{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}.btn-g{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a}
.btn-sm{padding:clamp(6px,1.5vw,8px) clamp(12px,3vw,16px);font-size:clamp(.7rem,2.5vw,.8rem);background:var(--card);border:2px solid #2d2d4a;color:var(--text);cursor:pointer;font-weight:600;border-radius:clamp(6px,2vw,10px)}.btn-sm:active{transform:scale(.97)}
.btn-row{display:flex;gap:clamp(4px,1.5vw,8px)}

/* LESSON */
.lesson-step{text-align:center;width:100%}
.lesson-step .big-e{font-size:clamp(2rem,10vw,4rem);display:block;margin-bottom:8px}
.lesson-step h3{font-size:clamp(1rem,4vw,1.3rem);margin-bottom:6px}
.lesson-step p{color:var(--muted);font-size:clamp(.8rem,3vw,.95rem);line-height:1.6;margin-bottom:10px}
.lesson-step .sentence{font-size:clamp(1.1rem,4.5vw,1.5rem);font-weight:700;padding:clamp(8px,2vw,12px);background:var(--card);border-radius:10px;margin:8px 0;display:inline-block;cursor:default}
.lesson-step .sentence .s{color:#60a5fa}.lesson-step .sentence .v{color:#f87171}.lesson-step .sentence .o{color:#4ade80}.lesson-step .sentence .c{color:#fbbf24}.lesson-step .sentence .tap{cursor:pointer;padding:2px 6px;border-radius:4px;transition:all .2s}.lesson-step .sentence .tap:hover{background:rgba(255,255,255,.1)}.lesson-step .sentence .tap.flash{animation:flash .4s}
@keyframes flash{0%,100%{background:transparent}50%{background:rgba(34,197,94,.5)}}

/* BATTLE */
#battle-screen{gap:clamp(6px,1.5vh,10px)}
.battle-top{display:flex;align-items:center;gap:6px;width:100%}
.hearts{display:flex;gap:2px;font-size:clamp(1rem,3.5vw,1.2rem)}.heart.lost{opacity:.2}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:2px 8px;border-radius:14px;font-size:clamp(.6rem,2.2vw,.72rem);opacity:0}.combo-badge.on{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.q-counter{color:var(--muted);font-size:clamp(.65rem,2.2vw,.75rem);width:100%}
.q-box{background:var(--card);border-radius:clamp(12px,3vw,16px);padding:clamp(16px,3vw,22px);text-align:center;border:2px solid #2d2d4a;min-height:clamp(60px,12vh,80px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.q-text{font-size:clamp(.95rem,3.8vw,1.3rem);font-weight:700;line-height:1.6}
.q-passage{font-size:clamp(.75rem,2.8vw,.9rem);line-height:1.9;text-align:left;padding:clamp(10px,2.5vw,16px);background:var(--card);border-radius:12px;border:2px solid #2d2d4a;max-height:clamp(150px,35vh,280px);overflow-y:auto;white-space:pre-wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,1.5vw,8px);width:100%}
.opt{background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(8px,2.5vw,12px);padding:clamp(10px,2.5vw,14px);font-size:clamp(.78rem,3vw,.95rem);color:var(--text);cursor:pointer;text-align:center;font-weight:600;word-break:break-word}.opt:active{transform:scale(.96)}
.opt.ok{background:var(--success);border-color:var(--success);color:#fff;animation:pop .3s}.opt.no{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}.opt:disabled{pointer-events:none;opacity:.6}.opt:disabled.ok,.opt:disabled.no{opacity:1}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{font-size:clamp(.85rem,3.2vw,1.05rem);font-weight:900;text-align:center;min-height:22px}.fb.good{color:var(--success)}.fb.bad{color:var(--danger)}
.highlight{background:rgba(240,192,64,.25);padding:1px 4px;border-radius:3px}

/* SPEAK */
.speak-btn{background:rgba(99,102,241,.2);border:1.5px solid var(--accent);color:var(--accent);border-radius:18px;padding:clamp(4px,1.2vw,6px) clamp(10px,2.5vw,14px);font-size:clamp(.65rem,2.5vw,.78rem);cursor:pointer;display:inline-flex;align-items:center;gap:3px}.speak-btn:active{background:rgba(99,102,241,.4)}

/* RESULT */
#result-screen{gap:clamp(8px,2vh,12px);justify-content:center;padding-top:clamp(10px,3vh,20px)}
.res-icon{font-size:clamp(2.5rem,10vw,4rem)}.res-title{font-size:clamp(1.1rem,4.5vw,1.5rem);font-weight:900;text-align:center}
.res-stats{display:flex;gap:clamp(4px,1.5vw,8px);width:100%}.res-stat{flex:1;background:var(--card);border-radius:clamp(8px,2.5vw,12px);padding:clamp(8px,2vw,12px);text-align:center;border:2px solid #2d2d4a}
.res-stat .rv{font-size:clamp(1rem,3.5vw,1.3rem);font-weight:900}.res-stat .rl{color:var(--muted);font-size:clamp(.5rem,1.8vw,.62rem)}
.xp-gain{color:var(--xp);font-weight:900;font-size:clamp(.9rem,3vw,1.1rem);text-align:center}

/* MODALS & PARTICLES */
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:clamp(1rem,4vw,1.6rem);animation:pUp .8s ease-out forwards}
@keyframes pUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.4) rotate(20deg)}}
.modal-o{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border-radius:clamp(14px,4vw,18px);padding:clamp(20px,5vw,28px);text-align:center;max-width:clamp(300px,85vw,400px);width:92%;border:2px solid #2d2d4a}
.modal h2{font-size:clamp(1.1rem,4vw,1.4rem);margin-bottom:6px}.modal p{color:var(--muted);margin-bottom:10px;font-size:clamp(.75rem,2.8vw,.88rem)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#f0c040;padding:8px 16px;border-radius:10px;font-size:14px;z-index:300;border:1px solid #f0c040;max-width:90vw;text-align:center}
.reward-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(1.8rem,6vw,2.5rem);font-weight:900;z-index:150;pointer-events:none;animation:rBoom 1s ease-out forwards}
@keyframes rBoom{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* TOPIC SCROLL */
.topic-scroll{width:100%;overflow-x:auto;white-space:nowrap;padding:4px 0;-webkit-overflow-scrolling:touch}.topic-scroll::-webkit-scrollbar{display:none}
.topic-chip{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(8px,2.5vw,12px);padding:clamp(6px,1.5vw,9px) clamp(10px,2.5vw,14px);margin-right:clamp(4px,1.5vw,6px);text-align:center;cursor:pointer;font-size:clamp(.65rem,2.2vw,.78rem);font-weight:600;color:var(--text)}.topic-chip:active{transform:scale(.95)}.topic-chip.exam{border-color:var(--gold);background:rgba(240,192,64,.1)}
.topic-chip .emoji{font-size:clamp(.9rem,3.5vw,1.2rem);display:block}

/* BOSS */
.boss-info{text-align:center}.boss-name{font-size:clamp(1.2rem,4.5vw,1.6rem);font-weight:900;color:var(--danger)}.boss-hp-bar{width:80%;max-width:300px;height:clamp(16px,4vw,20px);background:#2d2d4a;border-radius:10px;overflow:hidden;margin:6px auto}.boss-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),#ff6b6b);border-radius:10px;transition:width .5s}.boss-timer{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:900;color:var(--combo)}
</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div><div class="subtitle">同等学力申硕 · RPG 训练营 <b style="color:var(--accent)">v8</b></div>
  <div class="card char-card w"><div class="avatar" id="home-av">📖</div><div class="char-info"><div class="char-name" id="home-name">英语难民</div><div class="char-lvl" id="home-lvl">Lv.1 · 从零开始</div><div class="xp-bar"><div class="xp-fill" id="home-xp" style="width:0%"></div></div><div style="font-size:clamp(.58rem,2vw,.68rem);color:var(--muted)" id="home-xpt">0/100 XP</div></div></div>

  <div class="stats w"><div class="stat card"><div class="v" style="color:var(--combo)" id="s-streak">0</div><div class="l">🔥签到</div></div><div class="stat card"><div class="v" style="color:var(--gold)" id="s-coins">0</div><div class="l">🪙金币</div></div><div class="stat card"><div class="v" style="color:#22d3ee" id="s-best">0</div><div class="l">💎连击</div></div><div class="stat card"><div class="v" style="color:#a855f7" id="s-review">0</div><div class="l">🧠复习</div></div></div>

  <!-- 📅 Daily Guide -->
  <div class="card guide-card w" id="guide-card"><h3>📅 今日修炼指南</h3><div id="guide-items"></div><div style="font-size:clamp(.6rem,2vw,.7rem);color:var(--muted);margin-top:6px;text-align:right" id="guide-reward">全完成 +50💰 +30XP</div></div>

  <button class="btn btn-p w" onclick="startBattle()" id="btn-battle">⚡ 快速战斗 (5题·2分钟)</button>
  <button class="btn btn-s w" onclick="startLesson()">📖 互动语法课</button>

  <div class="btn-row w"><button class="btn-sm" onclick="startReading()" style="flex:1;color:var(--gold)">📰 阅读实战</button><button class="btn-sm" onclick="startWrite()" style="flex:1;color:var(--xp)">✍️ 写作填空</button></div>
  <div class="btn-row w"><button class="btn-sm" onclick="openShop()" style="flex:1;color:var(--gold)">🛒 商店</button><button class="btn-sm" onclick="openAchievements()" style="flex:1;color:#22d3ee">🏅 成就</button></div>

  <div style="color:var(--muted);font-size:clamp(.55rem,2vw,.65rem);margin-top:2px" class="w">🎯 自选专题</div>
  <div class="topic-scroll w" id="topic-scroll"></div>
  <button onclick="resetGame()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:4px 12px;border-radius:6px;font-size:clamp(.55rem,2vw,.65rem);cursor:pointer">🔄 重置</button>
</div>

<!-- ===== LESSON ===== -->
<div id="lesson-screen" class="screen"><div class="lesson-step w" id="lesson-content"></div><div class="btn-row w" style="margin-top:12px"><button class="btn-sm" id="lsn-prev" onclick="lsnPrev()" style="flex:1">← 上一步</button><button class="btn btn-p" id="lsn-next" onclick="lsnNext()" style="flex:1">下一步 →</button></div></div>

<!-- ===== READING ===== -->
<div id="reading-screen" class="screen" style="align-items:stretch;gap:clamp(6px,1.5vh,10px)">
  <div style="display:flex;align-items:center;gap:8px" class="w"><button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:4px 10px;border-radius:6px;font-size:clamp(.65rem,2.2vw,.72rem);cursor:pointer">←</button><span style="color:var(--muted);font-size:clamp(.7rem,2.5vw,.8rem)">📰 阅读实战</span><span style="margin-left:auto;color:var(--combo);font-weight:700;font-size:clamp(.75rem,2.8vw,.9rem)" id="read-timer">⏱ 8:00</span></div>
  <div id="read-passage" class="q-passage w"></div>
  <div class="q-text w" id="read-question"></div>
  <div class="fb" id="read-fb"></div>
  <div class="opts w" id="read-opts"></div>
</div>

<!-- ===== BATTLE ===== -->
<div id="battle-screen" class="screen">
  <div class="battle-top w"><button onclick="confirmQuit()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 8px;border-radius:4px;font-size:clamp(.6rem,2vw,.68rem);cursor:pointer">←</button><div class="hearts" id="hearts"></div><button onclick="speakBQ()" class="speak-btn" id="b-speak">🔊</button><div class="combo-badge" id="combo-badge">🔥</div></div>
  <div class="q-counter w" id="q-counter"></div>
  <div class="q-box w"><div class="q-text" id="q-text"></div></div>
  <div class="fb" id="fb"></div>
  <div class="opts w" id="opts"></div>
  <div style="font-size:clamp(.55rem,1.8vw,.65rem);color:var(--muted);text-align:center" id="reward-hint"></div>
</div>

<!-- ===== BOSS ===== -->
<div id="boss-screen" class="screen">
  <div class="boss-info w"><div style="font-size:clamp(2rem,10vw,3.5rem)" id="boss-icon">👹</div><div class="boss-name" id="boss-name">语法魔龙</div><div style="color:var(--muted);font-size:clamp(.65rem,2.5vw,.78rem);margin:2px 0">Boss战！答错受伤，倒计时压力</div><div class="boss-hp-bar"><div class="boss-hp-fill" id="boss-hp-fill" style="width:100%"></div></div><div class="boss-timer" id="boss-timer">⏱ 45s</div></div>
  <div class="q-box w"><div class="q-text" id="boss-q"></div></div>
  <div class="fb" id="boss-fb"></div>
  <div class="opts w" id="boss-opts"></div>
</div>

<!-- ===== RESULT ===== -->
<div id="result-screen" class="screen">
  <div class="res-icon" id="res-icon"></div><div class="res-title" id="res-title"></div>
  <div class="res-stats w"><div class="res-stat"><div class="rv" id="res-c">0</div><div class="rl">✅正确</div></div><div class="res-stat"><div class="rv" id="res-combo">0</div><div class="rl">🔥连击</div></div><div class="res-stat"><div class="rv" id="res-hp">3</div><div class="rl">❤️血量</div></div><div class="res-stat"><div class="rv" style="color:var(--gold)" id="res-coins">0</div><div class="rl">🪙金币</div></div></div>
  <div class="xp-gain" id="xp-gain"></div><div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;width:100%" id="loot-row"></div>
  <div id="lvl-msg"></div>
  <button class="btn btn-s w" onclick="startLesson()">📖 哪里不会学哪里</button>
  <button class="btn btn-p w" onclick="startBattle()">🔁 再来一局</button>
  <button onclick="goHome()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:6px 16px;border-radius:6px;font-size:clamp(.65rem,2.2vw,.75rem);cursor:pointer">🏠 回城</button>
</div>

<!-- ===== MODALS ===== -->
<div id="particles"></div>
<div id="lvl-modal" class="modal-o" style="display:none"><div class="modal"><div style="font-size:2.5rem">🎉</div><h2 id="lvl-title">升级！</h2><p id="lvl-desc"></p><button class="btn btn-g w" onclick="document.getElementById('lvl-modal').style.display='none'">太棒了！</button></div></div>
<div id="boss-modal" class="modal-o" style="display:none"><div class="modal"><div style="font-size:2.5rem" id="boss-res-icon">👑</div><h2 id="boss-res-title"></h2><p id="boss-res-desc"></p><button class="btn btn-g w" onclick="document.getElementById('boss-modal').style.display='none';goHome()">收下奖励</button></div></div>
<div id="shop-modal" class="modal-o" style="display:none"><div class="modal" style="max-width:clamp(320px,88vw,440px)"><h2>🛒 道具商店</h2><p style="color:var(--gold)">🪙 <span id="shop-bal">0</span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,8px);width:100%" id="shop-grid"></div><button class="btn-sm" onclick="document.getElementById('shop-modal').style.display='none'" style="margin-top:8px;width:100%">关闭</button></div></div>
<div id="ach-modal" class="modal-o" style="display:none"><div class="modal" style="max-width:clamp(320px,88vw,440px)"><h2>🏅 成就殿堂</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,6px);width:100%" id="ach-grid"></div><button class="btn-sm" onclick="document.getElementById('ach-modal').style.display='none'" style="margin-top:8px;width:100%">关闭</button></div></div>

<script>
// ==================== TTS ====================
function toast(m,d){d=d||2000;const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .5s';setTimeout(()=>e.remove(),500)},d)}
function speak(text,r){
  const c=(typeof text==='string'?text.replace(/<[^>]*>/g,'').replace(/\[.*?\]/g,'').trim():String(text));if(!c||c.length<1)return;
  if('speechSynthesis' in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c);const v=speechSynthesis.getVoices();const en=v.find(x=>x.lang.startsWith('en'));const zh=v.find(x=>x.lang.startsWith('zh'));if(en){u.voice=en;u.lang='en-US'}else if(zh){u.voice=zh;u.lang='zh-CN'}u.rate=r||0.85;u.volume=1;let h=false;u.onstart=()=>{h=true};u.onerror=()=>{if(!h)speakAudio(c)};u.onend=()=>{if(!h)speakAudio(c)};speechSynthesis.speak(u);setTimeout(()=>{if(!h){speechSynthesis.cancel();speakAudio(c)}},600);return}catch(e){}}
  speakAudio(c);
}
function speakAudio(t){
  const urls=[{u:'https://fanyi.baidu.com/gettts?lan=en&text=',s:'&spd=3&source=web'},{u:'https://translate.google.cn/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=',s:''}];let i=0;
  function nxt(){if(i>=urls.length)return;const a=new Audio();a.volume=1;a.src=urls[i].u+encodeURIComponent(t)+urls[i].s;a.onerror=()=>{i++;nxt()};a.play().catch(()=>{i++;nxt()});setTimeout(()=>{if(a.paused&&!a.ended){i++;nxt()}},2500)}nxt();
}
function sw(w){speak(w,0.7)}

function gRQ(){const n=Date.now(),d=[];for(const[k,v]of Object.entries(S.rq||{})){if(v.nr<=n)d.push({k,data:v})}return d}
function uR(b,i,ok){const k=b+':'+i,n=Date.now(),e=S.rq[k]||{bank:b,idx:i,rv:0,iv:1,nr:n,ef:2.5};if(ok){e.rv++;if(e.rv===1)e.iv=1;else if(e.rv===2)e.iv=3;else e.iv=Math.round(e.iv*e.ef)}else{e.rv=0;e.iv=1;e.ef=Math.max(1.3,e.ef-.2)}e.nr=n+e.iv*86400000;S.rq[k]=e}

let lsnCur=null,lsnStep=0,lsnPrac=0,lsnTapDone=false;
function startLesson(){
  const lv=gl(S.xp);const avail=LESSONS.filter(l=>l.lv<=lv.lv);const done=S.lsnDone||[];
  let next=avail.find(l=>!done.includes(l.id));
  if(!next){next=avail[0];S.lsnDone=[];ss(S)} // Replay if all done
  lsnCur=next;lsnStep=0;lsnPrac=0;lsnTapDone=false;
  rLsn();ssr('lesson-screen');
}
function rLsn(){
  const s=lsnCur.steps[lsnStep];
  let h='';
  if(s.type==='show'){h=`<div class="big-e">${lsnCur.icon}</div><h3>${s.t}</h3><p>${s.p}</p>${s.html}${s.extra||''}`}
  else if(s.type==='tap'){h=`<h3>${s.t}</h3><p>${s.p}</p>${s.html}`;lsnTapDone=false}
  else if(s.type==='quiz'){h=`<h3>${s.t}</h3><p>${s.p}</p>${s.html}<div class="q-box w" style="margin-top:8px"><div class="q-text">${s.q.q}</div></div><div class="opts w" id="lsn-quiz-opts" style="margin-top:6px"></div><div class="fb" id="lsn-quiz-fb"></div>`}
  else if(s.type==='practice'){h=`<h3>${s.t}</h3><p>${s.p}</p>${s.html}<div class="q-box w" style="margin-top:8px"><div class="q-text" id="lsn-prac-q"></div></div><div class="opts w" id="lsn-prac-opts" style="margin-top:6px"></div><div class="fb" id="lsn-prac-fb"></div>`;lsnPrac=0}
  document.getElementById('lesson-content').innerHTML=h;
  document.getElementById('lsn-prev').style.display=lsnStep===0?'none':'inline-flex';
  document.getElementById('lsn-next').style.display=s.type==='quiz'||s.type==='practice'?'none':'inline-flex';
  document.getElementById('lsn-next').textContent=lsnStep>=lsnCur.steps.length-1?'完成课程 →':'下一步 →';
  if(s.type==='quiz')rLsnQ(s.q);
  if(s.type==='practice')rLsnP();
}
function lsnTap(el){
  if(lsnTapDone)return;
  const s=lsnCur.steps[lsnStep];const isAns=el.dataset.ans==='1';
  el.classList.add('flash');lsnTapDone=true;
  if(isAns){sfxOK();rp('✅','找到了！');toast(s.hint||'正确！这就是主语。')}
  else{sfxNO();toast('不对哦。'+s.hint);setTimeout(()=>{lsnTapDone=false;el.classList.remove('flash')},800)}
}
