<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v6 · Degree English RPG</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444;--purple:#a855f7;--cyan:#22d3ee;
  --w:92vw;--mw:600px}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:clamp(15px,4vw,19px)}
.screen{display:none;flex-direction:column;align-items:center;padding:clamp(12px,3vw,24px);min-height:100dvh;width:100%}
.screen.active{display:flex}

/* ========== ALL CONTAINERS: fill screen, cap at 600px ========== */
.character-card,.stats-row,.btn,.daily-bar,.topic-scroll,.battle-header,.question-counter,.question-box,.options-grid,.passage-box,.result-stats,.skill-row,.learn-content,.shop-grid,.ach-grid,.write-prompt,.write-input-row,#topic-scroll>div{width:var(--w);max-width:var(--mw)}

/* HOME */
#home-screen{justify-content:flex-start;gap:clamp(10px,2.5vh,18px);padding-top:clamp(16px,4vh,32px)}
.game-title{font-size:clamp(2rem,7vw,3rem);font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;width:var(--w);max-width:var(--mw)}
.game-subtitle{color:var(--muted);font-size:clamp(.8rem,3vw,1rem);text-align:center;margin-top:-6px}
.character-card{background:var(--card);border-radius:clamp(14px,3vw,20px);padding:clamp(14px,3vw,20px);display:flex;align-items:center;gap:clamp(10px,2vw,16px);border:2px solid #2d2d4a}
.avatar{width:clamp(44px,12vw,60px);height:clamp(44px,12vw,60px);border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:clamp(1.4rem,5vw,2rem);flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-weight:700;font-size:clamp(.9rem,3.5vw,1.1rem)}
.char-title{color:var(--muted);font-size:clamp(.7rem,2.5vw,.85rem)}
.xp-bar-wrap{height:clamp(6px,1.5vw,9px);background:#2d2d4a;border-radius:4px;margin-top:5px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--xp);border-radius:4px;transition:width .5s}
.xp-text{font-size:clamp(.6rem,2.2vw,.78rem);color:var(--muted)}
.stats-row{display:flex;gap:clamp(4px,1.5vw,10px)}
.stat-box{flex:1;background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(8px,2vw,14px);text-align:center;border:2px solid #2d2d4a}
.stat-val{font-size:clamp(1rem,4vw,1.5rem);font-weight:900}
.stat-val.fire{color:var(--combo)}.stat-val.gold{color:var(--gold)}.stat-val.ice{color:var(--cyan)}.stat-val.purple{color:var(--purple)}
.stat-label{color:var(--muted);font-size:clamp(.55rem,2vw,.72rem)}
.btn{border:none;border-radius:clamp(12px,3vw,16px);padding:clamp(12px,3vw,18px) clamp(20px,5vw,36px);font-size:clamp(.95rem,3.5vw,1.2rem);font-weight:700;cursor:pointer;transition:transform .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-learn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a}
.btn-small{padding:clamp(7px,2vw,10px) clamp(14px,3vw,22px);font-size:clamp(.75rem,2.8vw,.9rem);max-width:200px;border-radius:clamp(8px,2vw,12px);background:var(--card);border:2px solid #2d2d4a;color:var(--text);cursor:pointer;font-weight:600}
.btn-small:active{transform:scale(.97)}
.daily-bar{background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(9px,2vw,13px) clamp(12px,3vw,18px);border:2px solid #2d2d4a;display:flex;align-items:center;gap:8px;font-size:clamp(.7rem,2.5vw,.88rem)}
.daily-progress{flex:1;height:clamp(5px,1.5vw,8px);background:#2d2d4a;border-radius:4px;overflow:hidden}
.daily-fill{height:100%;background:var(--combo);border-radius:4px;transition:width .5s}
.review-badge{display:inline-block;background:rgba(99,102,241,.2);color:var(--accent);font-size:clamp(.65rem,2.2vw,.78rem);padding:2px 8px;border-radius:10px;margin-left:4px}
.topic-scroll{overflow-x:auto;white-space:nowrap;padding:4px 0;-webkit-overflow-scrolling:touch}
.topic-scroll::-webkit-scrollbar{display:none}
.topic-chip{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(10px,2.5vw,14px);padding:clamp(7px,2vw,11px) clamp(10px,3vw,16px);margin-right:clamp(4px,1.5vw,8px);text-align:center;cursor:pointer;font-size:clamp(.7rem,2.5vw,.88rem);font-weight:600;color:var(--text);transition:all .15s;vertical-align:top}
.topic-chip:active{transform:scale(.95)}
.topic-chip .emoji{font-size:clamp(1rem,4vw,1.4rem);display:block;margin-bottom:2px}
.topic-chip.exam{border-color:var(--gold);background:rgba(240,192,64,.1)}

/* BATTLE */
#battle-screen{gap:clamp(8px,2vh,14px)}
.hearts{display:flex;gap:3px;font-size:clamp(1.1rem,4vw,1.5rem)}
.heart{transition:transform .3s,opacity .3s}.heart.lost{opacity:.2;transform:scale(.8)}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:3px 10px;border-radius:16px;font-size:clamp(.65rem,2.5vw,.85rem);opacity:0;transition:opacity .3s}
.combo-badge.active{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.reward-pop{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(2rem,7vw,3rem);font-weight:900;z-index:150;pointer-events:none;animation:rewardBoom 1s ease-out forwards}
@keyframes rewardBoom{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.4);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.question-counter{color:var(--muted);font-size:clamp(.7rem,2.5vw,.85rem)}
.dot{width:clamp(7px,2vw,10px);height:clamp(7px,2vw,10px);border-radius:50%;background:#2d2d4a;transition:background .3s;display:inline-block;margin:0 2px}
.dot.done{background:var(--success)}.dot.wrong{background:var(--danger)}.dot.current{background:var(--accent);animation:pulse 1s infinite}
.question-box{background:var(--card);border-radius:clamp(14px,3.5vw,18px);padding:clamp(18px,4vw,28px) clamp(14px,3vw,20px);text-align:center;border:2px solid #2d2d4a;min-height:clamp(70px,15vh,100px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.5vh,12px)}
.question-text{font-size:clamp(1rem,4vw,1.5rem);font-weight:700;line-height:1.7}
.passage-box{background:var(--card);border-radius:clamp(14px,3.5vw,18px);padding:clamp(12px,3vw,18px);border:2px solid #2d2d4a;font-size:clamp(.8rem,3vw,1rem);line-height:2.2;text-align:left}
.passage-box .blank{display:inline-block;min-width:clamp(50px,15vw,80px);border-bottom:2px dashed var(--accent);margin:0 4px;text-align:center;color:var(--gold);font-weight:700}
.speak-btn{background:rgba(99,102,241,.2);border:2px solid var(--accent);color:var(--accent);border-radius:22px;padding:clamp(5px,1.5vw,8px) clamp(10px,3vw,18px);font-size:clamp(.7rem,2.8vw,.9rem);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px;min-height:clamp(32px,9vw,44px)}
.speak-btn:active{background:rgba(99,102,241,.4);transform:scale(.95)}.speak-btn.speaking{background:var(--accent);color:#fff;animation:spulse .5s infinite}@keyframes spulse{0%,100%{opacity:1}50%{opacity:.4}}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,2vw,12px)}
.option-btn{background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(10px,3vw,14px);padding:clamp(12px,3vw,18px) clamp(10px,2.5vw,16px);font-size:clamp(.85rem,3.2vw,1.1rem);color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-weight:600;min-height:clamp(42px,11vw,56px);word-break:break-word}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{background:var(--success);border-color:var(--success);color:#fff;animation:popIn .3s}
.option-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}
.option-btn:disabled{pointer-events:none;opacity:.6}
.option-btn:disabled.correct,.option-btn:disabled.wrong{opacity:1}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.feedback-text{font-size:clamp(.9rem,3.5vw,1.2rem);font-weight:900;text-align:center;min-height:26px}
.feedback-text.good{color:var(--success)}.feedback-text.bad{color:var(--danger)}

/* WRITE */
#write-screen{padding:clamp(12px,3vw,20px);align-items:stretch;gap:clamp(8px,2vh,14px)}
.write-prompt{background:var(--card);border-radius:clamp(12px,3vw,16px);padding:clamp(14px,3vw,22px);border:2px solid #2d2d4a;font-size:clamp(.9rem,3.5vw,1.1rem);line-height:2.2}
.write-prompt .blank-input{border:none;border-bottom:2px solid var(--accent);background:transparent;color:var(--gold);font-size:inherit;padding:4px 8px;outline:none;min-width:clamp(60px,18vw,100px);text-align:center;font-weight:700}
.write-input-row{display:flex;gap:clamp(6px,2vw,10px)}
.write-input-row input{flex:1;background:var(--card);border:2px solid var(--accent);border-radius:clamp(8px,2vw,12px);padding:clamp(10px,2.5vw,16px);color:var(--text);font-size:clamp(.85rem,3vw,1.05rem);outline:none}
.write-input-row .btn-small{max-width:clamp(50px,15vw,74px)}
.write-feedback{text-align:center;font-size:clamp(.8rem,3vw,1rem);min-height:26px}

/* RESULT */
#result-screen{gap:clamp(10px,2.5vh,18px);justify-content:center}
.result-icon{font-size:clamp(3rem,12vw,5rem)}
.result-title{font-size:clamp(1.2rem,5vw,1.8rem);font-weight:900;text-align:center}
.result-stats{display:flex;gap:clamp(6px,2vw,10px)}
.result-stat{flex:1;background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(10px,2.5vw,16px);text-align:center;border:2px solid #2d2d4a}
.result-stat .val{font-size:clamp(1.1rem,4vw,1.5rem);font-weight:900}
.result-stat .lbl{color:var(--muted);font-size:clamp(.58rem,2vw,.72rem)}
.xp-gain{color:var(--xp);font-weight:900;font-size:clamp(.95rem,3.5vw,1.3rem);text-align:center}
.loot-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.loot-item{background:var(--card);border-radius:8px;padding:6px 10px;border:1px solid #2d2d4a;font-size:clamp(.7rem,2.5vw,.88rem)}

/* SKILL TREE */
.skill-row{display:flex;align-items:center;gap:clamp(4px,1.5vw,8px);margin:clamp(4px,1vh,8px) 0;flex-wrap:wrap}
.skill-node{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(8px,2vw,12px);padding:clamp(7px,2vw,10px) clamp(10px,2.5vw,14px);font-size:clamp(.75rem,2.8vw,.92rem);font-weight:600}
.skill-node.done{border-color:var(--success);background:rgba(34,197,94,.1)}
.skill-node.now{border-color:var(--accent);background:rgba(99,102,241,.15);animation:pulse 2s infinite}
.skill-node.locked{opacity:.35}
.skill-arrow{color:var(--muted);font-size:clamp(.8rem,3vw,1rem)}

/* LEARN */
.learn-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;width:var(--w);max-width:var(--mw)}
.learn-content{background:var(--card);border-radius:clamp(12px,3vw,16px);padding:clamp(14px,3vw,20px);border:2px solid #2d2d4a;line-height:1.9;font-size:clamp(.82rem,3.2vw,1rem);overflow-y:auto;flex:1;max-height:calc(100dvh - 170px);width:var(--w);max-width:var(--mw)}
.learn-content h3{color:var(--gold);margin:12px 0 5px;font-size:clamp(.9rem,3.5vw,1.15rem)}.learn-content h3:first-child{margin-top:0}
.learn-content .ex{background:#0a0a0a;border-radius:8px;padding:clamp(7px,2vw,10px);margin:5px 0;font-size:clamp(.75rem,2.8vw,.92rem);border-left:3px solid var(--accent)}
.learn-content .tip{background:rgba(240,192,64,.1);border-radius:8px;padding:clamp(6px,2vw,10px);margin:5px 0;font-size:clamp(.73rem,2.8vw,.88rem);border-left:3px solid var(--gold)}
.learn-content .wrong-spot{background:rgba(248,113,113,.1);border-radius:8px;padding:clamp(6px,2vw,10px);margin:5px 0;font-size:clamp(.73rem,2.8vw,.88rem);border-left:3px solid var(--danger)}
.learn-actions{padding:12px 0;text-align:center}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:clamp(14px,4vw,20px);padding:clamp(22px,5vw,32px) clamp(16px,4vw,24px);text-align:center;max-width:clamp(300px,85vw,420px);width:92%;border:2px solid #2d2d4a}
.modal h2{font-size:clamp(1.1rem,4.5vw,1.5rem);margin-bottom:6px}.modal p{color:var(--muted);margin-bottom:12px;font-size:clamp(.78rem,3vw,.92rem)}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(6px,2vw,10px)}
.shop-item{background:var(--card);border-radius:clamp(10px,3vw,16px);padding:clamp(10px,2.5vw,16px);border:2px solid #2d2d4a;text-align:center}
.shop-item .icon{font-size:clamp(1.6rem,6vw,2.4rem);display:block}.shop-item .name{font-weight:700;font-size:clamp(.78rem,3vw,.92rem)}.shop-item .desc{color:var(--muted);font-size:clamp(.6rem,2.3vw,.72rem);margin:2px 0}.shop-item .price{color:var(--gold);font-weight:700;font-size:clamp(.72rem,2.8vw,.88rem)}.shop-item button{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:clamp(6px,1.5vw,9px) clamp(12px,3vw,18px);font-size:clamp(.7rem,2.8vw,.88rem);cursor:pointer;font-weight:600}.shop-item button:disabled{opacity:.4;pointer-events:none}
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(5px,1.5vw,8px)}
.ach-item{background:var(--card);border-radius:clamp(8px,2.5vw,12px);padding:clamp(8px,2vw,12px);border:2px solid #2d2d4a;text-align:center;font-size:clamp(.7rem,2.6vw,.88rem)}.ach-item.unlocked{border-color:var(--gold)}.ach-item.locked{opacity:.4}.ach-item .a-icon{font-size:clamp(1.3rem,5vw,1.8rem);display:block}
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:clamp(1.2rem,4vw,1.8rem);animation:particleUp .8s ease-out forwards}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5) rotate(20deg)}}

.tut-step{text-align:center;width:var(--w);max-width:var(--mw)}
.tut-step .big-emoji{font-size:clamp(3rem,12vw,5rem);display:block;margin-bottom:12px}
.tut-step h3{font-size:clamp(1.1rem,4.5vw,1.5rem);margin-bottom:4px}
.tut-step p{color:var(--muted);font-size:clamp(.8rem,3.2vw,1rem);line-height:1.7}
.tut-step .demo-sentence{font-size:clamp(1rem,4vw,1.5rem);font-weight:700;padding:clamp(8px,2vw,12px);background:var(--card);border-radius:8px;margin:6px 0;display:inline-block}
.tut-step .demo-sentence .s{color:#60a5fa}.tut-step .demo-sentence .v{color:#f87171}.tut-step .demo-sentence .o{color:#4ade80}.tut-step .demo-sentence .c{color:#fbbf24}
</style>
</head>
<body>

<!-- ==================== HOME ==================== -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div><div class="game-subtitle">同等学力申硕 · RPG 训练营 <b style="color:var(--accent);font-size:clamp(.6rem,2vw,.72rem)">v6</b></div>
  <div class="character-card">
    <div class="avatar" id="avatar-icon">📖</div>
    <div class="char-info">
      <div class="char-name" id="char-name">英语难民</div><div class="char-title" id="char-title">Lv.1 · 从零开始</div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
  </div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-val fire" id="stat-streak">0</div><div class="stat-label">🔥签到</div></div>
    <div class="stat-box"><div class="stat-val gold" id="stat-coins">0</div><div class="stat-label">🪙金币</div></div>
    <div class="stat-box"><div class="stat-val ice" id="stat-best">0</div><div class="stat-label">💎连击</div></div>
    <div class="stat-box"><div class="stat-val purple" id="stat-review">0</div><div class="stat-label">🧠待复习</div></div>
  </div>
  <div class="daily-bar"><span>📅</span><span style="flex:1;font-size:clamp(.65rem,2.5vw,.82rem)" id="daily-text">今日 0/3</span><div class="daily-progress"><div class="daily-fill" id="daily-fill" style="width:0%"></div></div><span style="color:var(--gold);font-size:clamp(.6rem,2.3vw,.75rem)" id="daily-reward">+50💰</span></div>
  <button class="btn btn-primary" onclick="startBattle()" id="btn-battle">⚡ 开始修炼</button>
  <button class="btn btn-learn" onclick="startLearn()">📖 学习模式</button>
  <button class="btn-small" onclick="testTTS()" style="width:var(--w);max-width:var(--mw);background:var(--card);border:1px solid var(--accent);color:var(--accent);font-size:clamp(.7rem,2.5vw,.85rem);padding:clamp(6px,1.5vw,9px);margin-top:-4px">🔊 测试语音（点我）</button>
  <div style="display:flex;gap:clamp(6px,2vw,10px);width:var(--w);max-width:var(--mw)">
    <button class="btn-small" onclick="startWrite()" style="color:var(--gold);flex:1;max-width:none">✍️ 写作填空</button>
    <button class="btn-small" onclick="openSkillTree()" style="color:var(--xp);flex:1;max-width:none">🌳 技能树</button>
  </div>
  <div style="display:flex;gap:clamp(6px,2vw,10px);width:var(--w);max-width:var(--mw)">
    <button class="btn-small" onclick="openShop()" style="color:var(--gold);flex:1;max-width:none">🛒 商店</button>
    <button class="btn-small" onclick="openAchievements()" style="color:var(--cyan);flex:1;max-width:none">🏅 成就</button>
  </div>
  <div style="color:var(--muted);font-size:clamp(.6rem,2.2vw,.72rem);margin-top:2px;width:var(--w);max-width:var(--mw)">🎯 自选专题</div>
  <div class="topic-scroll" id="topic-scroll"></div>
  <button onclick="resetGame()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 14px;border-radius:8px;font-size:clamp(.62rem,2.2vw,.75rem);cursor:pointer;width:var(--w);max-width:var(--mw)">🔄 重置存档</button>
</div>

<!-- ==================== TUTORIAL ==================== -->
<div id="tutorial-screen" class="screen">
  <div class="tut-step" id="tut-content"></div>
  <div style="display:flex;gap:8px;margin-top:14px;width:var(--w);max-width:var(--mw)">

<script>
// ==================== TTS ENGINE v6 (TRIPLE ENGINE + VISIBLE FEEDBACK) ====================
let ttsStatus=''; // visible status for debugging

function toast(msg,ms){
  const el=document.createElement('div');
  el.textContent=msg;
  el.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#f0c040;padding:8px 16px;border-radius:10px;font-size:14px;z-index:300;border:1px solid #f0c040;max-width:90vw;text-align:center';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .5s';setTimeout(()=>el.remove(),500)},ms||2500);
}

function speak(text,rate){
  const clean=(typeof text==='string'?text.replace(/<[^>]*>/g,'').replace(/\[.*?\]/g,'').trim():String(text));
  if(!clean||clean.length<1)return;

  // ENGINE 1: Web Speech — try WITHOUT lang first (Chinese phones may not have en-US voice)
  if('speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(clean);
      // DON'T set lang — let phone use whatever voice it has to pronounce English
      u.rate=rate||0.85;
      u.volume=1;
      // Track if this actually produces audio
      let heard=false;
      u.onstart=()=>{heard=true;ttsStatus='✅ Web Speech 工作中'};
      u.onerror=(e)=>{ttsStatus='Web Speech 错误:'+e.error;if(!heard)speakAudio(clean)};
      u.onend=()=>{if(!heard){ttsStatus='Web Speech 无声，切 Audio';speakAudio(clean)}};
      speechSynthesis.speak(u);
      // If no onstart within 500ms, assume it failed silently
      setTimeout(()=>{if(!heard){speechSynthesis.cancel();speakAudio(clean)}},600);
      return;
    }catch(e){ttsStatus='Web Speech 异常:'+e.message}
  }

  // ENGINE 2: Audio element fallback
  speakAudio(clean);
}

function speakAudio(text){
  ttsStatus='尝试 Audio 播放...';
  // Try multiple TTS URLs (some may be blocked in China)
  const urls=[
    {url:'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=',name:'Google'},
    {url:'https://translate.google.cn/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=',name:'Google CN'},
  ];
  let idx=0;
  const el=document.createElement('audio');
  el.volume=1;

  function tryNext(){
    if(idx>=urls.length){ttsStatus='❌ 所有 TTS 源不可用';toast('❌ 语音播放失败。你的网络可能受限。请确保手机媒体音量已打开。',4000);return}
    el.src=urls[idx].url+encodeURIComponent(text);
    el.play().then(()=>{ttsStatus='✅ '+urls[idx].name+' TTS 播放中'}).catch(()=>{idx++;tryNext()});
    el.onerror=()=>{idx++;tryNext()};
  }
  tryNext();
}

function speakWord(w){speak(w,0.7)}
function speakBattleQ(){
  const el=document.getElementById('battle-speak-btn');
  if(el){el.classList.add('speaking');setTimeout(()=>el.classList.remove('speaking'),2000)}
  const q=document.getElementById('question-text')?.textContent||'';
  if(q)speak(q);
}
function speakLearn(){speak(document.getElementById('learn-content')?.textContent||'')}

function testTTS(){
  let diag='';
  if('speechSynthesis' in window){
    const v=speechSynthesis.getVoices();
    diag='📱 Web Speech: '+v.length+'个语音\n';
    if(v.length>0){
      const eng=v.filter(x=>x.lang.startsWith('en'));
      const zh=v.filter(x=>x.lang.startsWith('zh'));
      diag+='英文:'+eng.length+'个 中文:'+zh.length+'个\n';
      if(eng.length>0)diag+=eng.slice(0,3).map(x=>x.name).join(',')+'\n';
    }else{diag+='(语音列表为空，将不设语言尝试)\n'}
  }else{diag='❌ 浏览器不支持 Web Speech\n'}
  diag+='\n正在尝试播放测试音频...\n如果没声音：\n1. 检查手机媒体音量\n2. 尝试用 Chrome 打开';
  toast('🔊 测试中...',1500);
  speak('Hello');
  alert(diag);
}

function levenshtein(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n]}

function sfxCoin(){bp(1200,.05);setTimeout(()=>bp(1400,.08),60);setTimeout(()=>bp(1600,.06),120)}
function sfxDrop(){bp(600,.05,'triangle');setTimeout(()=>bp(800,.05,'triangle'),80);setTimeout(()=>bp(1000,.08,'triangle'),160)}
function sp(x,y,e,n){const c=document.getElementById('particles');for(let i=0;i<(n||8);i++){const p=document.createElement('span');p.className='particle';p.textContent=e;p.style.left=(x+Math.random()*60-30)+'px';p.style.top=(y+Math.random()*20-10)+'px';p.style.animationDuration=(.5+Math.random()*.6)+'s';c.appendChild(p);setTimeout(()=>p.remove(),900)}}
function rewardPop(e,t){const el=document.createElement('div');el.className='reward-pop';el.textContent=e+' '+t;el.style.left='50%';el.style.top='40%';document.body.appendChild(el);setTimeout(()=>el.remove(),1100)}

function ssr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){forcedTopic=null;ssr('home-screen');renderHome()}

const TUT_STEPS=[
  {e:'👋',t:'欢迎来到英语征途！',p:'你好勇士！你的起点：<b>零基础</b>。目标：<b>60分及格</b>。<br>我只教考试会考的，不教不考的。',btn:'开始冒险 →'},
  {e:'📐',t:'英文只有5种句型',p:'<span class="demo-sentence"><span class="s">Birds</span> <span class="v">fly</span>.</span><br><span class="demo-sentence"><span class="s">She</span> <span class="v">eats</span> <span class="o">rice</span>.</span><br><span class="demo-sentence"><span class="s">She</span> <span class="v">is</span> <span class="c">tall</span>.</span><br><button onclick="speak(\'Birds fly. She eats rice. She is tall.\')" class="speak-btn">🔊 听发音</button>',btn:'原来这么简单 →'},
  {e:'🔊',t:'每词都能读',p:'点 🔊 听到发音。<br>听见的声音记单词快3倍。<br><button onclick="speakWord(\'achievement\')" class="speak-btn">🔊 achievement</button> = 成就',btn:'我听到了 →'},
  {e:'⚔️',t:'战斗模式',p:'❤️ 3条命 · 🔥 连击翻倍 · 🪙 金币暴击<br>⚡ 10%概率超级暴击！每道题都是开盲盒。',btn:'太爽了 →'},
  {e:'🧠',t:'智能复习',p:'错题自动加入复习队列，1天/3天/7天后提醒。<br>你是在<b>和遗忘曲线打架</b>——而且你会赢。',btn:'开始修炼！→'},
];
let tutStep=0;
function showTut(){const s=TUT_STEPS[tutStep];document.getElementById('tut-content').innerHTML=`<div class="big-emoji">${s.e}</div><h3>${s.t}</h3><p>${s.p}</p>`;document.getElementById('tut-prev').style.display=tutStep===0?'none':'';document.getElementById('tut-next').textContent=s.btn;ssr('tutorial-screen')}
function tutNext(){tutStep++;if(tutStep>=TUT_STEPS.length){state.tutDone=true;ss(state);goHome()}else showTut()}
function tutPrev(){if(tutStep>0){tutStep--;showTut()}}

function renderHome(){
  if(!state.tutDone){showTut();return}
  const lv=gl(state.xp);
  document.getElementById('avatar-icon').textContent=lv.icon;document.getElementById('char-name').textContent=lv.title;document.getElementById('char-title').textContent=`Lv.${lv.lv} · ${lv.desc}`;
  const nxt=xn(lv.lv),cur=state.xp-lv.xp;
  document.getElementById('xp-bar').style.width=nxt?(cur/nxt*100)+'%':'100%';document.getElementById('xp-text').textContent=`${cur} / ${nxt} XP`;
  document.getElementById('stat-streak').textContent=state.streak;document.getElementById('stat-coins').textContent=state.coins;document.getElementById('stat-best').textContent=state.bestCombo;document.getElementById('stat-review').textContent=getReviewCount();
  const today=new Date().toDateString();
  if(state.dailyDate!==today){state.dailyDone=0;state.dailyDate=today;state._claimedDaily=false;ss(state)}
  document.getElementById('daily-text').textContent=`今日 ${state.dailyDone}/3`;document.getElementById('daily-fill').style.width=(state.dailyDone/3*100)+'%';document.getElementById('daily-reward').textContent=state.dailyDone>=3&&!state._claimedDaily?'+50💰':state.dailyDone>=3?'✅':'+50💰';
  const rc=getReviewCount();const bb=document.getElementById('btn-battle');bb.textContent=rc>0?`⚡ 开始修炼 (🧠${rc}题待复习)`:'⚡ 开始修炼';
  const topics=[{id:'sentence-basic',e:'📐',t:'句型'},{id:'clause-markers',e:'🔗',t:'从句'},{id:'sentence-mixed',e:'🔪',t:'拆句'},{id:'text-completion',e:'📝',t:'短文完成'},{id:'vocab-1',e:'📖',t:'词01'},{id:'vocab-2',e:'📖',t:'词02'},{id:'vocab-3',e:'📖',t:'词03'},{id:'vocab-4',e:'📖',t:'词04'},{id:'reading',e:'📰',t:'阅读'},{id:'cloze',e:'🧩',t:'完形'},{id:'translation',e:'🌐',t:'翻译'},{id:'listening',e:'🎧',t:'听力'},{id:'exam-real',e:'📄',t:'真题',exam:1},];
  document.getElementById('topic-scroll').innerHTML=topics.map(t=>`<div class="topic-chip${t.exam?' exam':''}" onclick="startBattle('${t.id}')"><span class="emoji">${t.e}</span>${t.t}</div>`).join('');
}

function startLearn(){
  const lv=gl(state.xp);document.getElementById('learn-label').textContent=`Lv.${lv.lv} · ${lv.title}`;
  const banks=(lv.banks||[]).map(b=>b.b);let html='';const p=banks[0]||'sentence-basic';if(LESSONS[p])html+=LESSONS[p];
  banks.forEach(b=>{if((b.startsWith('vocab-')||b==='reading'||b==='listening'||b==='text-completion')&&LESSONS[b]&&!html.includes(LESSONS[b].slice(0,30))){html+='<hr style="border-color:#2d2d4a;margin:12px 0">'+LESSONS[b]}});
  if(!html)html=LESSONS['default'];document.getElementById('learn-content').innerHTML=html;document.getElementById('learn-content').scrollTop=0;ssr('learn-screen');
}

function openSkillTree(){
  const nodes=[{l:'语法线',items:[{id:'sentence-basic',n:'五大句型',e:'📐',cond:v=>v.totalQ>=5},{id:'clause-markers',n:'从句标记',e:'🔗',cond:v=>v.totalQ>=30},{id:'sentence-mixed',n:'拆句实战',e:'🔪',cond:v=>v.totalQ>=60},]},{l:'词汇线',items:[{id:'vocab-1',n:'词1-30',e:'📝',cond:v=>v.totalC>=3},{id:'vocab-2',n:'词31-60',e:'📝',cond:v=>v.totalC>=15},{id:'vocab-3',n:'词61-90',e:'📝',cond:v=>v.totalC>=30},{id:'vocab-4',n:'词91-120',e:'📝',cond:v=>v.totalC>=45},]},{l:'题型线',items:[{id:'text-completion',n:'短文完成',e:'📋',cond:v=>v.totalQ>=40},{id:'reading',n:'阅读态度',e:'📰',cond:v=>v.totalQ>=80},{id:'cloze',n:'完形搭配',e:'🧩',cond:v=>v.totalQ>=120},{id:'translation',n:'翻译陷阱',e:'🌐',cond:v=>v.totalQ>=160},]},];
  let h='';nodes.forEach(line=>{h+=`<div style="color:var(--muted);font-size:clamp(.65rem,2.2vw,.75rem);margin:10px 0 4px">${line.l}</div><div class="skill-row">`;line.items.forEach((n,i)=>{const done=n.cond(state);const lv=LEVELS.find(l=>(l.banks||[]).some(b=>b.b===n.id));const isNow=lv&&gl(state.xp).lv===lv.lv;const cls=done?'done':isNow?'now':'locked';h+=`<span class="skill-node ${cls}">${done?n.e:'🔒'} ${n.n}</span>`;if(i<line.items.length-1)h+='<span class="skill-arrow">→</span>'});h+='</div>'});document.getElementById('skill-tree').innerHTML=h;ssr('skill-screen')
}

function openShop(){document.getElementById('shop-balance').textContent=state.coins;document.getElementById('shop-items').innerHTML=SHOP.map(i=>{const o=state.inventory[i.id]||0;return`<div class="shop-item"><span class="icon">${i.e}</span><div class="name">${i.n}</div><div class="desc">${i.d}</div><div class="price">🪙${i.price} · ${o}</div><button onclick="buyItem('${i.id}')" ${state.coins<i.price?'disabled':''}>购买</button></div>`}).join('');document.getElementById('shop-modal').style.display='flex'}
function buyItem(id){const i=SHOP.find(x=>x.id===id);if(!i||state.coins<i.price)return;state.coins-=i.price;state.inventory[id]=(state.inventory[id]||0)+1;ss(state);sfxCoin();rewardPop('🛒','+1 '+i.n);openShop()}
function checkAch(){ACHIEVEMENTS.forEach(a=>{if(!state.unlockedAch.includes(a.id)&&a.c(state)){state.unlockedAch.push(a.id);ss(state);sfxLV();sp(window.innerWidth/2,window.innerHeight/2,'🏅',12);setTimeout(()=>rewardPop('🏅',a.n),200)}})}
function openAchievements(){document.getElementById('ach-list').innerHTML=ACHIEVEMENTS.map(a=>{const u=state.unlockedAch.includes(a.id);return`<div class="ach-item ${u?'unlocked':'locked'}"><span class="a-icon">${u?a.e:'🔒'}</span><b>${a.n}</b><br><small>${a.d}</small></div>`}).join('');document.getElementById('ach-modal').style.display='flex'}

function startBattle(topicOverride){
  activeBoosts={xpBoost:1,coinBoost:1,shield:0,streakSave:0,comboStart:0};
  ['xp-boost','coin-boost','shield','streak-save','combo-starter'].forEach(id=>{if(state.inventory[id]&&state.inventory[id]>0){if(id==='xp-boost')activeBoosts.xpBoost=2;else if(id==='coin-boost')activeBoosts.coinBoost=2;else if(id==='shield')activeBoosts.shield=1;else if(id==='streak-save')activeBoosts.streakSave=1;else if(id==='combo-starter')activeBoosts.comboStart=2;state.inventory[id]--;ss(state)}});
  let pool=[];
  if(topicOverride){pool=BANKS[topicOverride]||[];const rqs=getReviewQueue().filter(r=>r.data.bank===topicOverride).map(r=>{const q=BANKS[r.data.bank]?.[r.data.idx];return q?{...q,_review:true,_rkey:r.key}:null}).filter(Boolean);pool=pool.concat(rqs.slice(0,3))}
  else{const lv=gl(state.xp);const rqs=getReviewQueue().slice(0,3).map(r=>{const q=BANKS[r.data.bank]?.[r.data.idx];return q?{...q,_review:true,_rkey:r.key}:null}).filter(Boolean);rqs.forEach(q=>pool.push(q));(lv.banks||[{b:'sentence-basic',w:5}]).forEach(({b,w})=>{const qs=BANKS[b]||[];const take=Math.min(qs.length,Math.ceil(w*2));pool=pool.concat(sh(qs).slice(0,take))})}
  if(!pool.length)pool=BANKS['sentence-basic']||[];
  const n=Math.min(10,pool.length);battle={questions:sh(pool).slice(0,n),idx:0,hp:3,combo:activeBoosts.comboStart,mc:0,cor:0,rxp:0,coins:0,drops:[]};forcedTopic=topicOverride||null;if(activeBoosts.shield>0)battle.shielded=true;ssr('battle-screen');rH();uCB();uQC();sQ()
}
function rH(){let h='';for(let i=0;i<3;i++)h+=`<span class="heart${i>=battle.hp?' lost':''}">${i>=battle.hp?'🖤':'❤️'}</span>`;if(activeBoosts.shield>0)h+='<span style="font-size:.8rem">🛡️</span>';document.getElementById('hearts').innerHTML=h}
function uCB(){const b=document.getElementById('combo-badge');if(battle.combo>=2){b.textContent=`🔥 x${battle.combo}`;b.classList.add('active')}else b.classList.remove('active')}
function uQC(){let d='';for(let i=0;i<battle.questions.length;i++)d+=`<span class="dot ${i<battle.idx?'done':(i===battle.idx?'current':'')}"></span>`;const q=battle.questions[battle.idx];const bonus=q?._review?'<span class="review-badge">🧠复习</span>':'';document.getElementById('question-counter').innerHTML=`${battle.idx+1}/${battle.questions.length} ${d}${bonus}`;document.getElementById('reward-hint').textContent=q?._review?'🔄 这是之前的错题，复习记得更牢！':''}
function sQ(){if(battle.idx>=battle.questions.length||battle.hp<=0){eB();return}const q=battle.questions[battle.idx];document.getElementById('question-text').innerHTML=q.q;document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback-text';const o=document.getElementById('options');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='option-btn';b.textContent=t;b.onclick=()=>aQ(i);o.appendChild(b)});uQC();if(Math.random()>0.85)document.getElementById('reward-hint').textContent='🍀 本题可能触发暴击！'}
function aQ(idx){
  const q=battle.questions[battle.idx];const ok=idx===q.a;const btns=document.querySelectorAll('#options .option-btn');btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});if(!ok)btns[idx].classList.add('wrong');const fb=document.getElementById('feedback');
  if(!forcedTopic){const bankId=Object.keys(BANKS).find(k=>BANKS[k].some(bq=>bq.q===q.q))||'unknown';const bankIdx=(BANKS[bankId]||[]).findIndex(bq=>bq.q===q.q);if(bankIdx>=0)updateReview(bankId,bankIdx,ok);if(ok&&q._review){state.reviewDone=(state.reviewDone||0)+1}}
  if(ok){battle.cor++;battle.combo++;if(battle.combo>battle.mc)battle.mc=battle.combo;const roll=Math.random();let bx=0,bc=0,drop='';if(roll>0.9){bx=rnd(20,30);bc=rnd(15,25);drop='⚡ 超级暴击！';sfxDrop()}else if(roll>0.75){bx=rnd(10,15);bc=rnd(5,15);drop='🌟 幸运暴击！';sfxCoin()}else if(roll>0.55){bc=rnd(3,8);drop='💰 掉金币了！';sfxCoin()}else{sfxOK()}if(battle.combo>=3){bx+=Math.floor(battle.combo/3)*5;sfxCB()}const e=(10+bx)*activeBoosts.xpBoost;const c=(bc||3)*activeBoosts.coinBoost;battle.rxp+=e;battle.coins+=c;if(drop)battle.drops.push(drop);fb.innerHTML=`✅ 正确！${drop||''}+${e}XP +${c}💰${battle.combo>=3?` 🔥${battle.combo}连击`:''}`;fb.className='feedback-text good';if(drop){sp(window.innerWidth/2,window.innerHeight/2,bx>15?'⚡':'💰');rewardPop(bx>15?'⚡':'💰',bx>15?`+${e}XP!`:`+${c}金币`)}if(q._review)document.getElementById('reward-hint').textContent='🧠 复习题答对，记忆已强化！'}
  else{if(activeBoosts.shield>0){activeBoosts.shield=0;fb.innerHTML='🛡️ <b>护盾抵挡！</b>';fb.className='feedback-text good'}else{battle.hp--;if(activeBoosts.streakSave){activeBoosts.streakSave=0;fb.innerHTML=`❌ 答案 <b>${q.o[q.a]}</b><br>🔒 连击保护！`}else{fb.innerHTML=`❌ 答案 <b>${q.o[q.a]}</b><br><small>${q.h}</small>`;battle.combo=0}sfxNO();sp(window.innerWidth/2,window.innerHeight/2,'💔',3)}fb.className='feedback-text bad'}
  if(ok&&(forcedTopic||'').startsWith('vocab'))state.vocabCorrect++;rH();uCB();uQC();setTimeout(()=>{battle.idx++;sQ()},ok?700:1800)
}
function eB(){
  state.totalQ+=battle.questions.length;state.totalC+=battle.cor;state.xp+=battle.rxp;state.coins+=battle.coins;state.totalCoins+=battle.coins;if(battle.mc>state.bestCombo)state.bestCombo=battle.mc;if(battle.cor===battle.questions.length&&battle.questions.length>=8)state.perfect++;
  const ol=state.lv;const nl=gl(state.xp);state.lv=nl.lv;const today=new Date().toDateString();
  if(state.dailyDate===today)state.dailyDone=Math.min(3,state.dailyDone+1);else{state.dailyDone=1;state.dailyDate=today}if(state.dailyDone>=3&&!state._claimedDaily){state.coins+=50;state.totalCoins+=50;state._claimedDaily=true}
  if(state.lastPlayDate){const y=new Date(Date.now()-86400000).toDateString();if(state.lastPlayDate===y)state.streak++;else if(state.lastPlayDate!==today)state.streak=1}else state.streak=1;state.lastPlayDate=today;ss(state);checkAch();
  ssr('result-screen');const p=battle.cor===battle.questions.length;document.getElementById('result-icon').textContent=p?'👑':battle.cor>=battle.questions.length*0.7?'✨':'💪';document.getElementById('result-title').textContent=p?'完美通关！':battle.cor>=battle.questions.length*0.7?'表现不错！':'继续加油！';document.getElementById('res-correct').textContent=battle.cor+'/'+battle.questions.length;document.getElementById('res-combo').textContent=battle.mc;document.getElementById('res-hp').textContent=battle.hp;document.getElementById('res-coins').textContent=`+${battle.coins}`;document.getElementById('xp-gain').textContent=`+${battle.rxp} XP${activeBoosts.xpBoost>1?' (双倍!)':''}`;document.getElementById('loot-row').innerHTML=battle.drops.length?battle.drops.filter((v,i,a)=>a.indexOf(v)===i).map(d=>`<span class="loot-item">${d}</span>`).join(''):'';document.getElementById('review-msg').textContent=getReviewCount()>0?`🧠 ${getReviewCount()}题待复习`:'✅ 复习队列清空！';if(nl.lv>ol){sfxLV();document.getElementById('level-up-msg').innerHTML=`<div style="color:var(--gold);font-weight:900;font-size:1.1rem;margin-top:8px">🎉 ${nl.icon} ${nl.title}</div>`;sp(window.innerWidth/2,window.innerHeight/2,'🎉',15);setTimeout(()=>{document.getElementById('level-title').textContent=`晋升 ${nl.title}！`;document.getElementById('level-desc').textContent=`${nl.desc}\n${state.xp} XP`;document.getElementById('level-modal').style.display='flex'},400)}else document.getElementById('level-up-msg').innerHTML='';if(state.dailyDate!==today)state._claimedDaily=false
}
function confirmQuit(){if(confirm('确定逃走？进度丢失。'))goHome()}
function resetGame(){if(confirm('重置所有存档？')){state=JSON.parse(JSON.stringify(D));ss(state);goHome()}}
renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
