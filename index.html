<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 v9</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-size:clamp(15px,4vw,18px)}
.screen{display:none;flex-direction:column;align-items:center;padding:clamp(10px,3vw,18px);min-height:100dvh;width:100%}
.screen.active{display:flex}
.w{width:92vw;max-width:640px}
.card{background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(10px,3vw,16px);border:2px solid #2d2d4a}
#home-screen{gap:clamp(7px,1.5vh,12px);padding-top:clamp(10px,2.5vh,18px)}
.game-title{font-size:clamp(1.7rem,6.5vw,2.4rem);font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.sb{color:var(--muted);font-size:clamp(.68rem,2.5vw,.8rem);text-align:center;margin-top:-6px}
.char-card{display:flex;align-items:center;gap:clamp(8px,2vw,12px)}.av{width:clamp(36px,10vw,46px);height:clamp(36px,10vw,46px);border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:clamp(1.1rem,4.5vw,1.4rem);flex-shrink:0}
.ci{flex:1;min-width:0}.cn{font-weight:700;font-size:clamp(.8rem,3vw,.92rem)}.cl{color:var(--muted);font-size:clamp(.6rem,2.2vw,.7rem)}
.xb{height:clamp(4px,1.5vw,6px);background:#2d2d4a;border-radius:3px;margin-top:3px;overflow:hidden}.xf{height:100%;background:var(--xp);border-radius:3px;transition:width .5s}
.stats{display:flex;gap:clamp(4px,1.5vw,8px)}.st{flex:1;text-align:center;padding:clamp(6px,2vw,10px);border-radius:clamp(8px,2.5vw,10px)}.st .v{font-size:clamp(.88rem,3.5vw,1.1rem);font-weight:900}.st .l{color:var(--muted);font-size:clamp(.5rem,1.8vw,.6rem)}
.guide{border:2px solid var(--accent);background:rgba(99,102,241,.08)}.guide h3{font-size:clamp(.76rem,3vw,.9rem);margin-bottom:4px}
.gi{display:flex;align-items:center;gap:5px;padding:clamp(3px,1vw,5px) 0;font-size:clamp(.68rem,2.5vw,.8rem);cursor:pointer}.gi .ch{width:clamp(15px,4.5vw,19px);height:clamp(15px,4.5vw,19px);border-radius:50%;border:2px solid #2d2d4a;display:flex;align-items:center;justify-content:center;font-size:.6rem;flex-shrink:0}.gi .ch.done{background:var(--success);border-color:var(--success)}
.btn{border:none;border-radius:clamp(9px,2.5vw,13px);padding:clamp(10px,2.5vw,14px) clamp(16px,4vw,24px);font-size:clamp(.85rem,3.2vw,1rem);font-weight:700;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}.bs{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff}.bg{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a}
.bsm{padding:clamp(5px,1.5vw,8px) clamp(10px,2.5vw,14px);font-size:clamp(.65rem,2.5vw,.76rem);background:var(--card);border:2px solid #2d2d4a;color:var(--text);cursor:pointer;font-weight:600;border-radius:clamp(6px,2vw,9px)}.bsm:active{transform:scale(.97)}
.br{display:flex;gap:clamp(4px,1.5vw,8px)}
#battle-screen{gap:clamp(5px,1.5vh,9px)}
.bt{display:flex;align-items:center;gap:5px;width:100%}.hearts{display:flex;gap:2px;font-size:clamp(.9rem,3.5vw,1.1rem)}.heart.lost{opacity:.2}
.cmb{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:2px 7px;border-radius:12px;font-size:clamp(.55rem,2.2vw,.68rem);opacity:0}.cmb.on{opacity:1;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.qb{background:var(--card);border-radius:clamp(10px,3vw,14px);padding:clamp(14px,3vw,18px);text-align:center;border:2px solid #2d2d4a;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.qt{font-size:clamp(.88rem,3.5vw,1.2rem);font-weight:700;line-height:1.6}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,7px);width:100%}
.opt{background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(7px,2.5vw,10px);padding:clamp(9px,2.5vw,13px);font-size:clamp(.72rem,2.8vw,.9rem);color:var(--text);cursor:pointer;text-align:center;font-weight:600;word-break:break-word}.opt:active{transform:scale(.96)}
.opt.ok{background:var(--success);border-color:var(--success);color:#fff;animation:pop .3s}.opt.no{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}.opt:disabled{pointer-events:none;opacity:.6}.opt:disabled.ok,.opt:disabled.no{opacity:1}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{font-size:clamp(.78rem,3vw,.95rem);font-weight:900;text-align:center;min-height:18px}.fb.good{color:var(--success)}.fb.bad{color:var(--danger)}
.spk{background:rgba(99,102,241,.2);border:1.5px solid var(--accent);color:var(--accent);border-radius:14px;padding:clamp(4px,1vw,6px) clamp(8px,2.5vw,12px);font-size:clamp(.6rem,2.5vw,.72rem);cursor:pointer;display:inline-flex;align-items:center;gap:2px}.spk:active{background:rgba(99,102,241,.4)}
.sf{position:fixed;inset:0;pointer-events:none;z-index:180;opacity:0;transition:opacity .15s}.sf.green{background:rgba(34,197,94,.1);opacity:1}.sf.red{background:rgba(239,68,68,.1);opacity:1}.sf.gold{background:rgba(240,192,64,.15);opacity:1}
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.pt{position:absolute;font-size:clamp(.8rem,3.5vw,1.3rem);animation:pUp .7s ease-out forwards}
@keyframes pUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(.3) rotate(18deg)}}
.rp{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(1.5rem,5.5vw,2rem);font-weight:900;z-index:150;pointer-events:none;animation:rB .9s ease-out forwards}
@keyframes rB{0%{transform:translate(-50%,-50%) scale(0);opacity:1}30%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
#result-screen{gap:clamp(7px,2vh,10px);justify-content:center;padding-top:clamp(8px,3vh,16px)}
.ri{font-size:clamp(2.2rem,9vw,3.5rem)}.rti{font-size:clamp(1rem,4vw,1.3rem);font-weight:900;text-align:center}
.rs{display:flex;gap:clamp(4px,1.5vw,7px);width:100%}.rst{flex:1;border-radius:clamp(7px,2.5vw,10px);padding:clamp(6px,2vw,10px);text-align:center}
.rst .rv{font-size:clamp(.9rem,3.5vw,1.15rem);font-weight:900}.rst .rl{color:var(--muted);font-size:clamp(.46rem,1.8vw,.58rem)}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.mod{background:var(--card);border-radius:clamp(12px,4vw,16px);padding:clamp(16px,5vw,24px);text-align:center;max-width:clamp(290px,85vw,380px);width:92%;border:2px solid #2d2d4a}
.ts{width:100%;overflow-x:auto;white-space:nowrap;padding:3px 0;-webkit-overflow-scrolling:touch}.ts::-webkit-scrollbar{display:none}
.tc{display:inline-block;background:var(--card);border:2px solid #2d2d4a;border-radius:clamp(7px,2.5vw,10px);padding:clamp(5px,1.5vw,7px) clamp(8px,2.5vw,12px);margin-right:clamp(3px,1.5vw,5px);text-align:center;cursor:pointer;font-size:clamp(.6rem,2.2vw,.72rem);font-weight:600;color:var(--text)}.tc:active{transform:scale(.95)}.tc.ex{border-color:var(--gold);background:rgba(240,192,64,.1)}.tc .em{font-size:clamp(.8rem,3.5vw,1.1rem);display:block}
.lesson-step{text-align:center;width:100%}.lesson-step .big-e{font-size:clamp(1.8rem,9vw,3.5rem);display:block;margin-bottom:5px}.lesson-step h3{font-size:clamp(.95rem,4vw,1.2rem);margin-bottom:4px}.lesson-step p{color:var(--muted);font-size:clamp(.75rem,3vw,.88rem);line-height:1.6;margin-bottom:7px}
.lesson-step .sent{font-size:clamp(.95rem,4.5vw,1.3rem);font-weight:700;padding:clamp(5px,2vw,9px);background:var(--card);border-radius:7px;margin:5px 0;display:inline-block}
.lesson-step .sent .s{color:#60a5fa}.lesson-step .sent .v{color:#f87171}.lesson-step .sent .o{color:#4ade80}.lesson-step .sent .c{color:#fbbf24}
.lesson-step .sent .tap{cursor:pointer;padding:1px 3px;border-radius:3px;transition:all .2s}.lesson-step .sent .tap.flash{animation:flash .4s}
@keyframes flash{0%,100%{background:transparent}50%{background:rgba(34,197,94,.5)}}
.q-passage{font-size:clamp(.7rem,2.8vw,.85rem);line-height:1.8;text-align:left;padding:clamp(8px,2.5vw,14px);border-radius:10px;border:2px solid #2d2d4a;max-height:clamp(130px,30vh,240px);overflow-y:auto;white-space:pre-wrap;background:var(--card)}
.boss-name{font-size:clamp(1rem,4.5vw,1.4rem);font-weight:900;color:var(--danger)}.boss-hp-bar{width:80%;max-width:260px;height:clamp(13px,4vw,17px);background:#2d2d4a;border-radius:10px;overflow:hidden;margin:3px auto}.boss-hp-fill{height:100%;background:linear-gradient(90deg,var(--danger),#ff6b6b);border-radius:10px;transition:width .5s}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#f0c040;padding:6px 12px;border-radius:9px;font-size:13px;z-index:300;border:1px solid #f0c040;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="flash" class="sf"></div>

<!-- HOME -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div><div class="sb">同等学力申硕 · RPG训练营 <b style="color:var(--accent)">v9.1</b></div>
  <div class="card char-card w"><div class="av" id="ha">📖</div><div class="ci"><div class="cn" id="hn">英语难民</div><div class="cl" id="hl">Lv.1</div><div class="xb"><div class="xf" id="hx" style="width:0%"></div></div><div style="font-size:clamp(.53rem,2vw,.62rem);color:var(--muted)" id="hxt">0/100 XP</div></div></div>
  <div class="stats w"><div class="st card"><div class="v" style="color:var(--combo)" id="ss">0</div><div class="l">🔥签到</div></div><div class="st card"><div class="v" style="color:var(--gold)" id="sc">0</div><div class="l">🪙金币</div></div><div class="st card"><div class="v" style="color:#22d3ee" id="sb">0</div><div class="l">💎连击</div></div><div class="st card"><div class="v" style="color:#a855f7" id="sr">0</div><div class="l">🧠复习</div></div></div>
  <div class="card guide w" id="gc"><h3>📅 今日修炼指南</h3><div id="gi"></div><div style="font-size:clamp(.54rem,2vw,.64rem);color:var(--muted);margin-top:3px;text-align:right" id="gr"></div></div>
  <button class="btn bp w" onclick="startBattle()" id="bb">⚡ 快速战斗 (5题)</button>
  <button class="btn bs w" onclick="startLesson()">📖 互动语法课</button>
  <div class="br w"><button class="bsm" onclick="startReading()" style="flex:1;color:var(--gold)">📰 阅读实战</button><button class="bsm" onclick="startWrite()" style="flex:1;color:var(--xp)">✍️ 写作填空</button></div>
  <div class="br w"><button class="bsm" onclick="openShop()" style="flex:1;color:var(--gold)">🛒</button><button class="bsm" onclick="openAch()" style="flex:1;color:#22d3ee">🏅</button></div>
  <div style="color:var(--muted);font-size:clamp(.5rem,2vw,.6rem);margin-top:1px" class="w">🎯 自选专题</div>
  <div class="ts w" id="ts"></div>
  <button onclick="resetGame()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 10px;border-radius:5px;font-size:clamp(.5rem,2vw,.6rem);cursor:pointer">🔄 重置</button>
</div>

<!-- TUTORIAL -->
<div id="tut-screen" class="screen"><div class="w" style="text-align:center"><div style="font-size:clamp(1.8rem,9vw,3.5rem);display:block;margin-bottom:6px" id="te"></div><h3 id="tt" style="font-size:clamp(.95rem,4vw,1.2rem)"></h3><p id="tp" style="color:var(--muted);font-size:clamp(.75rem,3vw,.88rem);line-height:1.6"></p></div><div class="br w" style="margin-top:10px"><button class="bsm" id="tprev" onclick="tPrev()" style="flex:1">←</button><button class="btn bp" id="tnext" onclick="tNext()" style="flex:1">→</button></div></div>

<!-- LESSON -->
<div id="lsn-screen" class="screen"><div class="lesson-step w" id="lc"></div><div class="br w" style="margin-top:8px"><button class="bsm" id="lprev" onclick="lPrev()" style="flex:1">←</button><button class="btn bp" id="lnext" onclick="lNext()" style="flex:1">→</button></div></div>

<!-- READING -->
<div id="read-screen" class="screen" style="align-items:stretch;gap:clamp(4px,1.2vh,7px)"><div style="display:flex;align-items:center;gap:5px" class="w"><button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 7px;border-radius:4px;font-size:clamp(.58rem,2.2vw,.65rem);cursor:pointer">←</button><span style="color:var(--muted);font-size:clamp(.62rem,2.5vw,.75rem)">📰 阅读实战</span><span style="margin-left:auto;color:var(--combo);font-weight:700;font-size:clamp(.7rem,2.8vw,.85rem)" id="rt">⏱ 8:00</span></div>
<div id="rp" class="q-passage w"></div><div class="qt w" id="rq"></div><div class="fb w" id="rfb"></div><div class="opts w" id="ro"></div></div>

<!-- WRITE -->
<div id="write-screen" class="screen" style="align-items:stretch;gap:clamp(4px,1.2vh,7px)"><div style="display:flex;align-items:center;gap:5px" class="w"><button onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:3px 7px;border-radius:4px;font-size:clamp(.58rem,2.2vw,.65rem);cursor:pointer">←</button><span style="color:var(--muted);font-size:clamp(.62rem,2.5vw,.75rem)">✍️ 写作填空</span><span style="margin-left:auto;font-size:clamp(.56rem,2.2vw,.65rem);color:var(--muted)" id="wc">1/5</span></div><div class="card w" style="font-size:clamp(.8rem,3vw,.95rem);line-height:2" id="wp"></div><div class="br w"><input type="text" id="wi" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false" style="flex:1;background:var(--card);border:2px solid var(--accent);border-radius:8px;padding:10px;color:var(--text);font-size:clamp(.76rem,2.8vw,.88rem);outline:none"><button class="bsm" onclick="checkW()" style="max-width:52px;background:var(--accent);color:#fff;border:none">提交</button></div><div style="text-align:center;font-size:clamp(.72rem,2.8vw,.84rem);min-height:18px" id="wf"></div></div>

<!-- BATTLE -->
<div id="battle-screen" class="screen"><div class="bt w"><button onclick="confirmQuit()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:2px 7px;border-radius:4px;font-size:clamp(.54rem,2vw,.62rem);cursor:pointer">←</button><div class="hearts" id="hearts"></div><button onclick="spkB()" class="spk" id="b-spk">🔊</button><div class="cmb" id="cb"></div></div><div style="color:var(--muted);font-size:clamp(.58rem,2.2vw,.68rem);width:100%" id="qc"></div><div class="qb w"><div class="qt" id="qt"></div></div><div class="fb w" id="fb"></div><div class="opts w" id="op"></div><div style="font-size:clamp(.48rem,1.8vw,.58rem);color:var(--muted);text-align:center" id="rh"></div></div>

<!-- BOSS -->
<div id="boss-screen" class="screen"><div style="text-align:center" class="w"><div style="font-size:clamp(1.6rem,9vw,2.8rem)" id="bi"></div><div class="boss-name" id="bn"></div><div style="color:var(--muted);font-size:clamp(.58rem,2.5vw,.7rem);margin:2px 0">Boss战！</div><div class="boss-hp-bar"><div class="boss-hp-fill" id="bhf" style="width:100%"></div></div><div style="font-size:clamp(1rem,4.5vw,1.5rem);font-weight:900;color:var(--combo)" id="btimer"></div></div><div class="qb w"><div class="qt" id="bq"></div></div><div class="fb w" id="bfb"></div><div class="opts w" id="bo"></div></div>

<!-- RESULT -->
<div id="result-screen" class="screen"><div class="ri" id="ri"></div><div class="rti" id="rti"></div><div class="rs w"><div class="rst card"><div class="rv" id="rc">0</div><div class="rl">✅正确</div></div><div class="rst card"><div class="rv" id="rm">0</div><div class="rl">🔥连击</div></div><div class="rst card"><div class="rv" id="rhp">3</div><div class="rl">❤️血量</div></div><div class="rst card"><div class="rv" style="color:var(--gold)" id="rcc">0</div><div class="rl">🪙金币</div></div></div><div style="color:var(--xp);font-weight:900;font-size:clamp(.82rem,3vw,.95rem);text-align:center" id="rxp"></div><div style="display:flex;gap:3px;flex-wrap:wrap;justify-content:center;width:100%" id="rloot"></div><div id="rlv"></div><button class="btn bs w" onclick="startLesson()">📖 哪里不会学哪里</button><button class="btn bp w" onclick="startBattle()">🔁 再来一局</button><button onclick="goHome()" class="w" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:5px 12px;border-radius:5px;font-size:clamp(.6rem,2.2vw,.68rem);cursor:pointer">🏠 回城</button></div>

<!-- MODALS -->
<div id="particles"></div>
<div id="lvl-mod" class="mo" style="display:none"><div class="mod"><div style="font-size:2.5rem">🎉</div><h2 id="lvl-t"></h2><p id="lvl-d"></p><button class="btn bg w" onclick="document.getElementById('lvl-mod').style.display='none'">太棒了！</button></div></div>
<div id="boss-mod" class="mo" style="display:none"><div class="mod"><div style="font-size:2.5rem" id="bm-i"></div><h2 id="bm-t"></h2><p id="bm-d"></p><button class="btn bg w" onclick="document.getElementById('boss-mod').style.display='none';goHome()">收下奖励</button></div></div>
<div id="shop-mod" class="mo" style="display:none"><div class="mod" style="max-width:clamp(300px,88vw,420px)"><h2>🛒 道具商店</h2><p style="color:var(--gold)">🪙 <span id="shb">0</span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,7px);width:100%" id="sg"></div><button class="bsm" onclick="document.getElementById('shop-mod').style.display='none'" style="margin-top:8px;width:100%">关闭</button></div></div>
<div id="ach-mod" class="mo" style="display:none"><div class="mod" style="max-width:clamp(300px,88vw,420px)"><h2>🏅 成就殿堂</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:clamp(4px,1.5vw,5px);width:100%" id="ag"></div><button class="bsm" onclick="document.getElementById('ach-mod').style.display='none'" style="margin-top:8px;width:100%">关闭</button></div></div>

<script>
// ==================== TTS (US English priority, female voice) ====================
function toast(m,d){d=d||2000;const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .5s';setTimeout(()=>e.remove(),500)},d)}
function speak(t,r){
  const c=(typeof t==='string'?t.replace(/<[^>]*>/g,'').replace(/\[.*?\]/g,'').trim():String(t));if(!c||c.length<1)return;
  if('speechSynthesis'in window){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(c);const vs=speechSynthesis.getVoices();const enUSf=vs.find(v=>v.lang==='en-US'&&v.name.includes('Female'));const enUS=vs.find(v=>v.lang==='en-US');const enGB=vs.find(v=>v.lang==='en-GB');const enAny=vs.find(v=>v.lang.startsWith('en'));if(enUSf)u.voice=enUSf;else if(enUS)u.voice=enUS;else if(enGB)u.voice=enGB;else if(enAny)u.voice=enAny;u.lang='en-US';u.rate=r||0.85;u.volume=1;let h=false;u.onstart=()=>{h=true};u.onerror=()=>{if(!h)spkA(c)};u.onend=()=>{if(!h)spkA(c)};speechSynthesis.speak(u);setTimeout(()=>{if(!h){speechSynthesis.cancel();spkA(c)}},600);return}catch(e){}}
  spkA(c);
}

function rLsn(){const s=lc.steps[lss];let h='';if(s.type==='show'){h='<div class="big-e">'+lc.icon+'</div><h3>'+s.t+'</h3><p>'+s.p+'</p>'+s.html+(s.extra||'')}else if(s.type==='tap'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p>'+s.html;ltd=false}else if(s.type==='quiz'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p><div class="qb w" style="margin-top:6px"><div class="qt">'+s.q.q+'</div></div><div class="opts w" id="lqo" style="margin-top:4px"></div><div class="fb" id="lqf"></div>'}else if(s.type==='practice'){h='<h3>'+s.t+'</h3><p>'+s.p+'</p><div class="qb w" style="margin-top:6px"><div class="qt" id="lpq"></div></div><div class="opts w" id="lpo" style="margin-top:4px"></div><div class="fb" id="lpf"></div>';lp=0}
  document.getElementById('lc').innerHTML=h;document.getElementById('lprev').style.display=lss===0?'none':'inline-flex';document.getElementById('lnext').style.display=s.type==='quiz'||s.type==='practice'?'none':'inline-flex';document.getElementById('lnext').textContent=lss>=lc.steps.length-1?'完成→':'下一步→';
  if(s.type==='quiz')rLsnQ(s.q);if(s.type==='practice')rLsnP();}
function lTap(el){if(ltd)return;const s=lc.steps[lss];const ok=el.dataset.ans==='1';el.classList.add('flash');ltd=true;if(ok){sfxOK();flash('green');rp('✅','找到了！')}else{sfxNO();flash('red');toast('不对。'+s.hint);setTimeout(()=>{ltd=false;el.classList.remove('flash')},800)}}
function rLsnQ(q){const o=document.getElementById('lqo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{const ok=i===q.a;b.classList.add(ok?'ok':'no');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);const fb=document.getElementById('lqf');if(ok){fb.textContent='✅';fb.className='fb good';sfxOK();flash('green')}else{fb.innerHTML='❌ <b>'+q.o[q.a]+'</b><br><small>'+q.h+'</small>';fb.className='fb bad';sfxNO();flash('red')}document.getElementById('lnext').style.display='inline-flex';setTimeout(lNext,ok?700:1600)};o.appendChild(b)})}
function rLsnP(){if(lp>=3){lNext();return}const q=lc.steps[lss].qs[lp];document.getElementById('lpq').textContent=q.q;const o=document.getElementById('lpo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{const ok=i===q.a;b.classList.add(ok?'ok':'no');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);const fb=document.getElementById('lpf');if(ok){fb.textContent='✅';fb.className='fb good';sfxOK();flash('green');lp++;setTimeout(rLsnP,500)}else{fb.innerHTML='❌ <b>'+q.o[q.a]+'</b>';fb.className='fb bad';sfxNO();flash('red');setTimeout(rLsnP,1200)}};o.appendChild(b)})}
function lNext(){if(lc&&lss<lc.steps.length-1){lss++;rLsn()}else{if(lc){S.lsnD=[...(S.lsnD||[]),lc.id];S.xp+=30;ss(S)}goHome();toast('🎉 课程完成！+30XP')}}

let rd=null,ri=0,rtI=null,rs=0,rcr=0;
function startReading(){const r=READINGS[Math.floor(Math.random()*READINGS.length)];rd=r;ri=0;rcr=0;rs=480;ssr('read-screen');document.getElementById('rp').textContent=r.text;document.getElementById('rt').textContent='⏱ 8:00';sRQ();rtI=setInterval(()=>{rs--;const m=Math.floor(rs/60),s=rs%60;document.getElementById('rt').textContent='⏱ '+m+':'+(s<10?'0':'')+s;if(rs<=0){clearInterval(rtI);eR()}},1000)}

function eR(){clearInterval(rtI);const e=rcr*20;S.xp+=e;S.tq+=rd.qs.length;S.tc+=rcr;ss(S);goHome();toast('📰 '+rcr+'/'+rd.qs.length+' +'+e+'XP')}

let wi=0,wc=0;
function startWrite(){wi=0;wc=0;showW();ssr('write-screen')}
function showW(){if(wi>=WX.length){const e=wc*15;S.xp+=e;S.wd=(S.wd||0)+wc;ss(S);goHome();toast('✍️ +'+e+'XP');return}const x=WX[wi];document.getElementById('wp').innerHTML=x.p;document.getElementById('wi').value='';document.getElementById('wf').textContent='';document.getElementById('wc').textContent=(wi+1)+'/'+WX.length;document.getElementById('wi').focus()}
function checkW(){const x=WX[wi];const inp=document.getElementById('wi').value.trim().toLowerCase();const fb=document.getElementById('wf');if(inp===x.a.toLowerCase()||lDist(inp,x.a.toLowerCase())<=2){wc++;fb.innerHTML='✅ '+x.a;fb.style.color='var(--success)';sfxOK();flash('green');setTimeout(()=>{wi++;showW()},800)}else{fb.innerHTML='❌ 提示:'+x.h;fb.style.color='var(--danger)';sfxNO();flash('red');document.getElementById('wi').select()}}
function lDist(a,b){const m=a.length,n=b.length;const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)dp[i][0]=i;for(let j=0;j<=n;j++)dp[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return dp[m][n]}

// ==================== BATTLE ====================
function startBattle(to){
  bs={xb:1,cb:1,sh:0,ss:0,cs:0};['p3','p4','p2','p5','p6'].forEach(id=>{if(S.inv[id]&&S.inv[id]>0){if(id==='p3')bs.xb=2;else if(id==='p4')bs.cb=2;else if(id==='p2')bs.sh=1;else if(id==='p5')bs.ss=1;else if(id==='p6')bs.cs=2;S.inv[id]--;ss(S)}});
  let p=[];
  if(to==='v'){p=sh(VOCAB).slice(0,8).map(w=>vQ(w))}
  else if(to&&B[to]){p=[...B[to]]}
  else{const lv=gl(S.xp);gRQ().slice(0,2).forEach(r=>{const q=B[r.data.bank]?.[r.data.idx];if(q)p.push({...q,_r:true,_rk:r.key})});(lv.banks||[{b:'sen',w:5}]).forEach(({b,w})=>{if(b==='v'){sh(VOCAB).slice(0,Math.ceil(w*2)).forEach(w=>p.push(vQ(w)))}else{const qs=B[b]||[];p.push(...sh(qs).slice(0,Math.min(qs.length,Math.ceil(w*1.5))))}})}
  if(!p.length)p=[vQ(VOCAB[0])];
  const n=Math.min(5,p.length);bt={questions:sh(p).slice(0,n),idx:0,hp:3,combo:bs.cs,mc:0,cor:0,rxp:0,coins:0,drops:[]};ft=to||null;if(bs.sh>0)bt.shd=true;ssr('battle-screen');rBH();rBCB();rBQC();sBQ()}
function rBH(){let h='';for(let i=0;i<3;i++)h+='<span class="heart'+(i>=bt.hp?' lost':'')+'">'+(i>=bt.hp?'🖤':'❤️')+'</span>';if(bs.sh>0)h+=' 🛡️';document.getElementById('hearts').innerHTML=h}
function rBCB(){const b=document.getElementById('cb');if(bt.combo>=2){b.textContent='🔥 x'+bt.combo;b.classList.add('on')}else b.classList.remove('on')}
function rBQC(){const q=bt.questions[bt.idx];const tag=q?._r?' <span style="color:var(--accent);font-size:.6rem">🧠</span>':'';document.getElementById('qc').innerHTML=(bt.idx+1)+'/5'+tag;document.getElementById('rh').textContent=''}
function sBQ(){if(bt.idx>=bt.questions.length||bt.hp<=0){eB();return}const q=bt.questions[bt.idx];document.getElementById('qt').innerHTML=q.q;document.getElementById('fb').textContent='';document.getElementById('fb').className='fb';const o=document.getElementById('op');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>aBQ(i);o.appendChild(b)});rBQC();if(!q._r&&Math.random()>0.85)document.getElementById('rh').textContent='🍀 可能暴击！'}
function aBQ(idx){
  const q=bt.questions[bt.idx];const ok=idx===q.a;document.querySelectorAll('#op .opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok')});if(!ok)document.querySelectorAll('#op .opt')[idx].classList.add('no');
  if(!ft){const bk=Object.keys(B).find(k=>B[k]&&B[k].some&&B[k].some(x=>x.q===q.q))||'v';const bi=(B[bk]||[]).findIndex?.(x=>x.q===q.q)??-1;if(bi>=0)uR(bk,bi,ok);if(ok&&q._r)S.rdn=(S.rdn||0)+1}
  if(ok){bt.cor++;bt.combo++;if(bt.combo>bt.mc)bt.mc=bt.combo;const r=Math.random();let bx=0,bc=0,drop='';if(r>0.88){bx=rnd(20,30);bc=rnd(15,25);drop='⚡超级暴击！';vibe()}else if(r>0.72){bx=rnd(10,15);bc=rnd(5,15);drop='🌟幸运暴击！'}else if(r>0.5){bc=rnd(3,8);drop='💰金币！'}else{sfxOK()}if(bt.combo>=3){bx+=Math.floor(bt.combo/3)*5;sfxCB()}const e=(10+bx)*bs.xb;const cc=(bc||3)*bs.cb;bt.rxp+=e;bt.coins+=cc;if(drop)bt.drops.push(drop);document.getElementById('fb').innerHTML='✅ '+(drop||'')+' +'+e+'XP +'+cc+'💰'+(bt.combo>=3?' 🔥'+bt.combo:'');document.getElementById('fb').className='fb good';flash('green');pt(window.innerWidth/2,window.innerHeight/2,'✨',5);if(bt.combo>=2)rp('🔥',bt.combo+'连击！');if(bt.combo===3)toast('不错！3连击！');if(bt.combo===5)toast('🔥 五连绝世！');if(drop)pt(window.innerWidth/2,window.innerHeight/2,bx>15?'⚡':'💰',8)
  }else{if(bs.sh>0){bs.sh=0;document.getElementById('fb').innerHTML='🛡️';document.getElementById('fb').className='fb good';flash('green')}else{bt.hp--;if(bs.ss&&bt.combo>0){bs.ss=0;document.getElementById('fb').innerHTML='❌ <b>'+q.o[q.a]+'</b><br>🔒 连击保护！'}else{document.getElementById('fb').innerHTML='❌ <b>'+q.o[q.a]+'</b><br><small>'+q.h+'</small>';bt.combo=0}sfxNO();flash('red');pt(window.innerWidth/2,window.innerHeight/2,'💔',3)}document.getElementById('fb').className='fb bad'}
  if(ok&&(ft||'').startsWith('v'))S.vc++;rBH();rBCB();rBQC();setTimeout(()=>{bt.idx++;sBQ()},ok?650:1800)}
function eB(){S.tq+=bt.questions.length;S.tc+=bt.cor;S.xp+=bt.rxp;S.coins+=bt.coins;S.tcc+=bt.coins;if(bt.mc>S.bc)S.bc=bt.mc;if(bt.cor===bt.questions.length)S.pf++;const ol=S.lv;const nl=gl(S.xp);S.lv=nl.lv;const td=new Date().toDateString();if(S.ddt===td)S.dd=Math.min(3,S.dd+1);else{S.dd=1;S.ddt=td}if(S.dd>=3&&!S._cd){S.coins+=50;S.tcc+=50;S.xp+=30;S._cd=true}if(S.lpd){const y=new Date(Date.now()-86400000).toDateString();if(S.lpd===y)S.st++;else if(S.lpd!==td)S.st=1}else S.st=1;S.lpd=td;ss(S);checkA();
  ssr('result-screen');const p=bt.cor===bt.questions.length;document.getElementById('ri').textContent=p?'👑':bt.cor>=3?'✨':'💪';document.getElementById('rti').textContent=p?'完美！':bt.cor>=3?'不错！':'加油！';document.getElementById('rc').textContent=bt.cor+'/5';document.getElementById('rm').textContent=bt.mc;document.getElementById('rhp').textContent=bt.hp;document.getElementById('rcc').textContent='+'+bt.coins;document.getElementById('rxp').textContent='+'+bt.rxp+' XP'+(bs.xb>1?'(双倍!)':'');document.getElementById('rloot').innerHTML=bt.drops.length?bt.drops.filter((v,i,a)=>a.indexOf(v)===i).map(d=>'<span style="background:var(--card);border-radius:5px;padding:2px 5px;font-size:.62rem;border:1px solid #2d2d4a">'+d+'</span>').join(''):'';if(nl.lv>ol){sfxLV();document.getElementById('rlv').innerHTML='<div style="color:var(--gold);font-weight:900;font-size:1rem;margin-top:4px">🎉 '+nl.icon+' '+nl.title+'</div>';pt(window.innerWidth/2,window.innerHeight/2,'🎉',15);flash('gold');setTimeout(()=>{document.getElementById('lvl-t').textContent='晋升 '+nl.title+'！';document.getElementById('lvl-d').textContent=nl.desc+' | '+S.xp+' XP';document.getElementById('lvl-mod').style.display='flex'},400);if(nl.lv===5||nl.lv===10)setTimeout(()=>startBoss(nl.lv),800)}else document.getElementById('rlv').innerHTML=''}
function confirmQuit(){if(confirm('逃走？进度丢失。'))goHome()}

// ==================== BOSS ====================

function startBoss(lv){const cfg=lv===5?{n:'词汇巨兽',e:'🐉',hp:5,t:45,rw:400,bks:['sen','cl']}:{n:'语法魔龙',e:'👹',hp:8,t:60,rw:900,bks:['sen','cl','tc','ex']};let p=[];cfg.bks.forEach(b=>{p=p.concat(sh(B[b]||[]).slice(0,10))});p=p.concat(sh(VOCAB).slice(0,5).map(w=>vQ(w)));boss={cfg,p:sh(p),idx:0,bHP:cfg.hp,pHP:3,t:cfg.t,cor:0};document.getElementById('bi').textContent=cfg.e;document.getElementById('bn').textContent=cfg.n;document.getElementById('bhf').style.width='100%';document.getElementById('btimer').textContent='⏱ '+cfg.t+'s';ssr('boss-screen');bossTick();sBSQ()}
