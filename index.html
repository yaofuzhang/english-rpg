<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>英语征途 · Degree English RPG</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#1a1a2e;--gold:#f0c040;--xp:#4ade80;--hp:#f87171;--combo:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--success:#22c55e;--danger:#ef4444}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;align-items:center;padding:20px 16px 40px;min-height:100dvh}
.screen.active{display:flex}
/* HOME */
#home-screen{justify-content:center;gap:20px}
.game-title{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.game-subtitle{color:var(--muted);font-size:.9rem;text-align:center;margin-top:-12px}
.character-card{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:340px;display:flex;align-items:center;gap:14px;border:2px solid #2d2d4a}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
.char-info{flex:1;min-width:0}
.char-name{font-weight:700;font-size:1rem}
.char-title{color:var(--muted);font-size:.75rem;margin-top:2px}
.xp-bar-wrap{height:6px;background:#2d2d4a;border-radius:3px;margin-top:6px;overflow:hidden}
.xp-bar-fill{height:100%;background:var(--xp);border-radius:3px;transition:width .5s}
.xp-text{font-size:.7rem;color:var(--muted);margin-top:2px}
.stats-row{display:flex;gap:10px;width:100%;max-width:340px}
.stat-box{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center;border:2px solid #2d2d4a}
.stat-val{font-size:1.4rem;font-weight:900}
.stat-val.fire{color:var(--combo)}.stat-val.gold{color:var(--gold)}.stat-val.ice{color:#60a5fa}
.stat-label{color:var(--muted);font-size:.65rem;margin-top:2px}
.btn{border:none;border-radius:14px;padding:14px 32px;font-size:1.05rem;font-weight:700;cursor:pointer;transition:transform .15s,box-shadow .15s;width:100%;max-width:340px;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 20px rgba(99,102,241,.4)}
.btn-learn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 4px 20px rgba(34,197,94,.3)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#f59e0b);color:#0a0a0a;box-shadow:0 4px 20px rgba(240,192,64,.3)}
.btn-small{padding:10px 20px;font-size:.85rem;max-width:180px}
.btn-back{background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:8px 18px}

/* LEARN */
#learn-screen{gap:16px;align-items:stretch;padding:20px}
.learn-header{display:flex;align-items:center;gap:12px}
.learn-content{background:var(--card);border-radius:16px;padding:20px;border:2px solid #2d2d4a;line-height:1.8;font-size:.95rem;overflow-y:auto;flex:1;max-height:calc(100dvh - 160px)}
.learn-content h3{color:var(--gold);margin:16px 0 8px;font-size:1.1rem}
.learn-content h3:first-child{margin-top:0}
.learn-content .ex{background:#0a0a0a;border-radius:8px;padding:12px;margin:8px 0;font-family:monospace;font-size:.85rem;border-left:3px solid var(--accent)}
.learn-content .tip{background:rgba(240,192,64,.1);border-radius:8px;padding:10px;margin:8px 0;font-size:.85rem;border-left:3px solid var(--gold)}
.learn-content .wrong-spot{background:rgba(248,113,113,.1);border-radius:8px;padding:10px;margin:8px 0;font-size:.85rem;border-left:3px solid var(--danger)}
.learn-actions{padding:12px 0;text-align:center}

/* BATTLE */
#battle-screen{gap:14px}
.battle-header{display:flex;align-items:center;gap:10px;width:100%;max-width:400px}
.hearts{display:flex;gap:4px;font-size:1.3rem}
.heart{transition:transform .3s,opacity .3s}
.heart.lost{opacity:.2;transform:scale(.8)}
.combo-badge{margin-left:auto;background:var(--combo);color:#0a0a0a;font-weight:900;padding:4px 10px;border-radius:20px;font-size:.75rem;opacity:0;transition:opacity .3s}
.combo-badge.active{opacity:1}
.question-counter{color:var(--muted);font-size:.75rem;width:100%;max-width:400px}
.dot{width:8px;height:8px;border-radius:50%;background:#2d2d4a;transition:background .3s;display:inline-block;margin:0 2px}
.dot.done{background:var(--success)}.dot.wrong{background:var(--danger)}.dot.current{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.question-box{background:var(--card);border-radius:18px;padding:24px 18px;width:100%;max-width:400px;text-align:center;border:2px solid #2d2d4a;min-height:90px;display:flex;align-items:center;justify-content:center}
.question-text{font-size:1.2rem;font-weight:700;line-height:1.6}
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:400px}
.option-btn{background:var(--card);border:2px solid #2d2d4a;border-radius:14px;padding:15px;font-size:.95rem;color:var(--text);cursor:pointer;transition:all .15s;text-align:center;font-weight:600}
.option-btn:active{transform:scale(.96)}
.option-btn.correct{background:var(--success);border-color:var(--success);color:#fff;animation:popIn .3s}
.option-btn.wrong{background:var(--danger);border-color:var(--danger);color:#fff;animation:shake .4s}
.option-btn:disabled{pointer-events:none;opacity:.6}
.option-btn:disabled.correct,.option-btn:disabled.wrong{opacity:1}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.feedback-text{font-size:1.1rem;font-weight:900;text-align:center;min-height:28px}
.feedback-text.good{color:var(--success)}.feedback-text.bad{color:var(--danger)}

/* RESULT */
#result-screen{gap:18px;justify-content:center}
.result-icon{font-size:3.5rem}
.result-title{font-size:1.5rem;font-weight:900;text-align:center}
.result-stats{display:flex;gap:10px;width:100%;max-width:340px}
.result-stat{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:2px solid #2d2d4a}
.result-stat .val{font-size:1.3rem;font-weight:900}
.result-stat .lbl{color:var(--muted);font-size:.65rem;margin-top:2px}
.xp-gain{color:var(--xp);font-weight:900;font-size:1.1rem;text-align:center}

/* PARTICLES */
#particles{position:fixed;inset:0;pointer-events:none;z-index:200}
.particle{position:absolute;font-size:1.4rem;animation:particleUp .8s ease-out forwards}
@keyframes particleUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(.5) rotate(20deg)}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
.modal{background:var(--card);border-radius:20px;padding:30px 24px;text-align:center;max-width:320px;width:90%;border:2px solid #2d2d4a}
.modal h2{font-size:1.5rem;margin-bottom:8px}
.modal p{color:var(--muted);margin-bottom:16px;font-size:.9rem}

/* TOPIC PICKER */
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:340px}
.topic-chip{background:var(--card);border:2px solid #2d2d4a;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--text);transition:all .15s}
.topic-chip:active{transform:scale(.96)}
.topic-chip.active{border-color:var(--accent);background:rgba(99,102,241,.15)}
.topic-chip .emoji{font-size:1.3rem;display:block;margin-bottom:4px}

@media(max-width:360px){.game-title{font-size:1.8rem}.question-text{font-size:1.05rem}.option-btn{font-size:.82rem;padding:12px 8px}}
</style>
</head>
<body>

<!-- ========== HOME ========== -->
<div id="home-screen" class="screen active">
  <div class="game-title">⚔️ 英语征途</div>
  <div class="game-subtitle">同等学力申硕 · RPG 训练营</div>

  <div class="character-card">
    <div class="avatar" id="avatar-icon">📖</div>
    <div class="char-info">
      <div class="char-name" id="char-name">英语难民</div>
      <div class="char-title" id="char-title">Lv.1 · 从五大句型开始</div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xp-bar" style="width:0%"></div></div>
      <div class="xp-text" id="xp-text">0 / 100 XP</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box"><div class="stat-val fire" id="stat-streak">0</div><div class="stat-label">🔥 签到</div></div>
    <div class="stat-box"><div class="stat-val gold" id="stat-total">0</div><div class="stat-label">⭐ XP</div></div>
    <div class="stat-box"><div class="stat-val ice" id="stat-best">0</div><div class="stat-label">💎 连击</div></div>
  </div>

  <button class="btn btn-learn" onclick="startLearn()">📖 学习 · 今日课程</button>
  <button class="btn btn-primary" onclick="startBattle()">⚔️ 战斗 · 检验所学</button>

  <div style="color:var(--muted);font-size:.75rem;margin-top:4px">🎯 自选专题练习</div>
  <div class="topic-grid" id="topic-grid"></div>

  <button onclick="resetGame()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a;padding:8px 20px;border-radius:10px;font-size:.8rem;cursor:pointer">🔄 重置存档</button>
</div>

<!-- ========== LEARN ========== -->
<div id="learn-screen" class="screen">
  <div class="learn-header">
    <button class="btn-back" onclick="goHome()">← 回城</button>
    <span style="color:var(--muted);font-size:.85rem" id="learn-label">Lv.1 课程</span>
  </div>
  <div class="learn-content" id="learn-content"></div>
  <div class="learn-actions">
    <button class="btn btn-primary" onclick="startBattle()">⚔️ 已学完，开始战斗！</button>
  </div>
</div>

<!-- ========== BATTLE ========== -->
<div id="battle-screen" class="screen">
  <div class="battle-header">
    <button class="btn-back" onclick="confirmQuit()" style="font-size:.75rem;padding:6px 12px">← 逃走</button>
    <div class="hearts" id="hearts"></div>
    <div class="combo-badge" id="combo-badge">🔥 x1</div>
  </div>
  <div class="question-counter" id="question-counter"></div>
  <div class="question-box"><div class="question-text" id="question-text"></div></div>
  <div class="feedback-text" id="feedback"></div>
  <div class="options-grid" id="options"></div>
</div>

<!-- ========== RESULT ========== -->
<div id="result-screen" class="screen">
  <div class="result-icon" id="result-icon"></div>
  <div class="result-title" id="result-title"></div>
  <div class="result-stats">
    <div class="result-stat"><div class="val" id="res-correct">0</div><div class="lbl">✅ 正确</div></div>
    <div class="result-stat"><div class="val" id="res-combo">0</div><div class="lbl">🔥 最高连击</div></div>
    <div class="result-stat"><div class="val" id="res-hp">3</div><div class="lbl">❤️ 血量</div></div>
  </div>
  <div class="xp-gain" id="xp-gain"></div>
  <div id="level-up-msg"></div>
  <button class="btn btn-learn" onclick="startLearn()">📖 哪里不会学哪里</button>
  <button class="btn btn-primary" onclick="startBattle()">🔁 再来一局</button>
  <button class="btn-small" onclick="goHome()" style="background:transparent;color:var(--muted);border:1px solid #2d2d4a">🏠 回城</button>
</div>

<!-- ========== MODALS & PARTICLES ========== -->
<div id="particles"></div>
<div id="level-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div style="font-size:3rem">🎉</div>
    <h2 id="level-title">升级！</h2>
    <p id="level-desc"></p>
    <button class="btn btn-gold" onclick="closeLevelModal()">太棒了！</button>
  </div>
</div>

<script>
// ==================== LEVELS ====================
// banks array = [{bankId, weight}] — higher weight = more likely to be picked
const LEVELS=[
  {lv:1,title:'英语难民',xp:0,icon:'📖',desc:'语法词汇双线起步',banks:[{b:'sentence-basic',w:5},{b:'vocab-1',w:3}]},
  {lv:2,title:'语法学徒',xp:120,icon:'📚',desc:'句型巩固 + 词汇扩展',banks:[{b:'sentence-basic',w:4},{b:'vocab-1',w:4},{b:'clause-markers',w:2}]},
  {lv:3,title:'拆句新手',xp:300,icon:'🔍',desc:'从句识别 + 拆句实战',banks:[{b:'sentence-basic',w:3},{b:'vocab-2',w:4},{b:'clause-markers',w:3},{b:'sentence-mixed',w:3}]},
  {lv:4,title:'词汇猎人',xp:550,icon:'🎯',desc:'词汇加速 + 语法深化',banks:[{b:'vocab-2',w:3},{b:'vocab-3',w:4},{b:'sentence-mixed',w:3},{b:'clause-markers',w:3}]},
  {lv:5,title:'词汇大师',xp:900,icon:'💎',desc:'词库翻倍 + 阅读起步',banks:[{b:'vocab-3',w:3},{b:'vocab-4',w:4},{b:'sentence-mixed',w:3},{b:'reading',w:2}]},
  {lv:6,title:'阅读侦察兵',xp:1350,icon:'🕵️',desc:'阅读理解 + 语法综合',banks:[{b:'vocab-4',w:3},{b:'reading',w:3},{b:'cloze',w:2},{b:'sentence-mixed',w:2}]},
  {lv:7,title:'完形战士',xp:1900,icon:'🛡️',desc:'完形搭配 + 翻译入门',banks:[{b:'cloze',w:3},{b:'translation',w:3},{b:'vocab-4',w:2},{b:'reading',w:2}]},
  {lv:8,title:'翻译法师',xp:2550,icon:'🧙',desc:'翻译陷阱 + 完形强化',banks:[{b:'translation',w:3},{b:'cloze',w:3},{b:'reading',w:3},{b:'vocab-4',w:2}]},
  {lv:9,title:'写作骑士',xp:3300,icon:'⚔️',desc:'万能句型 + 模板默写',banks:[{b:'translation',w:3},{b:'reading',w:3},{b:'cloze',w:3},{b:'sentence-mixed',w:2}]},
  {lv:10,title:'及格勇士',xp:4200,icon:'🏆',desc:'全题型混合 · 冲刺60+',banks:[{b:'sentence-basic',w:1},{b:'clause-markers',w:1},{b:'sentence-mixed',w:1},{b:'vocab-4',w:1},{b:'reading',w:2},{b:'cloze',w:2},{b:'translation',w:2}]},
];

// ==================== TEACHING CONTENT ====================
const LESSONS={
  'sentence-basic':`
<h3>📐 五大基本句型</h3>
<p>英文所有句子，无论多长，骨头只有 <b>五种</b>。把修饰成分削掉，骨架跑不出这五个：</p>

<h3>① SV — 主语 + 动词</h3>
<div class="ex">Birds fly. &nbsp;→&nbsp; 鸟飞。<br>The sun rises. &nbsp;→&nbsp; 太阳升起。<br>He laughed. &nbsp;→&nbsp; 他笑了。</div>
<div class="tip">💡 <b>怎么判断：</b>动词后面不接任何东西，意思已经完整。就算后面有时间/地点状语，删掉状语骨架不变。</div>

<h3>② SVO — 主语 + 动词 + 宾语</h3>
<div class="ex">She eats rice. &nbsp;→&nbsp; 她吃米饭。<br>I love you. &nbsp;→&nbsp; 我爱你。<br>He opened the door. &nbsp;→&nbsp; 他开了门。</div>
<div class="tip">💡 <b>怎么判断：</b>动词后面有承受者（名词/代词），问"动词+什么/谁"能答出来。</div>

<h3>③ SVC — 主语 + 系动词 + 补语</h3>
<div class="ex">She is beautiful. &nbsp;→&nbsp; 她很美。<br>He is a teacher. &nbsp;→&nbsp; 他是老师。<br>The food tastes good. &nbsp;→&nbsp; 食物尝起来好。</div>
<div class="tip">💡 <b>怎么判断：</b>动词后面的词是<b>描述主语</b>的身份/状态。系动词不止 be——look/sound/smell/taste/feel/become/get/remain/seem 都是。</div>
<div class="wrong-spot">⚠️ <b>最容易搞混的：SVC vs SVO</b><br><br>She ate a cake. → cake 和 she 是两个东西 → <b>SVO</b><br>She is a teacher. → teacher 就是 she 的身份 → <b>SVC</b><br><br>判断法：动词后名词和主语是"同一回事" → SVC；"不同东西" → SVO</div>

<h3>④ SVOO — 主语 + 动词 + 间接宾语 + 直接宾语</h3>
<div class="ex">She gave me a book. &nbsp;→&nbsp; 她给了我一本书。<br>He told her a story. &nbsp;→&nbsp; 他给她讲了个故事。<br>I'll send you an email. &nbsp;→&nbsp; 我给你发邮件。</div>
<div class="tip">💡 <b>怎么判断：</b>动词后出现<b>两个名词/代词</b>，而且它们指的不是同一个人或东西。高频动词：give, send, tell, teach, show, buy, bring, lend, offer</div>

<h3>⑤ SVOC — 主语 + 动词 + 宾语 + 宾补</h3>
<div class="ex">She made me happy. &nbsp;→&nbsp; 她让我开心。<br>They elected him president. &nbsp;→&nbsp; 他们选他当总统。<br>I found the book interesting. &nbsp;→&nbsp; 我发现这本书很有趣。</div>
<div class="tip">💡 <b>怎么判断：</b>补语说的是<b>宾语</b>的状态。在两个名词间插"是"试试：She made me (是) happy → 读得通 → SVOC。She gave me (是) a book → 读不通 → SVOO</div>

<h3>🎯 五型速查卡</h3>
<div class="ex">
SV &nbsp; = 主语+动词 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Birds fly.<br>
SVO = 主语+动词+宾语 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; She eats rice.<br>
SVC = 主语+系动词+补语 &nbsp;&nbsp; She is tall.<br>
SVOO= 主语+动词+宾+宾 &nbsp;&nbsp; She gave me a pen.<br>
SVOC= 主语+动词+宾+补 &nbsp;&nbsp; She made me happy.
</div>`,

  'clause-markers':`
<h3>🔗 三大从句标记词</h3>
<p>长难句之所以长，是因为<b>句子里套了句子</b>。从句需要一个"标记词"作为入口信号。看到标记词 → 知道从句开始了 → 从句结束回到主句。</p>

<h3>一、名词性从句</h3>
<p>一个句子充当名词的角色。</p>
<div class="ex">
<b>that</b> &nbsp; I know <b>that</b> he is right. 我知道他是对的。<br>
<b>whether/if</b> &nbsp; I wonder <b>whether</b> he will come. 我不知道他会不会来。<br>
<b>what</b> &nbsp; I don't know <b>what</b> he wants. 我不知道他要什么。<br>
<b>who/when/where/why/how</b> &nbsp; 同疑问词用法
</div>

<h3>二、定语从句</h3>
<p>一个句子修饰一个名词。</p>
<div class="ex">
<b>who</b>(人·主语) &nbsp; The man <b>who</b> called you is my boss.<br>
<b>whom</b>(人·宾语) &nbsp; The man <b>whom</b> you called is my boss.<br>
<b>which</b>(物) &nbsp; The book <b>which</b> I read was great.<br>
<b>that</b>(人+物) &nbsp; The book <b>that</b> I read was great.<br>
<b>when</b>(时间) &nbsp; I remember the day <b>when</b> we met.<br>
<b>where</b>(地点) &nbsp; This is the house <b>where</b> I grew up.
</div>

<h3>三、状语从句</h3>
<p>最常考的类型。标记词表示条件/原因/时间/让步。</p>
<div class="ex">
<b>because/since/as</b> &nbsp; 因为... &nbsp; He didn't come <b>because</b> he was sick.<br>
<b>if/unless</b> &nbsp; 如果/除非 &nbsp; <b>If</b> it rains, the match will be cancelled.<br>
<b>although/though</b> &nbsp; 虽然 &nbsp; <b>Although</b> he was tired, he kept working.<br>

  {q:'[真题] 作者说"lifelong learning is no longer a choice but a necessity"表达了什么？',o:['终身学习的必要性和紧迫性','学习是一种自由选择','学习不重要','终身学习是可选的'],a:0,h:'no longer a choice but a necessity=不再是选择而是必需→强调必要性。真题翻译题原文。'},
  {q:'[真题] "despite these concerns"中的despite表示',o:['尽管；让步关系','因为；因果关系','所以；结果关系','而且；递进关系'],a:0,h:'despite=尽管→让步状语从句标记。Despite A, B=尽管有A，B仍然成立。'},
  {q:'[真题] 关于AI对就业的影响，专家的观点是',o:['AI会创造与消灭同样多的新工作','AI会消灭所有工作','AI没有影响','AI只会影响低技能工作'],a:0,h:'会创造新工作来替代失去的。真题原文：AI will create as many new jobs as it eliminates...'},
  {q:'[真题完形] Digital communication is here ___ stay.',o:['to','for','with','in'],a:0,h:'be here to stay=已经到来并将持续存在(固定表达)。here to stay=留下来不走。'},
],
};

// ==================== STATE ====================
const D={xp:0,lv:1,streak:0,lastPlayDate:'',bestCombo:0,totalQ:0,totalC:0};

function ls(){
  try{return JSON.parse(localStorage.getItem('erpg'))||JSON.parse(JSON.stringify(D))}
  catch(e){return JSON.parse(JSON.stringify(D))}
}
function ss(s){localStorage.setItem('erpg',JSON.stringify(s))}

let state=ls();
let battle=null;
let forcedTopic=null; // if user picked a topic manually

// ==================== HELPERS ====================
function gl(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i].xp)return LEVELS[i];return LEVELS[0]}
function xn(lv){return (LEVELS.find(l=>l.lv===lv+1)||{}).xp||9999}
function sh(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// ==================== AUDIO ====================
let ac=null;
function bp(f,d,t,v){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=t||'square';o.frequency.value=f;g.gain.value=v||.08;
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function sfxOK(){bp(523,.1);setTimeout(()=>bp(784,.15),100)}
function sfxNO(){bp(200,.2,'sawtooth',.1)}
function sfxCB(){bp(784,.08);setTimeout(()=>bp(988,.08),80);setTimeout(()=>bp(1175,.12),160)}
function sfxLV(){bp(523,.1);setTimeout(()=>bp(659,.1),120);setTimeout(()=>bp(784,.1),240);setTimeout(()=>bp(1047,.25),360)}

// ==================== PARTICLES ====================
function sp(x,y,e,n){
  const c=document.getElementById('particles');
  for(let i=0;i<(n||8);i++){
    const p=document.createElement('span');p.className='particle';p.textContent=e;
    p.style.left=(x+Math.random()*60-30)+'px';p.style.top=(y+Math.random()*20-10)+'px';
    p.style.animationDuration=(.5+Math.random()*.6)+'s';c.appendChild(p);
    setTimeout(()=>p.remove(),900);
  }
}

// ==================== SCREENS ====================
function ssr(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function goHome(){forcedTopic=null;ssr('home-screen');renderHome()}
function renderHome(){
  const lv=gl(state.xp);
  document.getElementById('avatar-icon').textContent=lv.icon;
  document.getElementById('char-name').textContent=lv.title;
  document.getElementById('char-title').textContent=`Lv.${lv.lv} · ${lv.desc}`;
  const nxt=xn(lv.lv),cur=state.xp-lv.xp;
  document.getElementById('xp-bar').style.width=(cur/nxt*100)+'%';
  document.getElementById('xp-text').textContent=`${cur} / ${nxt} XP`;
  document.getElementById('stat-streak').textContent=state.streak;
  document.getElementById('stat-total').textContent=state.xp;
  document.getElementById('stat-best').textContent=state.bestCombo;
  // Render topic grid
  const topics=[
    {id:'sentence-basic',e:'📐',t:'五大句型',d:'60题·Lv.1-3'},
    {id:'clause-markers',e:'🔗',t:'从句标记',d:'25题·Lv.2-4'},
    {id:'sentence-mixed',e:'🔪',t:'拆句实战',d:'25题·Lv.3-6'},
    {id:'vocab-1',e:'📝',t:'词汇01',d:'词1-30'},
    {id:'vocab-2',e:'📝',t:'词汇02',d:'词31-60'},
    {id:'vocab-3',e:'📝',t:'词汇03',d:'词61-90'},
    {id:'vocab-4',e:'📝',t:'词汇04',d:'词91-120'},
    {id:'reading',e:'📖',t:'阅读态度',d:'20题·Lv.5+'},
    {id:'cloze',e:'🧩',t:'完形搭配',d:'20题·Lv.6+'},
    {id:'translation',e:'🌐',t:'翻译难点',d:'15题·Lv.7+'},
    {id:'exam-real',e:'📄',t:'历年真题',d:'30题·2015-2025'},
  ];
  const g=document.getElementById('topic-grid');
  g.innerHTML=topics.map(t=>`<div class="topic-chip" onclick="startBattle('${t.id}')"><span class="emoji">${t.e}</span>${t.t}<br><small style="color:var(--muted)">${t.d}</small></div>`).join('');
}

// ==================== LEARN MODE ====================
function startLearn(){
  const lv=gl(state.xp);
  document.getElementById('learn-label').textContent=`Lv.${lv.lv} · ${lv.title}`;
  // Build multi-dimensional learn content
  const banks=(lv.banks||[]).map(b=>b.b);
  let html='';
  // Show primary content based on first bank
  const primary=banks[0]||'sentence-basic';
  if(LESSONS[primary]) html+=LESSONS[primary];
  // Append vocab preview for vocab banks in this level
  banks.forEach(b=>{
    if((b.startsWith('vocab-')||b==='reading')&&LESSONS[b]&&!html.includes(LESSONS[b].substring(0,50))){
      html+='<hr style="border-color:#2d2d4a;margin:16px 0">'+LESSONS[b];
    }
  });
  if(!html) html=LESSONS['default'];
  document.getElementById('learn-content').innerHTML=html;
  ssr('learn-screen');
  document.getElementById('learn-content').scrollTop=0;
}

// ==================== BATTLE ====================
function startBattle(topicOverride){
  let pool=[];
  if(topicOverride){
    // Manual topic pick — single bank
    pool=BANKS[topicOverride]||[];
  }else{
    // Level-based multi-bank mixing
    const lv=gl(state.xp);
    const banks=lv.banks||[{b:'sentence-basic',w:5}];
    // Build weighted pool
    banks.forEach(({b,w})=>{
      const qs=BANKS[b]||[];
      const take=Math.min(qs.length,Math.ceil(w*2)); // weight determines how many to sample
      pool=pool.concat(sh(qs).slice(0,take));
    });
  }
  if(!pool||pool.length===0) pool=BANKS['sentence-basic']||[];

  const n=Math.min(10,pool.length);
  const selected=sh(pool).slice(0,n);
  battle={questions:selected,idx:0,hp:3,combo:0,mc:0,cor:0,rxp:0};
  forcedTopic=topicOverride||null;
  ssr('battle-screen');
  rH();uCB();uQC();sQ();
}

function rH(){
  const h=document.getElementById('hearts');
  h.innerHTML=[0,1,2].map(i=>`<span class="heart${i>=battle.hp?' lost':''}">❤️</span>`).join('');
}
function uCB(){
  const b=document.getElementById('combo-badge');
  if(battle.combo>=2){b.textContent=`🔥 x${battle.combo}`;b.classList.add('active')}
  else b.classList.remove('active');
}
function uQC(){
  let d='';
  for(let i=0;i<battle.questions.length;i++){
    d+=`<span class="dot ${i<battle.idx?'done':(i===battle.idx?'current':'')}"></span>`;
  }
  document.getElementById('question-counter').innerHTML=`${battle.idx+1}/${battle.questions.length} ${d}`;
}
function sQ(){
  if(battle.idx>=battle.questions.length||battle.hp<=0){eB();return}
  const q=battle.questions[battle.idx];
  document.getElementById('question-text').textContent=q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback-text';
  const o=document.getElementById('options');o.innerHTML='';
  q.o.forEach((t,i)=>{
    const b=document.createElement('button');b.className='option-btn';
    b.textContent=t;b.onclick=()=>aQ(i);o.appendChild(b);
  });
  uQC();
}
function aQ(idx){
  const q=battle.questions[battle.idx];
  const ok=idx===q.a;
  const btns=document.querySelectorAll('#options .option-btn');
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct')});
  if(!ok)btns[idx].classList.add('wrong');
  const fb=document.getElementById('feedback');
  if(ok){
    battle.cor++;battle.combo++;
    if(battle.combo>battle.mc)battle.mc=battle.combo;
    const base=10+Math.floor(Math.random()*3); // 10-12 XP base
    const cb=Math.floor(battle.combo/3)*5;
    const e=base+cb;battle.rxp+=e;
    sfxOK();if(battle.combo>=3){sfxCB();sp(window.innerWidth/2,window.innerHeight/2,battle.combo>=5?'🔥':'✨')}
    fb.textContent=battle.combo>=3?`🔥 ${battle.combo}连击！+${e}XP`:`✅ 正确！+${e}XP`;
    fb.className='feedback-text good';
  }else{
    battle.hp--;battle.combo=0;sfxNO();
    fb.innerHTML=`❌ 答案是 <b>${q.o[q.a]}</b><br><small style="color:var(--muted)">${q.h}</small>`;
    fb.className='feedback-text bad';sp(window.innerWidth/2,window.innerHeight/2,'💔',3);
  }
  rH();uCB();uQC();
  setTimeout(()=>{battle.idx++;sQ()},ok?700:1800);
}
function eB(){
  state.totalQ+=battle.questions.length;state.totalC+=battle.cor;
  state.xp+=battle.rxp;if(battle.mc>state.bestCombo)state.bestCombo=battle.mc;
  const ol=state.lv;const nl=gl(state.xp);state.lv=nl.lv;
  const today=new Date().toDateString();
  if(state.lastPlayDate){
    const y=new Date(Date.now()-86400000).toDateString();
    if(state.lastPlayDate===y)state.streak++;else if(state.lastPlayDate!==today)state.streak=1;
  }else state.streak=1;
  state.lastPlayDate=today;ss(state);
  ssr('result-screen');
  const p=battle.cor===battle.questions.length;
  const g=battle.cor>=battle.questions.length*0.7;
  document.getElementById('result-icon').textContent=p?'👑':g?'✨':'💪';
  document.getElementById('result-title').textContent=p?'完美通关！':g?'表现不错！':'继续加油！';
  document.getElementById('res-correct').textContent=battle.cor+'/'+battle.questions.length;
  document.getElementById('res-combo').textContent=battle.mc;
  document.getElementById('res-hp').textContent=battle.hp;
  document.getElementById('xp-gain').textContent=`+${battle.rxp} XP`;
  const m=document.getElementById('level-up-msg');
  if(nl.lv>ol){
    sfxLV();m.innerHTML=`<div style="color:var(--gold);font-weight:900;font-size:1.1rem;margin-top:8px">🎉 升级！${nl.icon} ${nl.title}</div>`;
    sp(window.innerWidth/2,window.innerHeight/2,'🎉',15);
    setTimeout(()=>{
      document.getElementById('level-title').textContent=`晋升 ${nl.title}！`;
      document.getElementById('level-desc').textContent=`新称号：${nl.desc}\n总分 ${state.xp} XP`;
      document.getElementById('level-modal').style.display='flex';
    },400);
  }else{m.innerHTML=''}
}
function closeLevelModal(){document.getElementById('level-modal').style.display='none'}
function confirmQuit(){if(confirm('确定要逃跑吗？本轮进度将丢失。'))goHome()}
function resetGame(){if(confirm('确定要重置所有存档吗？')){state=JSON.parse(JSON.stringify(D));ss(state);goHome()}}

// ==================== INIT ====================
renderHome();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
